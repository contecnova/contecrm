# Migraciones. Una carpeta de versiones POR SERVICIO, porque cada uno es dueño
# de su esquema y despliega por su cuenta: una cadena de migraciones común
# obligaría a coordinar despliegues, que es justo lo que la separación en
# servicios viene a evitar.
#
#   alembic -x servicio=tenancy upgrade head
#   alembic -x servicio=identity revision --autogenerate -m "usuarios"

[alembic]
script_location = alembic
prepend_sys_path = .
# Revisiones con fecha delante: al listar el directorio se ve el orden real, y
# dos ramas creadas el mismo día no colisionan por el nombre.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
