# Gates de git. Este repositorio NO tiene CI por decisión de proyecto: lo que en
# otro repositorio comprobaría un servidor, aquí lo comprueba esta máquina.
#
# Instalación, obligatoria:
#
#     pre-commit install
#
# `default_install_hook_types` instala los DOS tipos de una vez. Sin esa línea,
# `pre-commit install` solo pone el de commit y el de pre-push —que es el que
# corre la suite— no llega a existir, con lo que el gate más importante nunca
# se ejecuta y nadie se entera.
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  # ── Por commit: barato o se acaba puenteando con --no-verify ────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      # `ruff`, no `ruff-check`: ese alias no existe en la v0.8.4, que es la
      # versión que fija `requirements-dev.txt`. Con el nombre nuevo,
      # pre-commit abortaba TODO commit con «`ruff-check` is not present in
      # repository» — el gate no es que fallara, es que no llegaba a correr, y
      # con él se caían los demás ganchos del mismo commit.
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        # Los `.patch` y los `.md` quedan fuera: en un diff, un espacio de
        # contexto es significativo, y en markdown dos espacios finales son un
        # salto de línea.
        exclude: '\.(patch|diff|md)$'
      - id: end-of-file-fixer
        exclude: '\.(patch|diff)$'
      - id: check-yaml
        exclude: '^docs/catalogo/catalogo\.yaml$'
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=512]

  # Todo lo local pasa por `scripts/con-entorno.sh`: los ganchos heredan el PATH
  # de git, no el de la terminal, así que `python` a secas es el del sistema y
  # no encuentra `crmcore`. El síntoma era un muro de «No module named crmcore»
  # que parecía un fallo del código y era el entorno sin activar.
  - repo: local
    hooks:
      - id: env-example
        name: .env.example al día con los Settings
        entry: scripts/con-entorno.sh python scripts/gen_env_example.py --check
        language: system
        pass_filenames: false
        files: '^packages/crmcore/crmcore/config'

      - id: catalogo
        name: matriz de trazabilidad regenerada
        entry: scripts/con-entorno.sh python scripts/gen_catalogo_md.py --check
        language: system
        pass_filenames: false
        files: '^docs/catalogo/catalogo\.yaml$'

      - id: arquitectura
        name: contratos de arquitectura (acoplamiento, tenant, permisos)
        entry: scripts/con-entorno.sh python -m pytest tests/unit/test_contratos_arquitectura.py -q --no-header
        language: system
        pass_filenames: false
        files: '^(services|packages)/.*\.py$'

      # ── Por push: la suite entera ───────────────────────────────────────
      - id: preflight
        name: preflight --tests (gates + suite completa)
        entry: scripts/con-entorno.sh python scripts/preflight.py --tests
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
