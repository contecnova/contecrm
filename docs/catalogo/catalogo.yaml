              - {id: CRM-08.01.01.04, c: A, fase: 2, svc: core, estado: hecho, reutiliza: "contecmind:scripts/split_concurrent_indexes.py + contecflow-PSA:docs/INDEX_TUNING.md", t: "Estrategia de particionado y archivado para objetos de alto volumen", sin_pantalla_porque: "El particionado y el archivado de objetos de alto volumen son decisiones de modelo fisico; lo que se ve es que las tablas grandes siguen respondiendo"}
              - {id: CRM-08.01.01.05, c: A, fase: 0, svc: ops, estado: hecho, reutiliza: "contecmind:scripts/load_test.py", t: "Pruebas de carga reproducibles y publicadas", sin_pantalla_porque: "Las pruebas de carga se ejecutan y se publican como informe; una pantalla que las lanzara desde el producto cargaria la maquina de los clientes"}
              - {id: CRM-08.01.01.06, visto: '2026-10-05 AUDITADO, con un hallazgo cerrado. El modo solo lectura existia en la pagina de estado y no en el sistema: exigir_escritura estaba escrita, probada y sin llamante, asi que se podia entrar en modo degradado y las escrituras seguian pasando. Se aplica en la unidad de trabajo, que es por donde pasan todas, y la lectura sigue — que es lo que separa «no se puede guardar» de «el CRM no funciona». Se entra y se sale por el gateway, que lo reparte a los catorce y dice a cuales no ha llegado: el modo vive en memoria de cada proceso y uno a medias deja un estado que nadie sabe reconstruir. El motivo es obligatorio', c: A, fase: 0, svc: core, estado: hecho, reutiliza: "contecmind:app/core/degradation.py", t: "Degradación controlada del servicio no crítico bajo pico", sin_pantalla_porque: "La degradacion controlada bajo pico es comportamiento del servidor: difiere lo no critico y sigue. Lo que una persona ve es que no se cae"}
      - id: "8.2"
        nombre: Compromisos de servicio
        funciones:
          - id: CRM-08.02.01
            nombre: Compromisos
            capacidades:
              - {id: CRM-08.02.01.01, c: C, fase: 0, svc: docs, estado: hecho, t: "SLA de disponibilidad por tier con penalizaciones"}
              - {id: CRM-08.02.01.02, c: C, fase: 0, svc: ops, estado: hecho, reutiliza: "contecmind:scripts/test_restore_integrity.sh", t: "RPO/RTO comprometidos y verificados", sin_pantalla_porque: "El RPO y el RTO comprometidos son una clausula verificada con un simulacro; su entregable es el compromiso escrito y el acta del simulacro"}
              - {id: CRM-08.02.01.03, c: C, fase: 0, svc: infra, estado: hecho, t: "Ventanas de mantenimiento anunciadas y, preferentemente, sin corte", sin_pantalla_porque: "Las ventanas de mantenimiento se anuncian por el canal de aviso a clientes; una pantalla dentro del producto la lee justo quien no esta afectado"}
              - {id: CRM-08.02.01.04, c: C, fase: 0, svc: docs, estado: hecho, t: "Política de soporte: niveles, horarios, tiempos de respuesta y escalado"}
              - {id: CRM-08.02.01.05, c: C, fase: 0, svc: tenancy, estado: hecho, reutiliza: "contecmind:app/services/exports.py + app/api/exports.py", t: "Portabilidad: exportación completa del tenant en formato abierto y documentado"}
              - {id: CRM-08.02.01.06, c: A, fase: 0, svc: docs, estado: hecho, t: "Reversibilidad y plan de salida contractual"}

  - id: "9"
    nombre: Proveedores, coste y capacidad
    # La mitad que le falta a una oferta. El CRM sabe poner precio a lo que
    # vendemos y, sin esto, no sabe lo que nos cuesta — así que no puede decir el
    # margen, que es lo que un responsable aprueba o rechaza.
    #
    # Con una frontera explícita: el pedido de compra, la recepción y la casación
    # de factura son del ERP. Duplicarlos aquí crea dos sistemas de registro del
    # mismo pedido, y eso acaba en cuadres a mano. Aquí vive lo que toca a la
    # venta: la tarifa que alimenta el coste, la capacidad que permite
    # comprometer una fecha, la homologación que dice si ese proveedor puede
    # servir a ese cliente y el acuerdo que sostiene lo que prometemos. Donde
    # mande el ERP se lee por API con el conector genérico y no se copia.
    secciones:
      - id: "9.1"
        nombre: Maestro y gobierno del proveedor
        funciones:
          - id: CRM-09.01.01
            nombre: El proveedor como parte
            capacidades:
              - {id: CRM-09.01.01.01, c: C, fase: 2, svc: party, estado: hecho, t: "El proveedor es una cuenta con rol, no un maestro aparte: misma ficha, misma deduplicación, mismos permisos y los mismos informes"}
              - {id: CRM-09.01.01.02, c: C, fase: 2, svc: party, estado: hecho, t: "Homologación por categoría: requisitos, estado y caducidad, con lo que caduca bloqueando por sí solo"}
              - {id: CRM-09.01.01.03, c: C, fase: 2, svc: party, estado: hecho, t: "Documentación obligatoria con vigencia (seguro, certificados, solvencia) y aviso antes de que venza, no después"}
              - {id: CRM-09.01.01.04, c: A, fase: 4, svc: party, estado: hecho, t: "Riesgo del proveedor: dependencia, concentración y si hay alternativa declarada o no la hay"}
              - {id: CRM-09.01.01.05, c: A, fase: 4, svc: party, estado: hecho, t: "Evaluación con hechos medidos —plazo cumplido, incidencias, desvío de coste— y no solo con encuestas"}
              - {id: CRM-09.01.01.06, c: C, fase: 2, svc: party, estado: hecho, t: "Contactos del proveedor por función: comercial, técnico, facturación y escalado, con a quién se llama cuando algo falla"}
              - {id: CRM-09.01.01.07, c: C, fase: 2, svc: sales, estado: hecho, t: "Contrato con el proveedor: vigencia, renovación, preaviso y qué condiciones afectan a lo que ya hemos vendido"}
              - {id: CRM-09.01.01.08, c: A, fase: 3, svc: service, estado: hecho, t: "Acuerdo de servicio del proveedor y su relación con el que prometemos al cliente: no se puede prometer lo que no sostiene nadie"}
              - {id: CRM-09.01.01.09, c: C, fase: 2, svc: sales, estado: hecho, t: "Alcance por categoría, geografía y cliente: qué proveedor puede servir a qué, y por qué no puede al resto"}
              - {id: CRM-09.01.01.10, c: A, fase: 2, svc: party, estado: hecho, t: "Baja del proveedor: qué pasa con lo que ya está comprometido con clientes antes de poder darlo de baja"}

      - id: "9.2"
        nombre: Coste, tarifas y capacidad
        funciones:
          - id: CRM-09.02.01
            nombre: Lo que nos cuesta y lo que podemos comprometer
            capacidades:
              - {id: CRM-09.02.01.01, c: C, fase: 2, svc: sales, estado: hecho, reutiliza: "contecflow-PSA:app/services/rate_card_service.py", t: "Tarifa de coste del proveedor sobre el mismo motor de precios: vigencia, volumen, moneda y escalados, sin un motor paralelo"}
              - {id: CRM-09.02.01.02, c: C, fase: 2, svc: sales, estado: hecho, t: "Coste en la oportunidad y en la oferta, con el margen calculado y no tecleado"}
              - {id: CRM-09.02.01.03, c: C, fase: 2, svc: sales, estado: hecho, t: "El coste se congela al ofertar: un cambio de tarifa posterior avisa y no reescribe la oferta que alguien ya aprobó"}
              - {id: CRM-09.02.01.04, c: A, fase: 2, svc: sales, estado: hecho, t: "Comparación entre proveedores para lo mismo: coste, plazo y riesgo, no solo el precio"}
              - {id: CRM-09.02.01.05, c: A, fase: 2, svc: sales, estado: hecho, t: "Petición de oferta al proveedor y su respuesta, ligada a la oportunidad que la motivó"}
              - {id: CRM-09.02.01.06, c: A, fase: 2, svc: sales, estado: hecho, t: "Capacidad comprometida por proveedor y periodo, con lo ya comprometido descontado de lo disponible"}
              - {id: CRM-09.02.01.07, c: C, fase: 2, svc: sales, estado: hecho, t: "Plazo del proveedor como dato que decide la fecha que se promete al cliente, y no al revés"}
              - {id: CRM-09.02.01.08, c: A, fase: 4, svc: sales, estado: hecho, t: "Reparto cuando varios proveedores pueden servir: por coste, por capacidad libre o por acuerdo, declarado y no improvisado"}
              - {id: CRM-09.02.01.09, c: A, fase: 4, svc: sales, estado: hecho, t: "Escalados y rappels del proveedor: qué se recupera a final de año y a qué margen pertenece de verdad"}
              - {id: CRM-09.02.01.10, c: A, fase: 4, svc: analytics, estado: hecho, t: "Coste real frente a coste ofertado, medido, y dónde se fue la diferencia"}


# ── ANEXO A — Catálogo mínimo de recursos de API ───────────────────────────
# Base para verificar que el sistema es realmente headless. Cada recurso debe
# ofrecer CRUD, búsqueda, operaciones masivas, historial y eventos. El gate
# `tests/unit/test_headless_contract.py` comprueba, para cada recurso ya
# declarado `hecho`, que esas cinco superficies existen en el OpenAPI generado.
anexo_a_recursos:
  nucleo: [accounts, contacts, leads, activities, notes, attachments, addresses, consents, relationships]
  ventas: [opportunities, opportunity-lines, pipelines, stages, forecasts, quotes, orders, contracts, subscriptions, price-books, products, territories, quotas, partners, deal-registrations]
  servicio: [cases, case-comments, entitlements, slas, queues, knowledge-articles, conversations, messages, assets, work-orders, surveys]
  marketing: [campaigns, campaign-members, segments, journeys, templates, sends, subscriptions-preferences, attributions]
  plataforma: [tenants, users, roles, permission-sets, sharing-rules, "metadata/objects", "metadata/fields", layouts, workflows, workflow-instances, webhooks, events, jobs, imports, audit-logs, reports, dashboards, feature-flags, quotas-usage]

