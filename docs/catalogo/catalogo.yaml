              - {id: CRM-03.03.02.11, visto: '2026-10-05 AUDITADO, con un hallazgo cerrado y gordo. enviar_a_erp marcaba el pedido como «enviado_erp» y emitia order.submitted diciendo en su propio comentario que «la llamada la hace integration con su conector declarativo»: NADIE CONSUMIA ESE EVENTO. El pedido figuraba enviado y no salia de aqui, sin ningun error — y eso se descubre en el cierre de mes, que es cuando ya no se arregla. Y la vuelta tampoco estaba: enviar_a_erp deja el pedido esperando confirmacion a proposito (el ERP puede aceptar el mensaje y rechazar el pedido despues) y nadie recogia la respuesta, asi que se quedaba en «enviado_erp» para siempre. Ahora integration consume order.submitted y lo manda por el conector declarativo —que operacion lo atiende es un AJUSTE, porque la clave la pone quien declara la conexion— y devuelve order.erp.confirmed u order.erp.rejected, que ventas consume para anotar el estado. Un tenant sin ERP declarado se anota como informacion, no como fallo: la mayoria no tiene ninguno. Y la referencia del ERP no se inventa: si no la devuelve, va vacia', c: C, fase: 2, svc: integration, estado: hecho, reutiliza: "contecweb:app/services/purchase (traspaso a ERP) + contecflow-PSA:app/services/accounting_hub_service.py", t: "Traspaso de pedido a ERP con confirmación y conciliación de estado"}
