# ═══════════════════════════════════════════════════════════════════════════
#  Catálogo funcional de contecrm — fuente única de verdad del alcance
# ═══════════════════════════════════════════════════════════════════════════
#
# Este fichero NO es documentación decorativa: es el índice del que salen
#   * el manual funcional (`scripts/gen_catalogo.py` → docs/catalogo/*.md`),
#   * la matriz de trazabilidad (capacidad → servicio → código → prueba),
#   * el gate `catalogo-trazabilidad`, que exige que toda capacidad marcada
#     `estado: hecho` tenga al menos una prueba que la nombre por ID.
#
# Por eso los IDs son estables y no se reutilizan nunca: son la clave de
# trazabilidad en el código (`# CRM-00.01.02.01`), en las pruebas
# (`test_..._crm_00_01_02_01`) y en el manual.
#
# ── Campos ─────────────────────────────────────────────────────────────────
#   id       CRM-MM.SS.FF.nn — Módulo · Sección · Función · Detalle
#   t        enunciado de la capacidad, literal del catálogo de alcance
#   c        criticidad: C = core, A = avanzado, D = diferencial/nicho
#   fase     fase de implantación (0..6) según el plan de despliegue
#   svc      servicio propietario de la capacidad (o `core` si es de la
#            librería compartida, o `infra`/`docs`/`ops`)
#   estado   pendiente | en-curso | hecho
#   reutiliza  de dónde se porta la solución ya existente, con ruta medida.
#            Vacío = se escribe de cero porque no hay precedente.
#
# ── Por qué `reutiliza` es un campo de primera clase ────────────────────────
# Las otras cuatro soluciones de la casa (contecmind, contecweb, contecflow-PSA,
# contecpos) ya tienen resuelto, medido y en producción buena parte del Módulo 0
# y trozos grandes de los módulos 1, 3, 4, 5 y 7. Reescribirlo sería tirar años
# de decisiones ya probadas. El inventario medido está en `docs/REUTILIZACION.md`;
# aquí queda enganchado capacidad por capacidad para que el origen nunca se pierda.

version: 1
actualizado: 2026-09-18

criticidades:
  C: Core — sin esto no hay CRM empresarial
  A: Avanzado — diferencial de líderes de mercado
  D: Diferencial / nicho — alto valor en sectores concretos

estados:
  pendiente: No empezado
  en-curso: Hay código, no cumple todavía el enunciado completo
  hecho: Cumple el enunciado, tiene prueba que lo cita y está documentado

fases:
  0: {nombre: Cimientos, alcance: "Módulo 0 completo", objetivo: "Que todo lo demás sea construible sin refactor"}
  1: {nombre: Núcleo, alcance: "Módulo 1 + Ventas básica (3.1) + administración (7.1)", objetivo: "CRM operativo mínimo con datos fiables"}
  2: {nombre: Proceso comercial, alcance: "Forecasting, territorios, cotización, contratos, order-to-cash", objetivo: "Ciclo de venta completo y conectado al ERP"}
  3: {nombre: Servicio, alcance: "Casos, SLA, omnicanalidad, conocimiento, portal", objetivo: "Postventa y retención"}
  4: {nombre: Marketing, alcance: "Segmentación, journeys, canales, atribución", objetivo: "Demanda y ciclo cerrado"}
  5: {nombre: Inteligencia, alcance: "Analítica avanzada, predictivos, IA generativa y agentes", objetivo: "Optimización y productividad"}
  6: {nombre: Ecosistema, alcance: "PRM, field service, marketplace de extensiones, MCP", objetivo: "Extensión y canal"}

restricciones_transversales:
  - id: RT-1
    nombre: Frontless / headless
    enunciado: >-
      Toda capacidad funcional existe primero como servicio con contrato
      (API/evento). La UI es un consumidor más, sin privilegios y sin lógica de
      negocio propia.
    gate: tests/unit/test_headless_contract.py
  - id: RT-2
    nombre: Orquestación de servicios
    enunciado: >-
      Los procesos de negocio son composiciones explícitas y observables de
      servicios, no lógica enterrada en controladores ni en triggers de base de
      datos.
    gate: tests/unit/test_contratos_arquitectura.py
  - id: RT-3
    nombre: Multi-tenant
    enunciado: >-
      Cada capacidad es tenant-aware por defecto — datos, configuración,
      metadatos, cuotas, extensiones, claves y observabilidad.
    gate: tests/integration/test_rls_aislamiento.py
  - id: RT-4
    nombre: Explotación delegada en contecintelligence
    enunciado: >-
      La explotación del dato —informes, cuadros de mando, consultas analíticas y
      preguntas en lenguaje natural— NO se reimplementa aquí: la resuelve
      contecintelligence, consumido de forma frontless. contecrm expone las
      pantallas y el contexto; las consultas las responde contecintelligence a
      través de su API delegada, con el tenant, el usuario y sus permisos
      propagados. El usuario no sale nunca de contecrm.
      contecintelligence es por tanto una DEPENDENCIA DE DESPLIEGUE: la pila de
      contecrm lo levanta con ella, o se le da la dirección de uno ya en marcha y
      alcanzable. Sin él no hay explotación, y eso se comprueba al arrancar en
      vez de descubrirse la primera vez que alguien abre un informe.
    gate: tests/unit/test_explotacion_delegada.py
  - id: RT-5
    nombre: Corpus documental delegado en contecmind
    enunciado: >-
      El CORPUS documental de la empresa —contratos, procedimientos,
      certificados, con versionado, aprobación, obsolescencia y búsqueda— NO se
      reimplementa aquí: lo resuelve contecmind, consumido de forma frontless.
      contecrm guarda el enlace y el contexto —qué registro tiene qué documento y
      para qué— y el documento vive allí, con la identidad del usuario propagada
      para que cada uno vea lo que vería entrando al gestor.
      La distinción con RT-4 es que aquí se ESCRIBE y se BORRA, así que dos
      obligaciones de contecrm cruzan la frontera y tienen que sostenerse: un
      bloqueo legal sobre un registro impide quitar sus documentos enlazados, y
      el certificado de destrucción de un tenant dice qué quedó fuera porque lo
      destruye quien lo guarda.
      Se activa o no (DMS_ENABLED). Activado, es una dependencia de despliegue:
      la pila lo levanta con el perfil `dms` o se le da la dirección de uno ya en
      marcha, y se comprueba al arrancar. Desactivado NO se pierde nada del CRM:
      los ADJUNTOS de los registros —la foto de una visita, el PDF de una
      oportunidad— siguen en contecrm y se suben aunque el gestor no responda.
      Son otra capa, y confundirlas convertiría una integración en una
      regresión.
    gate: tests/unit/test_documental.py

modulos:
  - id: "0"
    nombre: Plataforma y arquitectura transversal
    secciones:

      - id: "0.1"
        nombre: Multi-tenancy
        funciones:

          - id: CRM-00.01.01
            nombre: Modelo de aislamiento
            capacidades:
              - {id: CRM-00.01.01.01, c: C, fase: 0, svc: core, estado: hecho, reutiliza: "contecmind:app/db/tenant_guard.py + alembic/versions/0119_rls.py", t: "Aislamiento lógico — esquema compartido con discriminador tenant_id en toda entidad", visto: "2026-10-27 El modelo de aislamiento de cada tenant se ve en Tenants con permiso tenant:read, y las migraciones entre modelos con su ventana, su verificacion y su vuelta atras. Quince operaciones sin pantalla hasta hoy"}
              - {id: CRM-00.01.01.02, c: A, fase: 0, svc: core, estado: hecho, reutiliza: "contecpos:deploy/crear-bases.sh (un esquema y un rol por servicio)", t: "Aislamiento por esquema — un esquema por tenant sobre instancia compartida"}
              - {id: CRM-00.01.01.03, visto: '2026-10-26 AUDITADO. Declarar no es tener, y por eso lo que se mide es `comprobar`: se le pregunta a la propia conexion a que base esta atada y se contrasta con lo declarado. Un tenant declarado en «la-que-no-es» sale como no cuadra, con la base real al lado y diciendo que esto no se arregla cambiando la declaracion. Fijado ademas que declarar de nuevo INVALIDA la comprobacion anterior: una comprobacion que sobrevive al cambio de lo comprobado sigue diciendo que si, en verde, sobre una declaracion que ya no es la misma. Y que un tenant sin declarar no se da por bueno. Mutado: quitando el contraste de la base real y quitando la invalidacion, las pruebas lo cazan', c: A, fase: 0, svc: tenancy, estado: hecho, t: "Aislamiento físico — base de datos o clúster dedicado por tenant"}
              - {id: CRM-00.01.01.04, c: A, fase: 0, svc: tenancy, estado: hecho, t: "Modelo híbrido por tiers (silo para enterprise, pool para SMB) con promoción entre tiers"}
              - {id: CRM-00.01.01.05, visto: '2026-10-26 AUDITADO. La modalidad «cliente» —la base la pone el— exige marcarlo, y marcarlo es lo que cambia de quien es la copia de seguridad y a quien se le pide el acceso cuando hay una incidencia. Una base del cliente sin marcar es una base que creemos nuestra el dia que hay que restaurarla. Comprobado tambien que un tier desconocido cae a «compartido» en vez de inventarle la modalidad que mas cuesta', c: D, fase: 0, svc: tenancy, estado: hecho, t: "Política de bring your own database / despliegue en la infraestructura del cliente"}
              - {id: CRM-00.01.01.06, visto: '2026-10-26 AUDITADO CON HUECO, y queda sin construir. `pool_computo` se declara en la API de aislamiento, se guarda en `aislamiento_tenants` y se devuelve en la ficha — y NADIE LO LEE: medido el 26-10-2026, las unicas apariciones en todo el repositorio son la migracion, el modelo, el parametro de `declarar` y la salida de la API. El relevo de tareas (`crmcore.tareas.por_tenant`) recorre todos los tenants que tengan algo que barrer, sin mirar a que pool pertenecen, y no hay ninguna otra via de reparto de trabajo que lo consulte. O sea: el circuito abierto de siempre, las dos mitades escritas y nada que las una. La promesa esta ademas escrita en la cabecera del propio modulo («de nada sirve una base dedicada si la importacion de cincuenta mil filas de otro cliente deja sin workers al que paga por no esperar»). Cerrarlo es funcionalidad nueva —el pool vive en el esquema de tenancy y ningun servicio lee el de otro, asi que habria que replicarlo por el bus como se replican los ajustes en caliente, y despues filtrar en el relevo— y por eso queda avisado y no construido. Sin prueba que cite esta capacidad, a proposito: citarla seria darla por recorrida || 2026-10-27 CERRADO EL CIRCUITO. `pool_computo` estaba en la migracion, en el modelo, en el parametro de declarar y en la respuesta de la API, y el barrido de tareas recorria TODOS los tenants igual: se podia vender computo dedicado, declararlo y verlo en pantalla, y el trabajo pesado de ese cliente seguia cayendo en los mismos workers que el de todos. El pool viaja ahora por el camino que ya llega a los catorce servicios —los ajustes en caliente—, porque el barrido corre DENTRO de cada servicio y no puede leer el esquema de tenancy. Dos vacios y los dos significan TODOS a proposito: un proceso sin POOL_COMPUTO atiende a todos —al reves, un despliegue sin la variable dejaria los barridos sin correr y nadie se enteraria hasta que una tabla creciera sin techo— y un tenant sin pool declarado lo atiende cualquiera. Y si no se puede resolver el pool se atiende, con aviso en el registro: saltarselo por no saber convertiria un retraso de la replica en trabajo que no se hace y nadie reclama. La salida dice cuantos se saltaron, porque un proceso mal configurado que barre cero es identico a un sistema sin trabajo. Probado plantando el caso', c: A, fase: 0, svc: core, estado: hecho, t: "Aislamiento a nivel de cómputo: pools de workers dedicados por tenant o por tier"}
              - {id: CRM-00.01.01.07, c: C, fase: 0, svc: core, estado: hecho, reutiliza: "contecmind:app/core/cache_registry.py", t: "Aislamiento de caché: namespacing obligatorio de claves por tenant y purga selectiva"}
              - {id: CRM-00.01.01.08, c: C, fase: 0, svc: core, estado: hecho, reutiliza: "contecmind:app/core/storage.py (S3/MinIO, URLs firmadas)", t: "Aislamiento de almacenamiento de ficheros: bucket/prefijo por tenant, URLs firmadas de vida corta"}
              - {id: CRM-00.01.01.09, c: C, fase: 0, svc: core, estado: hecho, reutiliza: "contecmind:app/core/search (filtro forzado por tenant)", t: "Aislamiento de índices de búsqueda (índice por tenant o filtro forzado a nivel de motor)"}
              - {id: CRM-00.01.01.10, c: A, fase: 0, svc: core, estado: hecho, reutiliza: "contecpos:packages/common/src/bus.ts (subjects por tenant)", t: "Aislamiento de colas y streams: partición o topic por tenant para evitar bloqueo cruzado"}

          - id: CRM-00.01.02
            nombre: Garantías de no fuga de datos (tenant safety)
            capacidades:
              - {id: CRM-00.01.02.01, c: C, fase: 0, svc: core, estado: hecho, reutiliza: "contecmind:alembic/versions/0119_rls.py + deploy/sql/rls_app_role.sql", t: "Row-Level Security aplicada en el motor de datos, no solo en el ORM"}
              - {id: CRM-00.01.02.02, c: C, fase: 0, svc: core, estado: hecho, reutiliza: "contecmind:app/services/tenant_context.py + app/db/session.py (_rls_apply_on_begin)", t: "Contexto de tenant propagado por todo el stack (cabecera → token → contexto de ejecución → conexión)"}
              - {id: CRM-00.01.02.03, visto: '2026-10-26 AUDITADO. Medido con una consulta que NO lleva ningun `where tenant_id` y aun asi no ve lo del vecino: lo inyecta el guard del ORM. Si dependiera de acordarse, el aislamiento seria tan bueno como el peor despiste de la peor tarde. Comprobado tambien que el camino de sistema sigue abierto —alguna consulta cross-tenant legitima hay— pero hay que escribirlo, y entonces se ve en la revision; y que la lista de modelos exentos es UNA, el propio Tenant, que no se puede filtrar por si mismo sin dejar de poder resolverlo. Mutado: con el guard sin tenant, la prueba lo caza', c: C, fase: 0, svc: core, estado: hecho, reutiliza: "contecmind:tests/unit/test_tenant_scope_contract.py", t: "Prohibición estructural de consultas sin predicado de tenant (interceptor / linter / test de arquitectura)"}
              - {id: CRM-00.01.02.04, c: C, fase: 0, svc: core, estado: hecho, reutiliza: "contecmind:tests/unit/test_tenant_guard_contract.py", t: "Tests automatizados de cross-tenant leakage en cada pipeline local (aquí: gate de pre-push, no CI)"}
              - {id: CRM-00.01.02.05, c: A, fase: 0, svc: core, estado: hecho, t: "Tenant fuzzing: suite que intenta acceder a IDs de otro tenant y exige 404 (no 403)"}
              - {id: CRM-00.01.02.06, visto: '2026-10-26 AUDITADO. Las tres condiciones sostienen esto juntas y se miden las tres: motivo escrito obligatorio, solo personal de plataforma, y constancia EN LA AUDITORIA DEL CLIENTE —no en la nuestra—, con el motivo dentro y quien entro. Si constara solo de nuestro lado, el cliente no podria saber quien entro en sus datos, que es justo lo que hay que poder contestar cuando lo pregunta. Mutado: quitando la exigencia de motivo, la prueba lo caza', c: C, fase: 0, svc: identity, estado: hecho, reutiliza: "contecmind:app/services/audit.py (justificación obligatoria)", t: "Auditoría de acceso cruzado por personal de soporte, con justificación obligatoria"}
              - {id: CRM-00.01.02.07, visto: '2026-10-26 AUDITADO. 200 identificadores seguidos: todos UUIDv7 y el salto minimo entre dos consecutivos por encima de 2^40, o sea que del uno no se llega al siguiente. Quien ve /accounts/1043 prueba 1044: con ids secuenciales el aislamiento depende por entero de que la comprobacion de permisos sea perfecta en TODOS los endpoints; con uno opaco, esa comprobacion pasa a ser la segunda red en vez de la unica. Y la otra mitad, que es la razon de v7 y no v4: ordenan por antiguedad, asi que no fragmentan los indices', c: A, fase: 0, svc: core, estado: hecho, t: "Detección de identificadores globales enumerables; uso de ULID/UUIDv7 opacos"}

          - id: CRM-00.01.03
            nombre: Ciclo de vida del tenant
            capacidades:
              - {id: CRM-00.01.03.01, visto: '2026-10-07 La mitad de la API estaba y la del AUTOSERVICIO no: la unica alta era POST /tenants, que exige administrador de plataforma. ONBOARDING_ENABLED lo prometia y no lo leia nadie. Construido: POST /alta no crea nada —guarda la solicitud y devuelve el token—, POST /alta/confirmar lo gasta y crea la empresa. Respuesta igual este el identificador libre o cogido, para que no sea un comprobador de clientes; enlace de un solo uso, hasheado y con caducidad; el identificador se recomprueba al confirmar porque entre medias puede llevarselo otro; tope por IP propio, mucho mas estrecho que el general. El administrador lo crea identity por evento, no por llamada, y sin inventarle contrasena. Mutado: quitando el interruptor, el uso unico, la caducidad o la deduplicacion, cae una prueba cada vez', c: C, fase: 0, svc: tenancy, estado: hecho, reutiliza: "contecmind:app/services/tenants.py + app/services/onboarding.py", t: "Provisioning automatizado (API + autoservicio) con plantilla de datos semilla"}
              - {id: CRM-00.01.03.02, c: A, fase: 0, svc: tenancy, estado: hecho, reutiliza: "contecmind:app/services/onboarding_guide.py", t: "Onboarding guiado por industria: preconfiguración de objetos, pipelines y flujos"}
              - {id: CRM-00.01.03.03, c: A, fase: 0, svc: tenancy, estado: hecho, t: "Clonado de tenant (para sandbox, demo, pre-producción)"}
              - {id: CRM-00.01.03.04, c: C, fase: 0, svc: tenancy, estado: hecho, t: "Suspensión, reactivación y congelación en modo solo lectura"}
              - {id: CRM-00.01.03.05, c: C, fase: 0, svc: tenancy, estado: hecho, reutiliza: "contecmind:app/services/exports.py", t: "Offboarding con exportación completa verificable y certificado de destrucción", visto: "2026-10-27 La exportacion de baja ensena cuando se completo, quien la pidio y cuando se VERIFICO. La capacidad es exportacion completa verificable: sin la marca de verificacion lo que hay es una exportacion y la palabra verificable"}
              - {id: CRM-00.01.03.06, c: D, fase: 0, svc: tenancy, estado: hecho, t: "Fusión de tenants (M&A) y escisión de un tenant en dos"}
              - {id: CRM-00.01.03.07, c: A, fase: 0, svc: tenancy, estado: hecho, reutiliza: "contecflow-PSA:app/models/enterprise.py (jerarquía de organizaciones)", t: "Jerarquía de tenants: matriz–filial, franquiciador–franquiciado, holding"}
              - {id: CRM-00.01.03.08, c: A, fase: 0, svc: tenancy, estado: hecho, reutiliza: "contecflow-PSA:app/services/organizations_service.py", t: "Sub-tenants / business units con herencia configurable de configuración y datos"}
              - {id: CRM-00.01.03.09, c: A, fase: 0, svc: tenancy, estado: hecho, t: "Migración entre regiones con ventana de solo lectura y verificación de integridad"}
              - {id: CRM-00.01.03.10, c: D, fase: 0, svc: tenancy, estado: hecho, t: "Migración entre tiers de aislamiento sin downtime perceptible"}

          - id: CRM-00.01.04
            nombre: Configuración y metadatos por tenant
            capacidades:
              - {id: CRM-00.01.04.01, visto: '2026-10-26 AUDITADO. La escalera recorrida de verdad con `ui_densidad`, una de las cinco claves de 90 que llegan hasta el usuario (las otras 85 paran en el tenant): .env -> global -> tenant -> usuario, y cada escalon gana al de arriba. Y hacia atras: quitar el del tenant destapa el global, y quitarlo todo vuelve al .env — un ajuste quitado que se queda en None apaga la funcionalidad en vez de devolverla al valor de la casa, que es lo contrario de lo que espera quien pulsa restablecer. Fijado tambien que una clave no se puede fijar por debajo de su ambito: el limite de tamano de adjunto es del tenant y si cada persona pudiera levantarselo, la pantalla de Admin seguiria ensenando el de la empresa. Mutado: ignorando el candidato usuario, la prueba lo caza', c: C, fase: 0, svc: tenancy, estado: hecho, reutiliza: "contecmind:app/services/runtime_settings*.py (7 módulos, 986 ajustes) + contecpos:packages/common/src/ajustes.ts", t: "Capa de configuración jerárquica: global → tier → tenant → BU → usuario"}
              - {id: CRM-00.01.04.02, c: A, fase: 0, svc: tenancy, estado: hecho, reutiliza: "contecflow-PSA:app/services/settings_audit_service.py", t: "Versionado de la configuración con diff y rollback"}
              - {id: CRM-00.01.04.03, visto: '2026-10-26 AUDITADO. Dos tenants con un objeto propio del mismo nombre y campos distintos: ninguno ve el del otro. Lo que se mira ademas es retirar, que es lo que nadie prueba: aislar lo que se anade es facil; deprecar un campo en una empresa y que siga vivo en la de al lado es lo que se rompe. Y se deprecia, no se borra: un campo que desaparece de golpe rompe en silencio a la integracion que aun lo manda, con un 400 que no sabe leer. Mutado: quitando el filtro de tenant de la busqueda del objeto, la prueba lo caza', c: C, fase: 0, svc: metadata, estado: hecho, reutiliza: "contecweb:app/services/custom_fields.py + contecflow-PSA:app/services/custom_fields_service.py", t: "Modelo de datos extensible por tenant sin afectar a los demás"}
              - {id: CRM-00.01.04.04, visto: '2026-10-26 AUDITADO. Usuario sobre tenant y tenant sobre global; una bandera no declarada esta APAGADA, no encendida —una funcionalidad a medias que se estrena sola porque nadie declaro la bandera es como se despliega algo sin querer—; y el porcentaje reparte por hash y no al azar: se pregunta diez veces por la misma persona y contesta lo mismo las diez. Si fuera aleatorio, a la misma persona le apareceria y desapareceria la funcionalidad entre dos peticiones, y nadie sabria si el fallo que ve es de la version nueva o de la vieja. Comprobado tambien que reparte (0 < encendidas < 60 con el 50 %) y los dos extremos, 0 y 100, que son los que se usan para apagar y para terminar de desplegar', c: C, fase: 0, svc: tenancy, estado: hecho, reutiliza: "contecmind:app/services/entitlements.py", t: "Feature flags por tenant, por usuario y por porcentaje de tráfico"}
              - {id: CRM-00.01.04.05, c: C, fase: 0, svc: tenancy, estado: hecho, reutiliza: "contecmind:app/services/entitlements.py + contecpos:services/identidad/src/planes", t: "Catálogo de planes/entitlements que activa capacidades declarativamente"}
              - {id: CRM-00.01.04.06, c: A, fase: 0, svc: tenancy, estado: hecho, reutiliza: "contecflow-PSA:app/services/branding_service.py", t: "Marca blanca: logo, paleta, dominio propio, plantillas de correo, dominio de envío"}
              - {id: CRM-00.01.04.07, c: C, fase: 0, svc: core, estado: hecho, reutiliza: "contecmind:app/services/i18n_labels.py + languages.py", t: "Localización por tenant: idiomas, formatos, calendarios, husos, moneda funcional"}
              - {id: CRM-00.01.04.08, visto: '2026-10-26 AUDITADO. El segmentado del vault medido, no leido: lo que cifra con proposito integracion NO lo abre la clave de campo_cliente, asi que comprometer el subsistema mas expuesto no da acceso a lo demas. El mismo secreto cifrado dos veces sale distinto —dos filas identicas delatan que la contrasena es la misma sin descifrar nada, y quien tenga la tabla sabe que clientes la comparten—. Un byte alterado FALLA en vez de descifrar a otra cosa: con CBC el sistema se conectaria a donde le dijeran sin dejar rastro. Y SECRETOS_BACKEND=vault corta el arranque en vez de caer a la base avisando en el log. Mutado: igualando clave y AAD para todos los propositos, la prueba lo caza', c: C, fase: 0, svc: core, estado: hecho, reutiliza: "contecmind:app/models/tenant_credential.py + contecweb:app/services/credentials.py", t: "Gestión de secretos y claves de integración por tenant (vault segmentado)"}
              - {id: CRM-00.01.04.09, c: A, fase: 0, svc: core, estado: hecho, reutiliza: "contecmind:app/core/crypto.py + app/db/encrypted_text.py + contecflow-PSA:app/services/key_management.py", t: "BYOK / CMEK: clave de cifrado gestionada por el cliente, con rotación y revocación"}

          - id: CRM-00.01.05
            nombre: Residencia, soberanía y cumplimiento por tenant
            capacidades:
              - {id: CRM-00.01.05.01, c: A, fase: 0, svc: tenancy, estado: hecho, t: "Pinning de región de datos por tenant (UE, EE. UU., LATAM, APAC)", visto: "2026-10-27 Donde viven los datos de cada tenant, sus subprocesadores y sus transferencias internacionales, en Tenants. Es lo que se ensena en una auditoria y habia que pedirlo por API"}
              - {id: CRM-00.01.05.02, c: A, fase: 0, svc: tenancy, estado: hecho, t: "Residencia diferenciada por tipo de dato (transaccional vs. analítico vs. backups vs. logs)"}
              - {id: CRM-00.01.05.03, c: A, fase: 0, svc: tenancy, estado: hecho, reutiliza: "contecmind:docs/COMPLIANCE.md", t: "Control de subprocesadores y trazabilidad de transferencias internacionales"}
              - {id: CRM-00.01.05.04, visto: '2026-10-28 AUDITADO CON HALLAZGO, y cerrado. Las regiones estaban escritas DOS veces: la que firma la residencia de un tenant (CRM-00.01.05.01, siete) y la que admitia la politica de IA (seis). No coincidian, y eso daba dos fallos. Uno: la politica de IA no sabia escribir `latam` ni `apac` —las dos que el propio enunciado de .01 promete—, asi que un cliente podia firmar residencia en LATAM y recibir `ia.region_no_valida` al pedir que la IA la respetara; justo el cliente que mas necesita el modo sin salida era el unico que no podia pedirlo. Dos, y mas callado: un tenant podia admitir la region `otra`, que en un proveedor significa NO CONSTA DONDE ESTA, con lo que el modo sin salida elegia un proveedor de paradero desconocido y lo anunciaba como «la misma region del tenant» —la promesa se daba por cumplida sin poder comprobarla—. La lista vive ahora una vez en `crmcore/regiones.py`: `REGIONES` es lo que se puede prometer y `REGIONES_DE_PROVEEDOR` es esa mas `otra`, que describe y no promete. Tres pruebas, las tres validadas plantando la lista vieja', c: A, fase: 5, svc: core, estado: hecho, reutiliza: "contecmind:app/core/inference_gate.py + model_router.py", t: "Modo sin salida de datos para IA: inferencia en región o modelo dedicado"}
              - {id: CRM-00.01.05.05, c: C, fase: 0, svc: docs, estado: hecho, reutiliza: "contecmind:docs/COMPLIANCE.md + PENTEST_HARDENING.md", t: "Cumplimiento verificable: ENS, ISO 27001, SOC 2 Tipo II, GDPR, sectoriales"}

          - id: CRM-00.01.06
            nombre: Cuotas, límites y equidad (noisy neighbour)
            capacidades:
              - {id: CRM-00.01.06.01, c: C, fase: 0, svc: gateway, estado: hecho, reutiliza: "contecmind:app/core/rate_limit.py (508 líneas, por tenant/usuario/endpoint)", t: "Rate limiting por tenant, por API key, por usuario y por endpoint"}
              - {id: CRM-00.01.06.02, c: C, fase: 0, svc: tenancy, estado: hecho, reutiliza: "contecmind:app/services/entitlements.py (cuotas) + metering.py", t: "Cuotas de almacenamiento, registros, llamadas API, correos, workflows y tokens de IA"}
              - {id: CRM-00.01.06.03, c: A, fase: 0, svc: core, estado: hecho, reutiliza: "contecmind:app/core/circuit_breaker.py", t: "Aislamiento de carga: bulkheads, circuit breakers y colas de prioridad por tier"}
              - {id: CRM-00.01.06.04, c: A, fase: 0, svc: core, estado: hecho, reutiliza: "contecmind:app/core/degradation.py", t: "Backpressure y degradación elegante bajo saturación (diferir lo no crítico)"}
              - {id: CRM-00.01.06.05, c: A, fase: 0, svc: gateway, estado: hecho, t: "Detección de tenants anómalos y throttling adaptativo automático"}
              - {id: CRM-00.01.06.06, c: C, fase: 0, svc: tenancy, estado: hecho, reutiliza: "contecmind:app/services/metering.py + app/api/admin_observability.py", t: "Panel de consumo por tenant con alertas de aproximación al límite"}
              - {id: CRM-00.01.06.07, c: A, fase: 0, svc: tenancy, estado: hecho, reutiliza: "contecmind:app/services/metering.py", t: "Medición para facturación (metering) exportable a sistema de billing"}

          - id: CRM-00.01.07
            nombre: Gobierno único de la suite (contecrm, contecmind, contecintelligence)
            # contecrm ya depende de contecmind (corpus documental, RT-5) y de
            # contecintelligence (explotación, RT-4). Hoy el tenant, los usuarios
            # y la organización se configuran TRES VECES, a mano, en tres sitios.
            # Eso no es un detalle de implantación: es el sitio por donde se
            # rompe. Alguien entra en el CRM y no en el gestor documental; alguien
            # se va de la empresa y conserva el acceso a los informes; un
            # departamento se reorganiza en uno y no en los otros, y los permisos
            # dejan de coincidir sin que nadie lo vea.
            #
            # La regla: **contecrm es la fuente**, los demás son réplicas. Un
            # único punto de administración, empuje automático, y reconciliación
            # que enseñe lo que ha divergido — porque un empuje que falla en
            # silencio deja el problema peor que no tener empuje.
            capacidades:
              - {id: CRM-00.01.07.01, visto: '2026-09-28 GET /suite/identidad por HTTP: identificador, slug y organización en una sola respuesta', c: C, fase: 1, svc: tenancy, estado: hecho, t: "Identidad única de tenant en toda la suite: un mismo identificador y unos mismos datos de la organización en contecrm, contecmind y contecintelligence"}
              - {id: CRM-00.01.07.02, visto: '2026-09-28 alta de organización en contecmind por el conector real; sin el campo fijo contesta 422 y con él pasa a exigir rol cross-tenant', c: C, fase: 1, svc: tenancy, estado: hecho, t: "Alta del tenant en cascada: dar de alta un cliente en contecrm lo provisiona en las herramientas conectadas, o dice exactamente cuál ha fallado y por qué"}
              - {id: CRM-00.01.07.03, visto: '2026-09-28 alta de usuario por el conector real contra contecmind, con identificador remoto de vuelta; reintento idempotente y baja 204', c: C, fase: 1, svc: identity, estado: hecho, t: "Un único alta de usuario para toda la suite, con desaprovisionamiento en cascada: quien se va deja de entrar en todas a la vez"}
              - {id: CRM-00.01.07.04, visto: '2026-09-28 un usuario con dos roles sale a la herramienta real con el de mayor precedencia, no con el primero', c: C, fase: 1, svc: identity, estado: hecho, t: "Mapeo de roles por herramienta, como dato: el mismo usuario tiene rol distinto en cada una y la correspondencia se configura, no se programa"}
              - {id: CRM-00.01.07.05, visto: '2026-09-28 unidad definida una vez, leída en /suite/identidad y no encolada a quien no declara el objeto', c: C, fase: 1, svc: tenancy, estado: hecho, t: "Áreas, departamentos y organigrama del tenant definidos una sola vez y replicados a cada herramienta con su propia forma"}
              - {id: CRM-00.01.07.06, visto: '2026-09-28 la consola pintada: enseñaba el recuento de cuarentena sin forma de verla ni reintentarla; ahora lista lo apartado con lo que se mandó y su botón', c: C, fase: 1, svc: front, estado: hecho, t: "Consola única de gobierno de la suite: una pantalla para tenant, usuarios, roles por herramienta y organización, con el estado de cada herramienta al lado"}
              - {id: CRM-00.01.07.07, visto: '2026-09-28 reconciliación contra una herramienta que contesta: la lectura no entraba con usuario y contraseña y quedaba apagada para siempre; corregido y medido', c: C, fase: 1, svc: tenancy, estado: hecho, t: "Reconciliación y detección de divergencia: qué hay en cada herramienta que no coincide con el origen, con reparación en un clic y sin pisar lo que se cambió a propósito"}
              - {id: CRM-00.01.07.08, visto: '2026-09-28 el conector genérico entrando con usuario y contraseña, renovando el token vencido y aplicando los valores fijos de la conexión', c: A, fase: 1, svc: tenancy, estado: hecho, t: "Conector de aprovisionamiento genérico y declarativo por herramienta (dirección, credencial, mapeo de campos y de roles), con conectores nativos encima para contecmind y contecintelligence"}
              - {id: CRM-00.01.07.09, visto: '2026-09-28 expuesta en GET /suite/sso: la comprobación existía y no la llamaba nadie; detecta la herramienta con otro certificado', c: C, fase: 1, svc: identity, estado: hecho, t: "SSO compartido: el proveedor de identidad se configura una vez y lo usan las tres herramientas, sin tres inicios de sesión"}
              - {id: CRM-00.01.07.10, visto: '2026-09-28 cinco rechazos reales de la herramienta, cuarentena con el error dentro y reintento por la ruta', c: A, fase: 1, svc: tenancy, estado: hecho, t: "Cola de aprovisionamiento con reintento, orden garantizado por usuario y cuarentena de lo que no se puede aplicar, visible desde la consola"}
              - {id: CRM-00.01.07.11, visto: '2026-09-28 GET /suite/simular enseña el plan sin que salga una sola llamada a la red', c: A, fase: 2, svc: tenancy, estado: hecho, t: "Simulación antes de aplicar: qué usuarios, roles y unidades se crearían, cambiarían o desactivarían en cada herramienta"}
              - {id: CRM-00.01.07.12, visto: '2026-09-28 GET /suite/historial dice quién, qué y en qué herramienta acabó aplicándose', c: A, fase: 2, svc: tenancy, estado: hecho, t: "Auditoría transversal: un solo registro que dice quién cambió qué y en qué herramienta acabó aplicándose"}
              - {id: CRM-00.01.07.13, visto: '2026-09-28 baja en cascada que no existía: ahora se encola, llega a la herramienta y el certificado sólo firma cuando consta cerrada', c: A, fase: 2, svc: tenancy, estado: hecho, t: "Baja del tenant en cascada con certificado único: se cierra en las tres o se dice cuál ha quedado abierta"}

      - id: "0.2"
        nombre: Arquitectura headless / API-first
        funciones:

          - id: CRM-00.02.01
            nombre: Contratos de API
            capacidades:
              - {id: CRM-00.02.01.01, c: C, fase: 0, svc: core, estado: hecho, t: "API REST completa: todo lo que hace la UI es posible por API, sin excepciones"}
              - {id: CRM-00.02.01.02, c: A, fase: 1, svc: gateway, estado: hecho, t: "API GraphQL para lectura compuesta y agregación en una llamada", sin_pantalla_porque: "GraphQL es un protocolo: se consume desde fuera. Su pantalla seria el propio esquema, que ya se publica en Contrato de la API"}
              - {id: CRM-00.02.01.03, c: A, fase: 0, svc: core, estado: hecho, reutiliza: "contecpos:packages/contracts (buf + protobuf)", t: "gRPC / protobuf para comunicación interna y clientes de alto rendimiento", sin_pantalla_porque: "gRPC es transporte interno y para clientes de alto rendimiento: no hay nada que una persona vea ni pulse"}
              - {id: CRM-00.02.01.04, c: C, fase: 0, svc: core, estado: hecho, reutiliza: "contecmind:scripts/dump_openapi.py", t: "Especificación OpenAPI 3.x generada desde el código, no mantenida a mano"}
              - {id: CRM-00.02.01.05, visto: '2026-10-26 Comprobado sobre el contrato publicado que TODA ruta de negocio cuelga de la version mayor. Con la version en la URI, un cambio rompedor puede convivir con lo anterior y cada integrador migra cuando puede; sin ella, el dia del cambio es el dia de todos', c: C, fase: 0, svc: core, estado: hecho, t: "Versionado explícito (URI o cabecera) con política de deprecación publicada"}
              - {id: CRM-00.02.01.06, visto: '2026-10-26 Construido el SELLO del contrato publicado —2.396 operaciones de catorce servicios, metodo y camino— y el gate que comprueba que ninguna desaparezca. Esta promesa no se rompe con un error: se rompe en silencio, y quien se entera es el cliente de otro en produccion el dia del despliegue. Anadir no rompe y no se vigila; quitar no se bloquea del todo, se bloquea quitar SIN DECIRLO — para retirar algo hay dos caminos explicitos: anunciar la retirada y subir la version mayor, o volver a sellar dejando constancia en el commit. Mutado: apuntando en el sello una operacion que no existe, el gate la delata por su nombre', c: C, fase: 0, svc: core, estado: hecho, t: "Compatibilidad hacia atrás garantizada; cambios rompedores solo en nueva versión mayor", sin_pantalla_porque: "La compatibilidad hacia atras es una garantia que se comprueba en cada push con el contrato sellado; una pantalla no la ensena, la ensena que nada se rompa"}
              - {id: CRM-00.02.01.07, visto: '2026-10-26 Con fecha anunciada, Sunset y Deprecation van en TODA respuesta: es el unico canal que el integrador ya esta leyendo, porque una circular por correo la lee quien sigue en la empresa el dia que se manda. Y SIN fecha no se manda nada: una cabecera de retirada permanente es ruido, y el ruido se filtra — el dia que si haya fecha, ya habria dejado de mirarla. Mutado: quitando la cabecera de deprecacion, cae la prueba', c: A, fase: 0, svc: core, estado: hecho, t: "Sunset headers y avisos de deprecación proactivos a los consumidores"}
              - {id: CRM-00.02.01.08, c: C, fase: 0, svc: core, estado: hecho, reutiliza: "contecmind:app/core/idempotency.py (238 líneas)", t: "Idempotencia mediante Idempotency-Key en todas las operaciones de escritura", sin_pantalla_porque: "La idempotencia ocurre en cada escritura, con cabecera. Lo que una persona ve es que reintentar no duplica, no un sitio donde mirarlo"}
              - {id: CRM-00.02.01.09, c: C, fase: 0, svc: core, estado: hecho, t: "Concurrencia optimista: ETag / If-Match / versión de registro", sin_pantalla_porque: "La concurrencia optimista se nota al guardar —el aviso de que otro lo cambio antes— y eso ya lo ensena el formulario; no tiene pantalla propia"}
              - {id: CRM-00.02.01.10, visto: '2026-10-26 El cursor no se salta ni repite filas, comprobado INSERTANDO una fila entre pagina y pagina, que es el caso real: con desplazamiento, una fila nueva empuja a las demas y una se salta — sin error y sin aviso, y quien exporta se lleva 4.999 de 5.000 sin saberlo. La pagina dice si hay mas, para no tener que pedir una de mas en cada recorrido, y un cursor inventado se rechaza en vez de devolver la primera pagina como si nada', c: C, fase: 0, svc: core, estado: hecho, reutiliza: "contecflow-PSA:app/services/pagination_service.py", t: "Paginación por cursor estable, filtrado, ordenación y proyección de campos", sin_pantalla_porque: "Paginacion, filtro, orden y proyeccion son como responde la API. Se usan en todas las tablas y no son una pantalla"}
              - {id: CRM-00.02.01.11, c: C, fase: 0, svc: core, estado: hecho, t: "Operaciones masivas: bulk create/update/upsert/delete con informe de resultados parciales"}
              - {id: CRM-00.02.01.12, c: C, fase: 0, svc: core, estado: hecho, t: "API asíncrona para cargas largas: job ID, polling y callback"}
              - {id: CRM-00.02.01.13, c: A, fase: 0, svc: core, estado: hecho, t: "Batch/composite requests (varias operaciones en una llamada, transaccionales o no)", sin_pantalla_porque: "Las peticiones compuestas las manda un cliente de fuera para ahorrar viajes: no hay nada que ensenar"}
              - {id: CRM-00.02.01.14, visto: '2026-10-26 Problem Details con tipo de contenido problem+json, codigo ESTABLE —el texto es para quien lo lee, mirarlo ata al integrador al idioma y a la redaccion, y las dos cambian— y el identificador de la peticion DENTRO del cuerpo ademas de en la cabecera, porque lo que el usuario copia es lo que ve en pantalla; comprobado que los dos coinciden. Y un registro ajeno da 404 y no 403: el 403 confirma que ese identificador existe, y enumerando se averigua cuantos clientes tiene otro', c: C, fase: 0, svc: core, estado: hecho, reutiliza: "contecmind:app/core/errors.py + tests/unit/test_error_envelope_contract.py", t: "Errores normalizados (RFC 9457 Problem Details) con código estable y correlación", sin_pantalla_porque: "El formato de error normalizado lo consume el cliente. Lo que una persona ve es el mensaje, que ya sale donde falla"}
              - {id: CRM-00.02.01.15, c: A, fase: 0, svc: gateway, estado: hecho, t: "Sandbox de API con datos sintéticos y consola interactiva"}

          - id: CRM-00.02.02
            nombre: Eventos y notificaciones salientes
            capacidades:
              - {id: CRM-00.02.02.01, visto: '2026-10-26 Recorrido por HTTP: suscribirse a un tipo que no existe se RECHAZA y se dice cuales valen —no falla nunca, simplemente no llega nada y el integrador pierde dias buscando el fallo en su lado—; HTTP plano se rechaza porque un webhook lleva datos de negocio firmados; el secreto sale UNA vez al crearla y no vuelve a salir en el listado; y el alta comprueba que la URL se pueda consultar y no apunte a la red interna ni a los metadatos de la nube', visto: '2026-10-05 AUDITADO, cumple. Suscripcion por tenant con filtro por tipo y por condicion, y la entrega lleva su relevo de reintentos corriendo: `pendientes_de_reintento` la llama el relevo de eventing, no una ruta. Los datos se recogen ANTES de salir a la red para no mezclar tenants en una transaccion de sistema', c: C, fase: 0, svc: eventing, estado: hecho, reutiliza: "contecweb:app/services/webhooks.py (528 líneas) + contecmind:app/services/webhooks.py", t: "Webhooks configurables por tenant, con filtros por tipo de evento y por condición"}
              - {id: CRM-00.02.02.02, visto: '2026-10-26 El instante entra DENTRO de la firma, no solo en una cabecera: comprobado que el mismo cuerpo firma distinto en dos segundos. Un mensaje de hace una hora se rechaza aunque la firma sea buena, y la ventana sale de la configuracion y no de una constante — era una constante mientras el ajuste existia documentado como configurable, asi que quien lo tocaba cambiaba un numero que no hacia nada. Mutado: quitando el instante del material firmado, cae la prueba', visto: '2026-10-05 AUDITADO, cumple. HMAC-SHA256 del cuerpo CON el instante dentro, que es la parte que impide el replay: sin el, un mensaje capturado se reenvia tal cual dentro de un ano con su firma intacta. Y la ventana sale de Settings, no de una constante — lo era, y existia el ajuste documentado sin que lo leyera nadie', c: C, fase: 0, svc: eventing, estado: hecho, reutiliza: "contecweb:app/services/webhooks.py (firma HMAC + anti-replay)", t: "Firma HMAC, timestamp y protección anti-replay", sin_pantalla_porque: "La firma HMAC y la proteccion anti-replay las verifica quien recibe el webhook, no quien lo configura"}
              - {id: CRM-00.02.02.03, visto: '2026-10-26 Los reintentos se separan cada vez mas —comprobadas las diferencias crecientes, porque reintentar cada segundo contra un endpoint caido es insistir justo cuando el otro lado intenta levantarse— y una suscripcion desactivada se reactiva con el contador de fallos A CERO: reactivarla con el contador puesto la desactivaria al primer fallo y pareceria que no funciona', c: C, fase: 0, svc: eventing, estado: hecho, reutiliza: "contecmind:app/models/ingest_dlq.py + app/tasks/dlq_requeue.py", t: "Reintentos con backoff exponencial, DLQ y reenvío manual desde consola"}
              - {id: CRM-00.02.02.04, c: C, fase: 0, svc: core, estado: hecho, reutiliza: "contecpos:packages/common/src/outbox.ts", t: "Garantía at-least-once + clave de deduplicación en el payload", sin_pantalla_porque: "La entrega al menos una vez con clave de deduplicacion es una garantia del bus; lo que se ve es la cola de fallidos, que si tiene pantalla"}
              - {id: CRM-00.02.02.05, visto: '2026-10-26 El tenant va en el SUBJECT y no solo en la carga, y el patron de suscripcion es su hermana exacta: comprobado que lo publicado casa con lo suscrito. No casaba —se publicaba con el segmento del tenant y se suscribia sin el— y el bus no entrego un solo evento entre servicios; no fallaba nada porque publicar si funcionaba. Comprobado tambien que el comodin es de UN segmento, para que account.created.v2 no acabe en el consumidor de account.created', c: A, fase: 0, svc: core, estado: hecho, reutiliza: "contecpos:packages/common/src/bus.ts (NATS JetStream, subjects por tenant)", t: "Streaming de eventos (Kafka / Pub-Sub / Kinesis) con topic por tenant o partición", sin_pantalla_porque: "El streaming a Kafka o Pub-Sub es transporte: se configura con el conector y lo que se mira es si entrega, que ya se ve"}
              - {id: CRM-00.02.02.06, c: A, fase: 5, svc: eventing, estado: hecho, t: "Change Data Capture del modelo de datos hacia el data lake del cliente", sin_pantalla_porque: "El CDC hacia el lago del cliente corre solo y lo mira quien opera el lago, no quien usa el CRM"}
              - {id: CRM-00.02.02.07, visto: '2026-10-26 El catalogo publica tipo, version, descripcion y CAMPOS de cada evento: uno que solo lista nombres no sirve para escribir un cliente, y el integrador acaba deduciendolos de un ejemplo que le pasaron por correo. Y el AsyncAPI se publica navegable, en el formato que sus herramientas saben leer', visto: '2026-10-05 AUDITADO, cumple. El AsyncAPI se genera del catalogo de eventos, y el catalogo vive en el nucleo para que se vea entero desde cualquier proceso: estaba repartido por servicio y el de eventos solo veia quince de ciento uno, asi que dar de alta un webhook contestaba que el tipo no existe y el documento entregado describia el quince por ciento del producto. Hay gate que comprueba las dos mitades', c: A, fase: 0, svc: eventing, estado: hecho, t: "Catálogo de eventos documentado (AsyncAPI) con esquema versionado y registry"}
              - {id: CRM-00.02.02.08, c: A, fase: 0, svc: core, estado: hecho, t: "Ordenación garantizada por clave de agregado (p. ej. por cuenta u oportunidad)", sin_pantalla_porque: "La ordenacion por clave de agregado es una garantia del bus: no hay nada que ver salvo que no se desordene"}
              - {id: CRM-00.02.02.09, visto: '2026-10-26 El replay reencola lo ARCHIVADO con su dedup_key —la deduplicacion del otro lado evita procesar dos veces lo que si recibio—, tiene tope de 5000 porque un replay de un ano a un endpoint lento es una denegacion de servicio autoinfligida y ademas al integrador, y rechaza la ventana al reves en vez de devolver cero sin decir por que', c: A, fase: 0, svc: eventing, estado: hecho, t: "Replay de eventos históricos desde un punto en el tiempo"}
              - {id: CRM-00.02.02.10, c: A, fase: 0, svc: gateway, estado: hecho, reutiliza: "contecweb:app/services/ws_manager.py + contecflow-PSA:app/services/ws_manager.py", t: "Long-polling / SSE / WebSocket para clientes que no pueden exponer endpoint", sin_pantalla_porque: "Long-polling, SSE y WebSocket son transportes para clientes que no pueden exponer extremo: los usa una maquina"}

          - id: CRM-00.02.03
            nombre: Desacoplamiento de la presentación
            capacidades:
              - {id: CRM-00.02.03.01, c: C, fase: 0, svc: core, estado: hecho, t: "Cero lógica de negocio en la capa de UI; el backend es la única fuente de verdad", sin_pantalla_porque: "Que no haya logica de negocio en la UI es una propiedad del codigo, con su gate; ensenarla seria ensenar el gate"}
              - {id: CRM-00.02.03.02, c: A, fase: 1, svc: core, estado: hecho, t: "UI de referencia sustituible y opcional (no requisito de licencia ni de despliegue)"}
              - {id: CRM-00.02.03.03, c: A, fase: 1, svc: gateway, estado: hecho, t: "Patrón BFF (Backend For Frontend) para web, móvil, portal y quiosco", sin_pantalla_porque: "El patron BFF es como esta repartido el servidor. No hay nada que una persona vea"}
              - {id: CRM-00.02.03.04, visto: '2026-10-05 AUDITADO, con un hallazgo cerrado. plan_de_generacion estaba escrita y sin ruta: el producto sabia decir que se genera del contrato y que hay que escribir a mano en cada lenguaje —el reintento con espera creciente, la paginacion como iterador, los errores con nombre— y no lo decia en ninguna parte. GET /sdk/plan en el gateway, que es de quien es el contrato', c: A, fase: 1, svc: core, estado: hecho, t: "SDKs mantenidos: JavaScript/TypeScript, Java, .NET, Python, PHP, Go", sin_pantalla_porque: "Los SDK los instala quien programa contra la API; su sitio es el manual tecnico, no una pantalla"}
              - {id: CRM-00.02.03.05, visto: '2026-10-26 AUDITADO CON HUECO, y queda sin construir. Lo que hay es el CONTRATO declarado de cuatro componentes (`sdk.contrato_de_componente` + `GET /sdk/componentes` en el gateway): con que identidad hablan —token acotado al registro que ensenan, NO la sesion del CRM, porque un componente con la sesion del CRM en una web publica deja entrar a quien pase por ahi—, que su contrato es tan publico como el de la API y que el estilo lo hereda del anfitrion. Lo que NO hay es ningun elemento personalizado construido ni empaquetado: no existe `<crm-ficha-cuenta>` en ninguna parte del front. O sea, el contrato sin la pieza. La capacidad dice «opcionales», pero el contrato declarado no es un componente embebible. Queda avisado y no construido; sin prueba que lo cite, a proposito || 2026-10-27 CERRADO EL CIRCUITO. El contrato de los cuatro componentes se declaraba y se servia desde hacia meses, y no existia ni un custom element ni forma de hablar con el CRM desde una web ajena. Lo que decide si esto sirve o es un agujero no es como pinta: es CON QUE IDENTIDAD habla. Un componente que usara la sesion del CRM deja entrar a quien pase por la pagina —basta abrir las herramientas del navegador—, asi que el token va acotado AL REGISTRO y el acotamiento no es un permiso: el identificador va DENTRO del token y ninguna de las cuatro rutas recibe uno por la URL, de modo que no hay nada que cambiar. Hay una prueba que lo comprueba ruta a ruta. El token no hereda los permisos de quien lo pide —si los heredara, el de un escaparate llevaria los de un administrador—, dura lo que se le diga y por defecto una hora, porque vive en el HTML de una pagina que puede quedarse abierta toda la noche. El elemento pesa 1,93 kB comprimidos y se construye APARTE: no arrastra React ni el cliente HTTP ni los estilos, usa Shadow DOM para no pisar ni ser pisado por la web del anfitrion, hereda su aspecto por variables CSS y no toca window ni localStorage. Y el gateway lo enruta por el componente y no por el servicio: quien lo incrusta no tiene por que saber como esta repartido el sistema por dentro', visto: '2026-10-05 AUDITADO, con un hallazgo cerrado. contrato_de_componente estaba escrita y sin ruta. Un componente que se incrusta en la web de un cliente no se puede cambiar a la ligera y lleva dentro con que identidad habla —token acotado, nunca la sesion del CRM, que en una web publica deja entrar a quien pase por ahi—. GET /sdk/componentes', c: A, fase: 3, svc: core, estado: hecho, t: "Componentes embebibles opcionales (web components) para incrustar en portales propios"}
              - {id: CRM-00.02.03.06, visto: '2026-10-26 AUDITADO junto a CRM-00.04.01.08, que es la misma llamada vista desde el otro lado. Comprobado ademas que un campo desactivado DEJA de describirse: si siguiera, el formulario lo pintaria y alguien lo rellenaria, o sea que desactivarlo no desactivaria nada. Mutado: quitando el filtro de activos, la prueba lo caza', c: A, fase: 0, svc: metadata, estado: hecho, t: "Metadata-driven UI: la API expone layouts, campos, permisos y validaciones para que cualquier frontend renderice coherentemente"}
              - {id: CRM-00.02.03.07, visto: '2026-10-26 AUDITADO. El ensayo ejecuta LAS MISMAS reglas que al guardar —la misma llamada de codigo, no una copia— y no escribe nada: un ensayo que deja rastro no es un ensayo. Devuelve los valores ya convertidos, asi que el frontend ve lo mismo que se guardaria y no una copia de lo que mando. Y puede cortar con 422 cuando se le pide: informar y exigir son dos cosas y las dos hacen falta —una importacion que recibe «valido: false» y sigue adelante mete el registro malo igual—. En parcial no se exige lo que no viene, porque en un PATCH el valor que falta es el que ya esta guardado', c: A, fase: 0, svc: metadata, estado: hecho, t: "API de validación consultable antes de enviar (dry-run de reglas)"}
              - {id: CRM-00.02.03.08, c: D, fase: 1, svc: metadata, estado: hecho, t: "Server-driven UI: definición de formularios y vistas servida como JSON"}
              - {id: CRM-00.02.03.09, c: A, fase: 3, svc: integration, estado: hecho, t: "Canales alternativos sin UI: e-mail-in, SMS, voz, chatbot, MCP/agentes, CLI"}
              - {id: CRM-00.02.03.10, c: D, fase: 6, svc: gateway, estado: hecho, t: "Modo CRM invisible: el sistema opera embebido en ERP, portal o herramienta de terceros"}

          - id: CRM-00.02.04
            nombre: Gateway y capa de acceso
            capacidades:
              - {id: CRM-00.02.04.01, visto: '2026-10-26 AUDITADO. Lo que se mide es el agujero que la firma viene a cerrar: se manda una peticion con `x-crm-tenant` de OTRA empresa, `x-crm-permisos: *`, `x-crm-plataforma: 1`, `x-crm-tipo`, `x-crm-sesion` y `x-crm-factor-fuerte` falsificados, y lo que llega al servicio de detras es lo que el gateway resolvio, no lo que pidio el cliente. Lo que no es de identidad si pasa: el gateway no es un filtro de la API. Y la firma interna depende del secreto y de cada valor. Mutado: invirtiendo el orden de la mezcla de cabeceras —que es todo lo que hace falta para que pasen las de fuera— la prueba lo caza || 2026-10-27 ARREGLO GORDO, lo conto quien lo usaba: el tablero de ventas salia entero en rojo con «esta operacion no mira limite». La comprobacion de parametros desconocidos es una dependencia GLOBAL de cada aplicacion y eso incluye el catch-all del gateway, donde el unico parametro declarado es el camino: cualquier filtro, orden o pagina que pasara por el gateway —y por el gateway pasa todo— se rechazaba. No se quita la comprobacion: la hace el servicio de destino, unico que sabe que mira cada ruta suya; aqui seria imposible por construccion, tendria que conocer las 2.475 operaciones de los trece servicios. Marcado con su motivo y probado en los dos sentidos: el proxy exento y SOLO el proxy', c: C, fase: 0, svc: gateway, estado: hecho, t: "API Gateway con autenticación, autorización, rate limiting y enrutamiento por tenant"}
              - {id: CRM-00.02.04.02, visto: '2026-10-26 AUDITADO. Las cuatro vias y, sobre todo, la diferencia entre ellas: token y clave de API son autoritativas; cabecera y subdominio son PISTAS y no conceden nada. Una pista que contradice al token se rechaza —sin esa comprobacion bastaria cambiar una cabecera para operar sobre otro tenant con un token legitimo, que es la via mas barata que existe— y el mensaje no confirma que ese tenant exista. Sin dominio raiz configurado no se deduce nada del Host, y www/api/app no son tenants. Mutado: quitando el contraste y haciendo autoritativa cualquier via, las pruebas lo cazan', c: C, fase: 0, svc: gateway, estado: hecho, reutiliza: "contecmind:tenant_root_domain + X-Tenant-Slug (config_parts/_app.py)", t: "Resolución de tenant por subdominio, cabecera, claim del token o clave de API"}
              - {id: CRM-00.02.04.03, c: A, fase: 0, svc: gateway, estado: hecho, t: "mTLS para integraciones máquina-a-máquina críticas", sin_pantalla_porque: "mTLS es configuracion de red entre maquinas: se declara en el despliegue y no hay nada que pulsar"}
              - {id: CRM-00.02.04.04, c: A, fase: 0, svc: gateway, estado: hecho, reutiliza: "contecweb:app/services/security_rules.py", t: "IP allowlisting por tenant y por credencial"}
              - {id: CRM-00.02.04.05, c: A, fase: 0, svc: gateway, estado: hecho, reutiliza: "contecmind:app/core/cache_registry.py", t: "Cacheo configurable con invalidación por evento y aislamiento por tenant", sin_pantalla_porque: "El cacheo con invalidacion por evento es comportamiento del gateway: lo que se ve es que el dato esta al dia"}
              - {id: CRM-00.02.04.06, c: A, fase: 1, svc: gateway, estado: hecho, reutiliza: "contecflow-PSA:app/services/developer_portal_service.py + app/models/oauth_apps.py", t: "Portal de desarrollador por tenant: claves, scopes, logs de llamada, cuotas"}
              - {id: CRM-00.02.04.07, visto: '2026-10-26 AUDITADO. El `x-request-id` vuelve en la respuesta se haya mandado o no —si solo volviera cuando el cliente lo manda, el soporte dependeria de que cada integracion se acordara de generarlo— y el del cliente se respeta en vez de generarse otro. El `traceparent` entrante conserva su trace_id: un trace_id que se reinicia en nuestra puerta deja la mitad del viaje sin unir, y lo que el cliente ve en su herramienta y lo que vemos en la nuestra pasan a ser dos sucesos distintos. Mutado: tirando el traceparent entrante, la prueba lo caza', c: C, fase: 0, svc: core, estado: hecho, reutiliza: "contecmind:app/core/middleware.py (X-Request-Id) + tracing.py", t: "Trazabilidad extremo a extremo: X-Request-Id / traceparent propagado y consultable"}

      - id: "0.3"
        nombre: Orquestación de servicios y procesos
        funciones:

          - id: CRM-00.03.01
            nombre: Descomposición en servicios
            capacidades:
              - {id: CRM-00.03.01.01, c: C, fase: 0, svc: infra, estado: hecho, reutiliza: "contecpos:services/* (14 servicios por capacidad)", t: "Servicios delimitados por capacidad de negocio (party, sales, service, marketing, billing-interface)", sin_pantalla_porque: "Como estan repartidos los servicios es arquitectura: se comprueba con el gate de acoplamiento, no se ensena"}
              - {id: CRM-00.03.01.02, visto: '2026-10-26 AUDITADO. Ya lo fijaba el gate de arquitectura `test_ningun_servicio_importa_modulos_de_otro`, que recorre los mas de 200 modulos de los 14 servicios: ahora lo cita. Las unicas excepciones admitidas son tres importaciones del motor de procesos (logica pura sin estado, que de otro modo estaria duplicada en tres sitios) y estan escritas en el gate para que sean una decision y no un descuido. Una lectura directa del esquema ajeno convierte el modelo de datos del vecino en tu API, y el dia que lo cambie se rompe algo que no es suyo', c: C, fase: 0, svc: infra, estado: hecho, reutiliza: "contecpos:deploy/crear-bases.sh (una base y un rol por servicio)", t: "Propiedad exclusiva de datos por servicio; prohibida la lectura directa de la BD ajena", sin_pantalla_porque: "Que ningun servicio lea la base de otro es una prohibicion verificada por gate; una pantalla no puede ensenar una ausencia"}
              - {id: CRM-00.03.01.03, c: A, fase: 0, svc: core, estado: hecho, reutiliza: "contecpos:packages/contracts (buf)", t: "Contratos internos versionados y verificados por contract testing (consumer-driven)", sin_pantalla_porque: "El contract testing entre servicios corre en el preflight; su resultado es que nada se rompa"}
              - {id: CRM-00.03.01.04, c: A, fase: 0, svc: docs, estado: hecho, t: "Service registry / catálogo interno con owner, SLO, dependencias y runbook"}
              - {id: CRM-00.03.01.05, c: A, fase: 2, svc: infra, estado: hecho, t: "Service mesh: mTLS, retries, timeouts, circuit breaking y canary a nivel de red", sin_pantalla_porque: "El service mesh es infraestructura de red: reintentos, timeouts y circuit breaking viven en el despliegue"}
              - {id: CRM-00.03.01.06, c: A, fase: 0, svc: infra, estado: hecho, t: "Despliegue independiente por servicio, sin ventanas de release coordinadas", sin_pantalla_porque: "El despliegue independiente por servicio es una propiedad de como se publica, no algo que se mire desde dentro"}
              - {id: CRM-00.03.01.07, c: A, fase: 2, svc: integration, estado: hecho, t: "Strangler pattern soportado para convivir con CRM heredado durante la migración"}

          - id: CRM-00.03.02
            nombre: Motor de orquestación de procesos
            capacidades:
              - {id: CRM-00.03.02.01, c: C, fase: 0, svc: orchestrator, estado: hecho, reutiliza: "contecmind:app/services/workflows.py + workflow_checkpoints.py + app/models/workflow_run.py", t: "Motor de workflow persistente y duradero (reanuda tras caída, sin perder estado)", sin_pantalla_porque: "Que el motor reanude tras una caida es una garantia: lo que se ve es que la instancia sigue donde estaba, y eso ya se ensena en su grafico"}
              - {id: CRM-00.03.02.02, visto: '2026-10-26 HALLAZGO: una condicion de decision SIN atributo se tomaba siempre. El motor resolvia «@» a None, el valor por defecto tambien era None y el «=» daba cierto, asi que una condicion mal escrita —«variable»/«operador» en vez de «si»/«atributo», la errata plausible— se iba SIEMPRE por la primera rama, sin error, sin traza y con el «si_no» de al lado sin usarse nunca. El validador lo aceptaba. Arregladas las dos mitades: se rechaza al validar y el motor devuelve falso, para que las definiciones ya guardadas dejen de tomar la rama a ciegas. Comprobado ademas que el lienzo ES la definicion —las posiciones viajan dentro del mismo JSON— y que un borrador tambien se valida', c: C, fase: 1, svc: orchestrator, estado: hecho, reutiliza: "contecflow-PSA:app/models/bpmn_process.py + app/services/bpmn_process_service.py; contecmind:app/services/bpmn.py", t: "Modelado visual de procesos (BPMN 2.0 o equivalente) más definición como código"}
              - {id: CRM-00.03.02.03, visto: '2026-10-26 Recorrido el listado de sagas por estado: «atascada» es LA consulta, porque son las que dejaron trabajo hecho que no se puede deshacer, y sale con su motivo. Sin listado no se llega a la ficha, y a lo que no se llega no se arregla a mano', c: A, fase: 0, svc: orchestrator, estado: hecho, t: "Orquestación (saga orquestada con coordinador central)", sin_pantalla_porque: "La orquestacion con coordinador central es COMO se ejecuta un proceso; lo que una persona ve es la instancia y por donde va, que si tiene pantalla"}
              - {id: CRM-00.03.02.04, visto: '2026-10-26 Cruzado publicar con recibir en el transporte: dos suscriptores con grupos distintos reciben el mismo evento y quien publica no sabe quien le escucha. Mientras ninguna prueba lo cruzaba, este transporte guardaba el patron sin expandir y no entregaba nada — con la apariencia contraria, porque ni suscribirse ni publicar fallaban', c: A, fase: 0, svc: orchestrator, estado: hecho, reutiliza: "contecpos:packages/common/src/bus.ts + outbox.ts", t: "Coreografía por eventos para flujos de bajo acoplamiento", sin_pantalla_porque: "La coreografia por eventos es como se comunican los servicios entre si; lo que se ve son los eventos, que ya tienen pantalla"}
              - {id: CRM-00.03.02.05, c: A, fase: 0, svc: orchestrator, estado: hecho, t: "Compensaciones explícitas por paso (rollback semántico de sagas)", sin_pantalla_porque: "La compensacion por paso la declara quien disena el proceso dentro del propio paso: no es una pantalla aparte, es un campo del paso"}
              - {id: CRM-00.03.02.06, visto: '2026-10-26 Comprobado sobre la FILA escrita y no sobre la cola en memoria: el evento se escribe en la misma transaccion que el dato y nace sin publicar, que es lo que permite saber cuales faltan por salir. Una cola en memoria da verde aunque el volcado reviente', c: C, fase: 0, svc: core, estado: hecho, reutiliza: "contecpos:packages/common/src/outbox.ts", t: "Transactional outbox / inbox para consistencia entre BD y bus de eventos", sin_pantalla_porque: "El outbox transaccional es el mecanismo que impide perder un evento al confirmar; lo que se mira es la cola de fallidos"}
              - {id: CRM-00.03.02.07, visto: '2026-10-26 La instancia dormida tiene fecha de despertar y no consume nada: ni hilo parado ni poll, solo una fecha que el planificador consulta por indice. Comprobado que arrancar NO ejecuta —deja la instancia lista para el worker, porque arrancar un proceso no puede alargar la peticion que lo pidio— y que al avanzar pasa a «esperando»', c: C, fase: 0, svc: orchestrator, estado: hecho, reutiliza: "contecmind:app/tasks/_cron.py + app/core/scheduler.py", t: "Timers, esperas, fechas límite y escalados temporales dentro del proceso"}
              - {id: CRM-00.03.02.08, visto: '2026-10-26 HALLAZGO menor y cerrado: el subproceso guardaba padre_id y profundidad en la fila y la API NO los devolvia, asi que una instancia fallida aparecia suelta y no habia forma de llegar al proceso de negocio del que cuelga — que es justo para lo que sirve encadenarlos. Anadidos al contrato', c: A, fase: 0, svc: orchestrator, estado: hecho, t: "Sub-procesos, procesos reutilizables y llamadas entre procesos"}
              - {id: CRM-00.03.02.09, c: C, fase: 0, svc: orchestrator, estado: hecho, reutiliza: "contecmind:app/services/approval_engine/ (motor multi-etapa + SoD + SLA + delegación); contecweb:app/services/approvals/engine.py", t: "Tareas humanas: asignación, bandeja de tareas, reasignación, delegación, SLA"}
              - {id: CRM-00.03.02.10, c: C, fase: 0, svc: orchestrator, estado: hecho, t: "Reglas de decisión declarativas (DMN / tablas de decisión) editables por negocio"}
              - {id: CRM-00.03.02.11, c: C, fase: 0, svc: orchestrator, estado: hecho, t: "Instancias de proceso consultables: estado, historial, variables, punto de fallo"}
              - {id: CRM-00.03.02.12, c: A, fase: 0, svc: orchestrator, estado: hecho, t: "Reintento, salto de paso y edición de variables en caliente por un administrador"}
              - {id: CRM-00.03.02.13, c: D, fase: 2, svc: orchestrator, estado: hecho, t: "Migración de instancias en vuelo a una nueva versión del proceso"}
              - {id: CRM-00.03.02.14, visto: '2026-10-26 Simular recorre el proceso por la rama que toca segun las variables, responde por las tareas humanas —sin eso se simula hasta la primera aprobacion y ahi se acaba la utilidad— y NO crea nada: comprobado que no arranca instancia ni guarda definicion', c: A, fase: 0, svc: orchestrator, estado: hecho, t: "Simulación y pruebas de proceso con datos de ejemplo antes de publicar"}
              - {id: CRM-00.03.02.15, visto: '2026-10-26 Comprobado con dos tenants: ni las definiciones ni las instancias de uno se ven desde el otro, y arrancar el proceso ajeno no se puede. Un motor compartido sin aislamiento dejaria a una empresa ejecutando el proceso de otra con los datos de la primera', c: C, fase: 0, svc: orchestrator, estado: hecho, t: "Multi-tenancy del motor: definiciones y aislamiento de ejecución por tenant", sin_pantalla_porque: "El aislamiento de ejecucion del motor entre tenants es una garantia del servidor, comprobada con el barrido de aislamiento"}
              - {id: CRM-00.03.02.16, c: C, fase: 0, svc: orchestrator, estado: hecho, t: "Límites de recursión, bucles y ejecución para evitar procesos desbocados", sin_pantalla_porque: "Los limites de recursion y bucle son un tope que corta; lo que se ve es la traza que dice que corto, y esa si se ensena"}

          - id: CRM-00.03.03
            nombre: Automatización declarativa para negocio (low-code)
            capacidades:
              - {id: CRM-00.03.03.01, visto: '2026-10-26 Las tres partes recorridas: el «si Y» decide de verdad —con importe 5000 se dispara y con 10 no—, y la lista de ACCIONES es CERRADA. Una automatizacion que ejecutara codigo arbitrario seria codigo de un usuario final corriendo en produccion, con los permisos del sistema y sin revision; comprobado que no hay ninguna accion de evaluar, ejecutar o SQL', c: C, fase: 0, svc: automation, estado: hecho, reutiliza: "contecflow-PSA:app/models/automations.py + app/services/automations_service.py", t: "Constructor de automatizaciones tipo cuando ocurre X, si Y, entonces Z"}
              - {id: CRM-00.03.03.02, visto: '2026-10-26 Solo se aplican las reglas del disparador Y del objeto —una regla de «cuando se crea una oportunidad» no se dispara al borrar una cuenta—, una desactivada no se aplica —desactivar es como se para una regla que hace dano sin perder lo que costo escribirla— y una de otro tenant tampoco: eso no seria un fallo de permisos, seria una empresa modificando los registros de otra', c: C, fase: 0, svc: automation, estado: hecho, reutiliza: "contecflow-PSA:app/services/automations_service.py (disparadores)", t: "Disparadores: creación, modificación de campo, eliminación, evento entrante, webhook, programado, manual"}
              - {id: CRM-00.03.03.03, c: C, fase: 0, svc: automation, estado: hecho, t: "Acciones: crear/actualizar registro, notificar, llamar API externa, lanzar proceso, asignar, calcular"}
              - {id: CRM-00.03.03.04, c: A, fase: 0, svc: automation, estado: hecho, t: "Ramificaciones, bucles sobre colecciones y variables de flujo"}
              - {id: CRM-00.03.03.05, visto: '2026-10-26 El momento —inmediata, diferida o programada— se declara en la regla. Recorrido junto con el resto del motor; lo que fija este bloque es que el motor llega a terminar, que es lo que estaba roto', c: C, fase: 0, svc: automation, estado: hecho, t: "Ejecución inmediata vs. diferida vs. programada"}
              - {id: CRM-00.03.03.06, visto: '2026-10-26 HALLAZGO GORDO al medir esto: las variables finales se metian dentro de `decisiones`, que es una LISTA —una entrada por condicion—, con un desempaquetado de diccionario. O sea que toda regla que SI cumplia sus condiciones reventaba con «list object is not a mapping» al terminar: solo pasaban las que NO se disparaban. Arreglado con columna propia y su migracion. Y la cascada se corta por profundidad y DICE por que: dos reglas que se disparan mutuamente consumen el sistema entero y eso no falla, va lento y nadie sabe por que. Comprobadas las dos mitades, porque un guardian que lo corte todo tambien «evita los bucles» y deja las automatizaciones sin ejecutarse nunca', c: C, fase: 0, svc: automation, estado: hecho, t: "Gestión de orden de ejecución y prevención de bucles infinitos entre reglas"}
              - {id: CRM-00.03.03.07, visto: '2026-10-26 La traza deja QUE decidio cada condicion sobre ESE registro —atributo, operador y si se cumplio— y con que variables acabo. «Por que no se ha disparado» es la pregunta de toda automatizacion que alguien configura, y sin esto se contesta leyendo codigo, que quien la configuro no sabe leer', c: A, fase: 0, svc: automation, estado: hecho, t: "Depurador con ejecución paso a paso y log de decisiones por registro"}
              - {id: CRM-00.03.03.08, c: A, fase: 0, svc: automation, estado: hecho, t: "Entorno de pruebas y despliegue de automatizaciones entre entornos"}
              - {id: CRM-00.03.03.09, c: A, fase: 1, svc: automation, estado: hecho, t: "Biblioteca de plantillas de automatización por industria"}

          - id: CRM-00.03.04
            nombre: Integración y conectividad
            capacidades:
              - {id: CRM-00.03.04.01, c: A, fase: 2, svc: integration, estado: hecho, reutiliza: "contecflow-PSA:app/services/{salesforce,stripe,jira,git,m365,slack}_service.py; contecweb:app/services/supplier_api", t: "Conectores nativos: ERP, facturación, firma electrónica, telefonía, mensajería"}
              - {id: CRM-00.03.04.02, c: A, fase: 0, svc: integration, estado: hecho, reutiliza: "contecweb:app/connectors/api + base.py (conector HTTP genérico, verificado 2026-09-14)", t: "Conector genérico HTTP/REST configurable sin código (auth, mapeo, paginación)"}
              - {id: CRM-00.03.04.03, visto: '2026-10-04 descargar_sftp leia lo que hubiera y lo devolvia como entero: un fichero truncado entraba como completo. Ahora se mira el nombre (.part/.tmp, configurable), el tamano entre dos miradas y OTRA VEZ despues de leer; si cambio, se descarta lo leido. Contador de intentos con umbral configurable. Y archivar_sftp aceptaba cualquier clave de host mientras listar y descargar exigian la huella: las tres pasan ya por el mismo conector. Mutado: quitando la mirada previa cae 1, quitando la posterior caen 2. PENDIENTE: ningun barrido ejecuta los cinco transportes heredados, estan registrados y no los corre nadie', c: A, fase: 2, svc: integration, estado: hecho, t: "Soporte SOAP, SFTP, ficheros planos, EDI y colas AMQP para entornos legacy", sin_pantalla_porque: "SOAP, SFTP, ficheros planos, EDI y AMQP son transportes del conector: se eligen al declararlo, y esa pantalla ya existe"}
              - {id: CRM-00.03.04.04, visto: '2026-10-26 A MEDIAS, y queda avisado: el MAPEO esta —traduce los campos de la API a los nuestros por ruta, con marcadores de vacio y expansion de listas anidadas— pero NO hay funciones de transformacion ni validacion de lo mapeado, que es lo que pide el enunciado. Lo que se consigue hoy es copiar valores de un sitio a otro; recortar, pasar a mayusculas, componer una fecha o rechazar un registro que no cumple no se puede. Construirlo es funcionalidad nueva, asi que no se ha hecho: decidir el alcance no me toca || 2026-10-27 CERRADO lo que faltaba. Tres pasos y antes solo estaba el primero: mapear, TRANSFORMAR —recortar, mayusculas, minusculas, quitar prefijo o sufijo, numero con coma decimal, booleano, fecha con el formato del otro lado, valor por defecto y tabla de codigos— y VALIDAR —campos obligatorios y valores admitidos—. Es una LISTA CERRADA y no un interprete: una expresion en la configuracion de una integracion es codigo de un usuario final corriendo en el servidor, la misma decision que en las acciones de las automatizaciones. El valor por defecto se aplica tambien al hueco, que es lo unico que lo hace util. La fecha NO se adivina entre dia/mes y mes/dia: acertar por sorteo mete una fecha equivocada que nadie revisa. Un codigo que no esta en la tabla se deja como viene y lo rechaza la validacion, mejor que inventar un estado que aqui no significa nada. Lo que no cumple ni se cuela ni se tira en silencio: se aparta con su motivo y sale en el resultado, porque una importacion que dice 200 y guarda 180 es la forma mas silenciosa de perder datos. Y las funciones mal escritas se cazan AL PUBLICAR el conector, no en la primera importacion de un cliente', c: A, fase: 0, svc: integration, estado: hecho, reutiliza: "contecweb:app/services/normalization/", t: "Motor de transformación y mapeo de datos con funciones y validación"}
              - {id: CRM-00.03.04.05, visto: '2026-10-26 La conexion guarda cuando se probo, con que resultado y con que detalle —«fallo» sin el motivo manda a mirar los registros del servidor, que es lo que esa pantalla evita— y las credenciales no estan en claro en la tabla', c: C, fase: 0, svc: integration, estado: hecho, reutiliza: "contecweb:app/services/credentials.py + contecflow-PSA:app/services/integration_credentials_service.py", t: "Gestión de credenciales por conexión con rotación y prueba de conectividad"}
              - {id: CRM-00.03.04.06, visto: '2026-10-26 Lo fallido guarda que evento, cuantas veces se intento, que dijo el otro lado y cuando: sin las cuatro, «la integracion va mal» no se puede contestar. Y el registro de ejecuciones tiene purga POR DIAS y no por filas, porque el criterio es cuanto hace falta mirar hacia atras, no cuanto ocupa — una tabla de monitor que solo crece acaba siendo la mas grande de la base', c: C, fase: 0, svc: integration, estado: hecho, reutiliza: "contecflow-PSA:app/services/integration_test_service.py", t: "Monitor de integraciones: ejecuciones, errores, reproceso, alertas"}
              - {id: CRM-00.03.04.07, visto: '2026-10-26 El reenvio devuelve el evento a la cola de SALIDA en vez de publicarlo aparte, asi que pasa por exactamente el mismo camino que un envio normal: un segundo camino es un segundo sitio donde romperse, y se desincroniza del primero en cuanto alguien toca uno. Queda firmado QUIEN lo reenvio y cuando —un reenvio sin firma es una publicacion que aparece de la nada en la auditoria— y reenviar algo que ya no esta lo DICE. Mutado: quitando la firma, cae la prueba', c: C, fase: 0, svc: integration, estado: hecho, reutiliza: "contecmind:app/models/ingest_dlq.py + app/tasks/dlq_requeue.py", t: "Cola de mensajes fallidos con corrección y reenvío asistido"}
              - {id: CRM-00.03.04.08, c: A, fase: 2, svc: integration, estado: hecho, t: "Sincronización bidireccional con resolución de conflictos configurable"}
              - {id: CRM-00.03.04.09, visto: '2026-10-04 desde_canonico estaba escrita, probada y SIN NINGUNA RUTA: se podia traducir lo que entraba y no habia forma de obtener la traduccion de salida, asi que quien mandaba algo a ese sistema se reescribia el mapeo por su cuenta y acababa habiendo dos. Anadida POST /modelo-canonico/traducir-salida, que respeta la direccion declarada por campo y devuelve aparte lo que no viaja', c: A, fase: 2, svc: integration, estado: hecho, t: "Modelo canónico de intercambio y adaptadores por sistema externo"}
              - {id: CRM-00.03.04.10, visto: '2026-10-26 El manifiesto se valida ANTES de publicar y devuelve TODOS los problemas de golpe —quien escribe uno de veinte operaciones no puede descubrirlos de uno en uno— incluidos los dominios a los que llama, que se exigen para que alguien pueda revisar a donde van los datos antes de instalarlo. El catalogo ensena la ULTIMA version de cada conector y no el historial: con todas delante, alguien instala la 2 teniendo la 5', c: A, fase: 6, svc: integration, estado: hecho, reutiliza: "contecflow-PSA:app/models/marketplace.py + app/services/marketplace_service.py", t: "Marketplace / registro de integraciones instalables por tenant"}
              - {id: CRM-00.03.04.11, c: D, fase: 6, svc: integration, estado: hecho, t: "Soporte MCP (Model Context Protocol) o equivalente para exposición a agentes de IA"}

          - id: CRM-00.03.05
            nombre: Workflows de negocio — aprobaciones, escalados y revisiones
            capacidades:
              - {id: CRM-00.03.05.01, c: C, fase: 1, svc: orchestrator, estado: hecho, reutiliza: "contecflow-PSA:app/models/workflow_designer.py (lienzo de nodos y versiones)", t: "Editor gráfico de flujos: el lienzo de nodos y conexiones ES la definición, no un dibujo que la documenta"}
              - {id: CRM-00.03.05.02, c: C, fase: 1, svc: orchestrator, estado: hecho, t: "La misma definición como gráfico y como código (JSON/YAML), intercambiables sin pérdida ni segunda fuente de verdad"}
              - {id: CRM-00.03.05.03, c: C, fase: 1, svc: orchestrator, estado: hecho, t: "Validación antes de publicar: nodos inalcanzables, ciclos sin salida, ramas sin destino, tareas sin responsable posible"}
              - {id: CRM-00.03.05.04, c: C, fase: 1, svc: orchestrator, estado: hecho, reutiliza: "contecflow-PSA:app/services/approval_engine/workflows.py (simulate_workflow)", t: "Simulación con datos reales antes de publicar: qué ruta seguiría, quién aprobaría y cuánto tardaría"}
              - {id: CRM-00.03.05.05, c: C, fase: 1, svc: orchestrator, estado: hecho, t: "Versionado con borrador, publicado y archivado; las instancias en vuelo terminan con su versión"}
              - {id: CRM-00.03.05.06, c: C, fase: 2, svc: orchestrator, estado: hecho, reutiliza: "contecflow-PSA:app/services/approval_engine/requests.py (quórum y decisiones)", t: "Aprobaciones en cadena y en paralelo con quórum configurable: todos, mayoría, cualquiera, N de M"}
              - {id: CRM-00.03.05.07, c: C, fase: 2, svc: orchestrator, estado: hecho, t: "Resolución del aprobador por regla: jerarquía de mando, importe, unidad de negocio, rol o campo del registro"}
              - {id: CRM-00.03.05.08, c: C, fase: 2, svc: orchestrator, estado: hecho, t: "Delegación y sustitución por ausencia con vigencia, sin perder la traza de quién decidió de verdad"}
              - {id: CRM-00.03.05.09, c: C, fase: 2, svc: orchestrator, estado: hecho, reutiliza: "contecflow-PSA:app/services/approval_engine/timeouts.py", t: "Escalado por tiempo, por inactividad y por jerarquía, con aviso antes de escalar y no solo después"}
              - {id: CRM-00.03.05.10, c: C, fase: 2, svc: orchestrator, estado: hecho, t: "Reaprobación automática cuando cambia lo aprobado: un descuento aprobado que sube vuelve a aprobación"}
              - {id: CRM-00.03.05.11, c: A, fase: 2, svc: orchestrator, estado: hecho, t: "Aprobación automática bajo umbral, registrada como tal: quién la habría tenido que dar y por qué no hizo falta"}
              - {id: CRM-00.03.05.12, c: C, fase: 2, svc: orchestrator, estado: hecho, t: "Decidir desde el correo o el móvil sin entrar al CRM, con enlace firmado de un solo uso y caducidad"}
              - {id: CRM-00.03.05.13, c: C, fase: 2, svc: orchestrator, estado: hecho, t: "Bandeja unificada de lo que me toca decidir, con el contexto suficiente para decidir sin abrir el registro"}
              - {id: CRM-00.03.05.14, c: A, fase: 2, svc: orchestrator, estado: hecho, t: "Vista de la instancia sobre el propio gráfico: por dónde va, qué queda y dónde falló"}
              - {id: CRM-00.03.05.15, c: A, fase: 2, svc: orchestrator, estado: hecho, t: "Plantillas de flujo por sector y caso de uso, clonables y modificables sin partir de cero"}
              - {id: CRM-00.03.05.16, c: A, fase: 2, svc: analytics, estado: hecho, reutiliza: "contecflow-PSA:app/services/approval_engine/analytics.py", t: "Analítica del flujo: dónde se atasca, cuánto tarda cada paso y quién es el cuello de botella"}

      - id: "0.4"
        nombre: Extensibilidad y modelo de datos
        funciones:

          - id: CRM-00.04.01
            nombre: Modelo de datos configurable
            capacidades:
              - {id: CRM-00.04.01.01, visto: '2026-10-26 AUDITADO. Un objeto propio del tenant vive en la MISMA tabla que los estandar: para un frontend headless no hay diferencia, y esa uniformidad es lo que hace que sea ciudadano de primera y no un apano. Lo que cambia es el campo `origen`, no la tabla. Y el nombre de API es unico por tenant por restriccion de base, no por convenio: es lo que aparece en las URLs y en las integraciones de terceros, y dos iguales harian que la ruta apuntara a uno u otro segun el orden de la consulta', c: C, fase: 0, svc: metadata, estado: hecho, t: "Objetos personalizados por tenant con ciclo de vida completo (CRUD, API, permisos, auditoría)"}
              - {id: CRM-00.04.01.02, visto: '2026-10-26 AUDITADO. Los 19 tipos declarados en `TIPOS_CAMPO` contrastados contra el diccionario de validadores: los unicos sin validador son json, fichero, cifrado, formula y lookup —estructuras que el CRM no interpreta y derivados que calcula otro—. Ocho tipos probados uno por familia con un valor bueno y uno malo, porque lo que importa no es que acepte lo bueno sino que rechace lo malo: un validador que acepta todo pasa la prueba de lo bueno igual de bien. Un tipo que no valida es una columna de texto con nombre bonito', c: C, fase: 0, svc: metadata, estado: hecho, reutiliza: "contecweb:app/services/custom_fields.py (458 líneas) + contecflow-PSA:app/models/custom_fields.py", t: "Campos personalizados: texto, número, moneda, fecha, booleano, lista, lista múltiple, fórmula, lookup, geolocalización, JSON, fichero, cifrado"}
              - {id: CRM-00.04.01.03, c: C, fase: 0, svc: metadata, estado: hecho, t: "Relaciones: 1:1, 1:N, N:M, jerárquicas, polimórficas, maestro-detalle con cascada"}
              - {id: CRM-00.04.01.04, c: A, fase: 1, svc: metadata, estado: hecho, t: "Campos calculados y rollups agregados sobre hijos"}
              - {id: CRM-00.04.01.05, c: A, fase: 1, svc: metadata, estado: hecho, reutiliza: "contecflow-PSA:app/services/issue_type_service.py (tipos con layout propio)", t: "Registros de tipo (record types) con layouts y valores de lista distintos"}
              - {id: CRM-00.04.01.06, visto: '2026-10-26 AUDITADO en los tres niveles, que es lo que pide la capacidad. Campo: obligatorio y restricciones, con el mensaje en ETIQUETA y no en nombre de API —quien lo lee es una persona rellenando un formulario—. Registro: una regla que cruza dos campos, con las condiciones describiendo la situacion PROHIBIDA. Transicion: la asimetria que lo hace configurable sin hacerlo fragil —el tenant QUITA transiciones y no las inventa, porque hay un `if estado == ...` en quince sitios—, el motivo obligatorio en las que alguien preguntara meses despues, y un estado desconocido distinguido de uno no permitido. Ademas: un campo mal escrito se avisa en vez de ignorarse, que es como un dato que el cliente cree haber guardado no esta. Mutado: quitando el aviso de campo desconocido y quitando las restricciones del tenant, las pruebas lo cazan', c: C, fase: 0, svc: metadata, estado: hecho, t: "Validaciones declarativas a nivel de campo, registro y transición de estado"}
              - {id: CRM-00.04.01.07, c: A, fase: 0, svc: metadata, estado: hecho, t: "Máquinas de estado configurables por objeto"}
              - {id: CRM-00.04.01.08, visto: '2026-10-26 AUDITADO. El describe trae en UNA llamada campos con su tipo, si son obligatorios, sus restricciones y su etiqueta, mas reglas, layouts y los permisos de quien pregunta ya resueltos. Sin los permisos, cada frontend tendria que deducir si ensena el boton de borrar, y lo deduciria distinto. Un objeto que no existe da 404 en vez de un objeto vacio, que un frontend pintaria como un formulario sin campos: indistinguible de uno que aun no se ha configurado', c: C, fase: 0, svc: metadata, estado: hecho, t: "Esquema expuesto vía API de metadatos (describe) para clientes headless"}
              - {id: CRM-00.04.01.09, c: A, fase: 0, svc: metadata, estado: hecho, t: "Límites y gobierno del esquema (número de campos, índices, profundidad) con avisos"}
              - {id: CRM-00.04.01.10, c: A, fase: 0, svc: metadata, estado: hecho, t: "Migraciones de esquema seguras: añadir, renombrar, deprecar, backfill con progreso"}
              - {id: CRM-00.04.01.11, c: A, fase: 1, svc: metadata, estado: hecho, t: "Numeración de negocio por objeto: un código único, legible y correlativo, generado por el sistema o validado contra duplicado si lo trae quien da de alta", visto: "2026-10-27 El codigo que la gente dice por telefono. Lo que habia CONTABA FILAS y solo para oportunidades: borrar una repetia el numero de la siguiente, dos altas simultaneas pedian el mismo y una carga historica con codigos propios dejaba el recuento sin relacion con el ultimo emitido. Ahora hay contador de verdad, por objeto y bajo cerrojo de fila, con el patron, el relleno y el reinicio como configuracion del tenant: OPP-2026-00123 es una convencion y hay clientes que numeran por delegacion o arrastran el formato del sistema del que vienen. El patron se comprueba AL GUARDAR —sin {secuencia} todos serian iguales, y reiniciar sin el ano repite los codigos el 1 de enero— y el contador no se puede bajar: repetiria codigos ya impresos. Probado plantando el caso: con el contador viejo, borrar una oportunidad repite OPP-2026-00002"}
              - {id: CRM-00.04.01.12, c: A, fase: 1, svc: metadata, estado: hecho, t: "Granularidad del campo de fecha: día, mes/año o trimestre, declarada en el campo y respetada en validación, filtros, agrupaciones y exportación", visto: "2026-10-27 La granularidad se declara en el CAMPO y no se adivina del valor —adivinarla haria que un 1 de marzo escrito a proposito se leyera como marzo— y se normaliza al GUARDAR, no al pintar: si cada pantalla recortara por su cuenta, dos vistas del mismo dato dirian cosas distintas y una consulta por rango incluiria o excluiria el registro segun el dia que se tecleo. Una granularidad desconocida se rechaza"}

          - id: CRM-00.04.02
            nombre: Extensión por código
            capacidades:
              - {id: CRM-00.04.02.01, c: A, fase: 6, svc: automation, estado: hecho, t: "Funciones serverless del tenant ejecutadas en sandbox aislado y con cuota"}
              - {id: CRM-00.04.02.02, c: A, fase: 0, svc: core, estado: hecho, t: "Hooks pre/post sobre operaciones de dominio (before save, after commit)"}
              - {id: CRM-00.04.02.03, c: A, fase: 0, svc: core, estado: hecho, t: "Extensiones asíncronas suscritas a eventos, sin bloquear la transacción"}
              - {id: CRM-00.04.02.04, c: D, fase: 6, svc: gateway, estado: hecho, t: "Endpoints personalizados definidos por el tenant sobre el mismo gateway"}
              - {id: CRM-00.04.02.05, c: A, fase: 6, svc: automation, estado: hecho, t: "Gestión de dependencias, versiones y rollback del código de extensión"}
              - {id: CRM-00.04.02.06, c: A, fase: 6, svc: automation, estado: hecho, t: "Observabilidad de extensiones: logs, métricas, errores y coste atribuido"}
              - {id: CRM-00.04.02.07, c: A, fase: 6, svc: automation, estado: hecho, t: "Firma y revisión de extensiones de terceros antes de su instalación"}

          - id: CRM-00.04.03
            nombre: Extensión sin código, de punta a punta
            # Lo que se pide es que un campo añadido por configuración en la
            # implantación de un cliente llegue SOLO hasta el final: base de
            # datos, API, formularios, búsqueda, flujos, informes e IA, sin
            # tocar código ni desplegar. El metamodelo (CRM-00.04.01) ya guarda
            # la definición y ya valida; lo que falta es que ese campo aparezca
            # en cada uno de los sitios donde alguien espera encontrarlo. Cada
            # eslabón que falte convierte la promesa en una media verdad: el
            # campo existe, pero no se puede filtrar, o no sale en el informe.
            capacidades:
              - {id: CRM-00.04.03.01, c: C, fase: 1, svc: metadata, estado: hecho, t: "Diseñador visual de formularios y listas: arrastrar campos, secciones, pestañas y condiciones de visibilidad, sin escribir nada"}
              - {id: CRM-00.04.03.02, c: C, fase: 1, svc: metadata, estado: hecho, t: "Un campo nuevo pasa solo a la API de CRUD: se lee, se escribe, se valida y sale en el describe sin tocar código"}
              - {id: CRM-00.04.03.03, c: C, fase: 1, svc: core, estado: hecho, t: "Filtro, orden y búsqueda por campo personalizado, con índice de expresión creado y retirado por el propio sistema"}
              - {id: CRM-00.04.03.04, visto: '2026-10-05 AUDITADO, con un hallazgo cerrado. sincronizar_indices y sincronizar_vista estaban escritas, probadas y SIN LLAMANTE: un campo a medida se guardaba y se validaba, y no recibia ni indice ni vista. Filtrar por el recorria la tabla entera —eso no da un error, da una pantalla que tarda un poco mas cada mes— y la vista tipada del tenant no existia, mientras el motor de informes la nombra como entidad de respaldo. Ahora se aplica al publicar el esquema, en el servicio dueno de la tabla (registro objeto->tabla que apuntan los montadores de listado). Y al ejecutarlas por primera vez salio que el SQL del indice era INVALIDO: un indice por expresion exige dos pares de parentesis y llevaba uno, asi que ninguna de esas sentencias habria funcionado nunca', c: A, fase: 1, svc: core, estado: hecho, t: "Vista SQL por tenant que proyecta cada campo personalizado como columna tipada, para que BI y SQL externos lo lean sin saber que es JSONB"}
              - {id: CRM-00.04.03.05, c: C, fase: 1, svc: automation, estado: hecho, t: "Campos personalizados usables en condiciones, acciones y formularios de los flujos y los procesos, y en las reglas de asignación"}
              - {id: CRM-00.04.03.06, c: C, fase: 1, svc: analytics, estado: hecho, t: "Campos personalizados como dimensión y métrica en informes y cuadros de mando, sin modelado aparte"}
              - {id: CRM-00.04.03.07, visto: '2026-09-29 ROTA de punta a punta y arreglada: el POST validaba y no guardaba (no habia columna) y el GET componia desde la replica del bus, que no lleva descripciones: KeyError de clave con un solo campo publicado. Ahora se guarda en el campo, se lee de la tabla de metadata y lo sensible no sale aunque se marque explotable; probadas las cinco sensibilidades', c: A, fase: 2, svc: intelligence, estado: hecho, t: "Campos personalizados explotables por contecintelligence: descritos en el contexto semántico, consultables en lenguaje natural y utilizables por los modelos"}
              - {id: CRM-00.04.03.08, c: C, fase: 1, svc: core, estado: hecho, t: "Campos personalizados en importación, exportación, plantillas de documento y de correo, y en las vistas del front oficial"}
              - {id: CRM-00.04.03.09, visto: '2026-10-26 AUDITADO. Quien anade un campo obligatorio a un objeto con ochenta mil registros no sabe que los ochenta mil se quedan sin rellenar, y no lo sabe hasta que alguien intenta guardar uno viejo. Se mide que la previsualizacion compara contra la ULTIMA PUBLICACION y no contra el estado actual, que avisa del cambio de tipo —los valores guardados no se convierten— y, lo que mas importa, que cuando no sabe en que tabla vive el objeto lo DICE en vez de devolver un cero: «no se ha podido contar» y «no afecta a nadie» son cosas distintas, y la diferencia es justo la que importa antes de publicar. Mutado: tragandose el aviso de cambio de tipo, la prueba lo caza', c: A, fase: 1, svc: metadata, estado: hecho, t: "Previsualización del cambio de esquema antes de aplicarlo: a cuántos registros afecta, qué se rompe y qué queda sin rellenar"}
              - {id: CRM-00.04.03.10, visto: '2026-10-26 AUDITADO. El paquete lleva configuracion y NUNCA datos —uno que arrastrara registros convertiria una promocion a produccion en una fuga, porque los datos de pruebas suelen ser copias anonimizadas a medias de clientes reales—. Instalar SIMULA por defecto: instalar de verdad hay que pedirlo, porque el error mas caro de quien maneja un paquete es pulsar el boton creyendo que todavia estaba mirando. Lo que ya existe con otro tipo no se pisa: se informa y se deja fuera, que es lo que evita perder dos semanas de trabajo de un consultor. Y un formato desconocido se rechaza en vez de instalar a ciegas. Mutado: forzando la instalacion real en el bucle, la prueba lo caza', c: A, fase: 2, svc: metadata, estado: hecho, t: "Paquetes de configuración: exportar el esquema de un entorno e instalarlo en otro con control de versión y vuelta atrás"}
              - {id: CRM-00.04.03.11, visto: '2026-10-26 AUDITADO, con el alcance dicho. Lo que hay es la DECISION medida: que campos justifican una columna de verdad, con umbral parametrizable y ordenados por escrituras. Sin un numero, cada cliente que note su lista lenta pediria columna y acabariamos con el ALTER TABLE de siempre disfrazado de optimizacion, y un ALTER TABLE en una tabla compartida por mil tenants los bloquea a todos. La EJECUCION —anadir la columna, rellenar por lotes, indexar y empezar a leer de ella— esta documentada paso a paso en la propia respuesta y se hace a mano en una migracion; `UsoCampo.materializado` existe y hoy no lo pone nadie, asi que un campo ya materializado seguiria saliendo como candidato. Es pequeno y queda dicho. Mutado: quitando el umbral de la consulta, la prueba lo caza || 2026-10-27 CERRADA LA EJECUCION. Era prosa en la respuesta del endpoint y se hacia a mano en una migracion. Ahora es un TRABAJO reanudable con los cuatro pasos en su orden, que no es un detalle de implementacion sino la capacidad entera: la columna se anade NULLABLE —instantaneo y sin reescribir la tabla; con NOT NULL o DEFAULT se reescribe y eso bloquea a los mil tenants que la comparten—, se rellena POR LOTES con un commit entre lote y lote —de una vez seria una transaccion de millones de filas y un rollback de horas si falla a la mitad—, se indexa solo sobre las filas de ESE tenant, y SOLO ENTONCES se marca: marcarlo antes haria que las consultas leyeran una columna a medio rellenar y las listas saldrian incompletas sin que fallara nada. La expresion del campo prefiere la columna en UN SOLO sitio —el unico donde se construye—, asi que todo lo que filtra y ordena lo hereda; y va con COALESCE porque la columna es de la tabla, comun a todos, y solo se rellena la del tenant que lo pidio: sin el respaldo, los demas leerian nulo en un campo que si tienen. El nombre lleva prefijo `c_` porque un campo personalizado llamado estado o nombre chocaria con la columna de verdad del objeto. Y el DDL revalida el nombre: esto acaba donde no hay parametros', c: A, fase: 2, svc: metadata, estado: hecho, t: "Materializar un campo personalizado como columna real cuando su volumen lo justifique, con migración en línea y sin bloquear a los demás tenants"}
              - {id: CRM-00.04.03.12, c: A, fase: 1, svc: metadata, estado: hecho, t: "Trazabilidad del esquema: quién añadió cada campo, cuándo, con qué uso real y qué pasa si se retira"}
              - {id: CRM-00.04.03.13, c: A, fase: 1, svc: metadata, estado: hecho, t: "Solo lectura por condición y por procedencia: un campo que llega de un sistema externo o cuyo registro cumple una condición deja de poder editarse, y la pantalla dice por qué y quién manda sobre ese dato", visto: "2026-10-27 Tres puertas, de la mas fija a la mas fina: la marca de siempre, la CONDICION sobre el registro —el importe se edita con la oportunidad abierta y deja de editarse al cerrarla— y la PROCEDENCIA —lo que mantiene un sistema externo lo escribe su integracion y no una persona, porque si lo tocara una persona la siguiente sincronizacion le pisaria el cambio y lo que veria es que no se guarda, sin ningun error—. Lista de origenes vacia significa CUALQUIERA y no ninguno: al reves, la propia migracion habria dejado el modelo entero de solo lectura. El motivo se devuelve con el bloqueo, y la pantalla lo pregunta junto con la visibilidad porque es la misma pregunta"}

          - id: CRM-00.04.04
            nombre: Módulos verticales (caracterización por sector)
            # La extensión sin código (CRM-00.04.03) resuelve el campo que falta
            # en una implantación. Esto resuelve lo otro: que el producto llegue
            # ya caracterizado para un sector. Un operador logístico no necesita
            # «un campo más» — necesita envíos, expediciones, trazabilidad con el
            # transportista, incidencias con su tipología, y que su cliente vea
            # el seguimiento sin llamar.
            #
            # Un módulo es un PAQUETE INSTALABLE: objetos, campos, taxonomías,
            # estados, flujos, permisos, pantallas y conectores, todo declarado.
            # Que el producto sea headless lo hace posible —las pantallas salen
            # de la superficie declarada— pero no lo hace gratis: lo que decide
            # si esto funciona a los dos años es la ACTUALIZACIÓN, porque el
            # cliente habrá tocado lo que el módulo trajo y una actualización que
            # pise sus cambios se deja de instalar.
            capacidades:
              - {id: CRM-00.04.04.01, c: C, fase: 2, svc: metadata, estado: hecho, t: "Manifiesto de módulo declarativo: objetos, campos, taxonomías, estados, flujos, permisos, plantillas y pantallas en un solo paquete versionado"}
              - {id: CRM-00.04.04.02, c: C, fase: 2, svc: metadata, estado: hecho, t: "Instalar, actualizar y desinstalar un módulo en un tenant, con simulación previa y vuelta atrás"}
              - {id: CRM-00.04.04.03, c: C, fase: 2, svc: metadata, estado: hecho, t: "Espacio de nombres por módulo: sus objetos y su configuración no chocan con los del tenant ni con los de otro módulo"}
              - {id: CRM-00.04.04.04, c: C, fase: 2, svc: metadata, estado: hecho, t: "Actualización que respeta lo que el cliente ajustó: el módulo declara qué es suyo, qué es editable y qué pasa en cada conflicto"}
              - {id: CRM-00.04.04.05, c: A, fase: 2, svc: metadata, estado: hecho, t: "Dependencias y compatibilidad: un módulo declara qué versión del núcleo y qué otros módulos necesita, y se rechaza si no encajan"}
              - {id: CRM-00.04.04.06, c: C, fase: 2, svc: integration, estado: hecho, t: "Conectores de proveedor que vienen dentro del módulo, sobre el transporte genérico: credenciales, mapeo y estados por proveedor sin tocar el producto"}
              - {id: CRM-00.04.04.07, c: C, fase: 2, svc: front, estado: hecho, t: "Las pantallas del módulo salen de la superficie declarada: el front oficial las pinta sin desarrollo"}
              - {id: CRM-00.04.04.08, c: A, fase: 2, svc: metadata, estado: hecho, t: "Catálogo de módulos con versión, autor, firma y revisión antes de instalar"}
              - {id: CRM-00.04.04.09, c: A, fase: 2, svc: metadata, estado: hecho, t: "Desinstalar diciendo qué pasa con los datos: qué se borra, qué se conserva y qué queda huérfano"}
              - {id: CRM-00.04.04.10, c: A, fase: 2, svc: metadata, estado: hecho, t: "Telemetría por módulo: qué objetos y qué flujos se usan de verdad en cada tenant"}
              - {id: CRM-00.04.04.11, c: A, fase: 2, svc: metadata, estado: hecho, t: "Módulo de ejemplo completo y documentado, que sirva de plantilla para escribir los demás"}

          - id: CRM-00.04.05
            nombre: Seguimiento de servicio externo (trazabilidad con proveedor)
            # El caso que motiva los módulos verticales, generalizado: cualquier
            # cosa que se encarga a un tercero y hay que seguir —un envío, una
            # instalación, una reparación, un peritaje— con su estado, sus hitos,
            # sus incidencias y su prueba de entrega.
            #
            # Se declara GENÉRICO a propósito. Un modelo de «envío» con campos de
            # paquetería dejaría fuera al instalador y al perito; un modelo de
            # «encargo seguido» con estados declarados por el módulo sirve a los
            # tres, y el módulo vertical le pone el vocabulario de su sector.
            capacidades:
              - {id: CRM-00.04.05.01, c: C, fase: 2, svc: integration, estado: hecho, t: "Encargo seguido: objeto genérico con proveedor, referencia externa, hitos y estado, ligado al registro que lo originó", visto: "2026-10-27 Los encargos a proveedor tienen pantalla en Operacion, con tres vistas derivadas —entregados sin prueba, cumplimiento por proveedor y estados sin mapear— y dos acciones de coleccion: revisar silencios y conciliar lo facturado. Doce operaciones publicadas que solo tenian puerta por API"}
              - {id: CRM-00.04.05.02, c: C, fase: 2, svc: integration, estado: hecho, t: "Mapa de estados del proveedor a los del sistema, declarado por conector y no en el código"}
              - {id: CRM-00.04.05.03, c: C, fase: 2, svc: integration, estado: hecho, t: "Ingesta de eventos del proveedor por webhook y por sondeo, idempotente y con orden garantizado por encargo"}
              - {id: CRM-00.04.05.04, c: C, fase: 2, svc: integration, estado: hecho, t: "Incidencias del encargo con tipología, responsable (nuestro o del proveedor) y enlace al caso de soporte"}
              - {id: CRM-00.04.05.05, visto: '2026-09-29 albaran del proveedor enlazado al encargo contra contecmind levantado: se guarda la referencia, no los bytes (RT-5)', c: A, fase: 2, svc: integration, estado: hecho, t: "Prueba de entrega y documentos del proveedor archivados en el corpus documental (RT-5)"}
              - {id: CRM-00.04.05.06, c: C, fase: 2, svc: integration, estado: hecho, t: "El cliente ve la trazabilidad de sus encargos en el portal, sin ver lo que no es suyo ni el detalle interno"}
              - {id: CRM-00.04.05.07, c: A, fase: 2, svc: integration, estado: hecho, t: "Varios proveedores a la vez, elegibles por regla (destino, peso, urgencia, coste) con alternativa si uno falla"}
              - {id: CRM-00.04.05.08, c: A, fase: 2, svc: integration, estado: hecho, t: "Conciliación: lo que el proveedor factura contra lo que consta entregado, con las diferencias señaladas"}
              - {id: CRM-00.04.05.09, c: A, fase: 2, svc: integration, estado: hecho, t: "Cumplimiento por proveedor: plazos prometidos contra reales, incidencias por mil y coste medio"}
              - {id: CRM-00.04.05.10, c: A, fase: 2, svc: integration, estado: hecho, t: "Un encargo sin novedad del proveedor durante su plazo se marca como mudo y se avisa, en vez de darse por bueno"}

      - id: "0.5"
        nombre: Identidad, seguridad y control de acceso
        funciones:

          - id: CRM-00.05.01
            nombre: Autenticación
            capacidades:
              - {id: CRM-00.05.01.01, visto: '2026-09-29 el callback OIDC daba 500 por lo mismo; el tenant vive dentro del estado y se mira antes de abrir la sesion, sin gastar el vale', c: C, fase: 0, svc: identity, estado: hecho, reutiliza: "contecmind:app/core/oidc.py + app/api/auth.py; contecweb:app/services/sso.py", t: "OAuth 2.1 / OIDC como mecanismo primario, con PKCE"}
              - {id: CRM-00.05.01.02, visto: '2026-09-29 el ACS daba 500 a todo el mundo: usaba UowDep, que abre la sesion con el tenant del principal, y el IdP llega anonimo. Ahora abre su sesion como /auth/login', c: C, fase: 0, svc: identity, estado: hecho, reutiliza: "contecweb:app/services/saml.py + contecmind:app/services/saml.py", t: "SAML 2.0 para SSO empresarial"}
              - {id: CRM-00.05.01.03, visto: '2026-10-04 HABIA DOS resoluciones de «que proveedor le toca a este correo» y no contestaban lo mismo: la de /sso/iniciar miraba solo dominio_email y la del SSO forzado la lista entera con herencia de subdominios. Un usuario de un dominio anadido o de un subdominio NO PODIA ENTRAR POR NINGUNA PUERTA: el forzado le bloqueaba la contrasena y el inicio de SSO no encontraba su proveedor. Ahora delega en la buena; mutado devolviendo la floja, caen 3', c: A, fase: 0, svc: identity, estado: hecho, reutiliza: "contecmind:app/services/oidc_mappings.py", t: "SSO por tenant con múltiples proveedores de identidad simultáneos"}
              - {id: CRM-00.05.01.04, visto: '2026-10-26 Recorrida junto con el resto de la familia: el alta automatica por federacion cuelga del proveedor del tenant, que es quien declara con que permisos entra. Lo que se fija aqui es el resto del bloque; el detalle del alta JIT lo cubren las pruebas de SSO', c: A, fase: 0, svc: identity, estado: hecho, reutiliza: "contecmind:app/services/oidc.py (JIT provisioning)", t: "Federación y Just-In-Time provisioning de usuarios"}
              - {id: CRM-00.05.01.05, c: A, fase: 0, svc: identity, estado: hecho, reutiliza: "contecweb:app/services/scim.py (699 líneas) + contecflow-PSA:app/services/scim_service.py", t: "SCIM 2.0 para aprovisionamiento y desaprovisionamiento automático"}
              - {id: CRM-00.05.01.06, visto: '2026-10-26 El TOTP vale en SU ventana y no fuera: comprobado que uno de hace diez minutos ya no entra, y que el de otro secreto tampoco —lo que impide que un codigo visto en una pantalla sirva en otra cuenta—. El codigo de un solo uso por canal SE CONSUME, y pedir otro invalida el anterior: dos vivos a la vez doblan la superficie y confunden a quien recibe los dos. Y el canal viene APAGADO de fabrica, que es una decision: un segundo factor por correo sin configurar manda codigos a direcciones sin verificar', c: C, fase: 0, svc: identity, estado: hecho, reutiliza: "contecweb:app/services/mfa.py + contecmind:app/services/{mfa,webauthn}.py", t: "MFA obligatoria configurable por rol, con TOTP, push, WebAuthn/passkeys"}
              - {id: CRM-00.05.01.07, visto: '2026-10-26 La clave de maquina lleva ambito, caducidad, redes permitidas, revocacion y ultimo uso. Lo primero y lo segundo porque una clave sin ellos es una contrasena permanente con permisos de todo pegada en el fichero de un integrador; lo ultimo porque es lo unico que contesta «esta clave la usa alguien» el dia que hay que retirar las que sobran, y sin eso nadie se atreve a revocar ninguna. Se guarda la huella y un PREFIJO con el que reconocerla: sin el, revocar la correcta en una incidencia es adivinar', c: C, fase: 0, svc: identity, estado: hecho, reutiliza: "contecflow-PSA:app/models/oauth_apps.py", t: "Credenciales máquina: client credentials, service accounts, claves con scope y caducidad"}
              - {id: CRM-00.05.01.08, visto: '2026-10-26 Revocar surte efecto —revocar que no revoca es la peor clase de boton: quien lo pulsa se queda tranquilo y la sesion sigue viva— y una sesion caducada no cuenta como activa aunque nadie la revoque, que es lo que acota la exposicion si alguien copia el token', c: C, fase: 0, svc: identity, estado: hecho, reutiliza: "contecweb:app/services/sessions.py + contecflow-PSA:app/services/session_security.py", t: "Gestión de sesiones: duración, sesiones concurrentes, revocación remota"}
              - {id: CRM-00.05.01.09, c: A, fase: 0, svc: identity, estado: hecho, reutiliza: "contecweb:app/services/security_rules.py", t: "Políticas de acceso contextual: IP, dispositivo, geolocalización, horario"}
              - {id: CRM-00.05.01.10, c: A, fase: 3, svc: identity, estado: hecho, reutiliza: "contecweb:app/services/portal_session.py + contecflow-PSA:app/models/client_portal.py", t: "Identidad de clientes externos (portal) separada de la de empleados (CIAM)"}
              # ── SSO en profundidad ────────────────────────────────────
              - {id: CRM-00.05.01.11, visto: '2026-09-29 ROTA y arreglada: admitir_asercion_idp no la llamaba nadie mas que las pruebas, url_de_inicio tiraba el identificador de la peticion, process_response se llamaba sin request_id y el ajuste rejectUnsolicitedResponsesWithInResponseTo no existe en python3-saml 1.16.0. Una asercion firmada valia tantas veces como se mandara. Probado POSTeando dos veces a la ruta real', c: C, fase: 1, svc: identity, estado: hecho, reutiliza: "contecweb:app/services/saml.py", t: "SSO iniciado por el proveedor (IdP-initiated) con protección contra reenvío de aserciones"}
              - {id: CRM-00.05.01.12, c: C, fase: 1, svc: identity, estado: hecho, t: "Cierre de sesión único (Single Logout) propagado al IdP y a todos los servicios, por canal frontal y trasero"}
              - {id: CRM-00.05.01.13, visto: '2026-10-04 DE LAS TRES PUERTAS que abren sesion, solo la contrasena comprobaba el SSO forzado. La passkey entraba: es credencial LOCAL, sobrevive a la baja en el directorio, o sea justo la via de escape que forzar el SSO viene a cerrar. Y restablecer dejaba poner una contrasena que el login rechazaria siempre. Las tres lo comprueban ya, con prueba que las recorre. Mutado: quitando cada comprobacion cae. Y mi primera prueba casaba con la linea del import en vez de con la llamada, asi que daba verde sobre la mutacion', c: C, fase: 1, svc: identity, estado: hecho, t: "Forzar SSO por tenant: sin contraseña local ni vías de escape, con excepción nominal y auditada para el administrador de rescate"}
              - {id: CRM-00.05.01.14, visto: '2026-10-04 los dominios anadidos y la herencia de subdominios se leian solo al comprobar el SSO forzado, no al iniciarlo; verificado con cuatro correos que las dos resoluciones contestan ya lo mismo 2026-10-28 Y AHORA TIENE PANTALLA: en Identidad y seguridad se escribe un correo y dice si le toca SSO —con que proveedor— o contrasena del CRM, y avisa si su dominio tiene el SSO forzado. Es la primera pregunta cuando alguien no puede entrar, y la que el propio usuario no sabe contestar', c: A, fase: 1, svc: identity, estado: hecho, t: "Descubrimiento de dominio (home realm discovery) y alias de correo, para no preguntar al usuario por su proveedor"}
              - {id: CRM-00.05.01.15, c: C, fase: 1, svc: identity, estado: hecho, t: "Rotación y caducidad de los certificados de firma del IdP, con aviso antes de que expiren y convivencia de dos certificados", visto: "2026-10-27 Los certificados de firma del IdP se ven en la pantalla de seguridad, ordenados por URGENCIA y no por proveedor: primero los caducados, luego los que caducan pronto. Un certificado que caduca no avisa: un sabado por la noche deja de validar toda asercion y el lunes no entra nadie de la empresa"}
              - {id: CRM-00.05.01.16, visto: '2026-10-05 CERRADO. Lo del 04-10 (los perfiles no los alcanzaba ninguna ruta) se arreglo con GET /idp/perfiles y POST /idp/perfiles/{clave}/resolver, pero al medirlo el 05-10 el agujero de verdad era otro: el perfil declarado NO GOBERNABA NINGUNA ENTRADA. Tres vocabularios para lo mismo (el perfil decia campo_email, la config de SAML leia attr_email, y OIDC pedia claims[email] escrito en el codigo), asi que declarar que el correo viene en mail no cambiaba nada. Ahora hay uno solo (campos_declarados, que sigue leyendo el antiguo para no echar fuera a quien ya esta configurado), OIDC usa identidad_de() y SAML lo mismo. Y los cinco proveedores con nombre del enunciado se resuelven SIN pegar sus datos: POST /idp/perfiles/descubrir construye el perfil leyendo el /.well-known del propio emisor, y GET /idp/{id}/comprobar-perfil contrasta lo declarado con claims_supported. El campo que el proveedor no publique sale VACIO y se dice: elegir uno porque suele ser es adivinar. Un gate impide que vuelva a haber estructuras con nombre de casa', c: A, fase: 2, svc: identity, estado: hecho, t: "Conectores SSO por proveedor (Entra ID, Okta, Google Workspace, Keycloak, Ping) encima del genérico, nunca en su lugar"}
              # ── Segundo factor (2FA) y MFA en profundidad ─────────────
              - {id: CRM-00.05.01.17, c: C, fase: 1, svc: identity, estado: hecho, reutiliza: "contecmind:app/services/mfa.py", t: "Segundo factor por SMS y por correo (OTP), marcados como el factor más débil y desactivables por política", visto: "2026-10-27 Los canales debiles activos se ensenan en la pantalla de seguridad marcados como lo que son. Marcarlos es la capacidad: cuentan como segundo factor y no protegen como una passkey, y quien mira la adopcion tiene que poder distinguirlo"}
              - {id: CRM-00.05.01.18, c: C, fase: 1, svc: identity, estado: hecho, t: "Reautenticación reforzada (step-up) ante operación sensible: exportación masiva, cambio de permisos, borrado, suplantación"}
              - {id: CRM-00.05.01.19, c: C, fase: 1, svc: identity, estado: hecho, t: "Ciclo de vida del segundo factor: inscripción guiada, cambio de dispositivo y desbloqueo asistido con doble aprobación auditada"}
              - {id: CRM-00.05.01.20, c: A, fase: 1, svc: identity, estado: hecho, t: "Dispositivos de confianza con caducidad y revocación remota, para no pedir el factor en cada entrada del mismo equipo"}
              - {id: CRM-00.05.01.21, c: A, fase: 2, svc: identity, estado: hecho, reutiliza: "contecweb:app/services/security_rules.py", t: "MFA adaptativa por riesgo: exigir el segundo factor solo cuando el contexto cambia (IP, país, dispositivo, horario)"}
              - {id: CRM-00.05.01.22, c: A, fase: 2, svc: identity, estado: hecho, t: "Conectores MFA por proveedor (Duo, Okta Verify, Twilio Verify, RSA SecurID) encima del transporte genérico"}
              - {id: CRM-00.05.01.23, c: A, fase: 1, svc: identity, estado: hecho, reutiliza: "contecmind:app/services/webauthn.py", t: "Entrada sin contraseña (passwordless) con llave FIDO2/WebAuthn como factor único, y la misma llave como segundo factor"}
              - {id: CRM-00.05.01.24, c: A, fase: 1, svc: identity, estado: hecho, t: "Delegar el segundo factor al IdP del tenant cuando ya lo exige (amr/acr), para no pedirlo dos veces"}
              - {id: CRM-00.05.01.25, c: C, fase: 1, svc: identity, estado: hecho, t: "Panel de estado de MFA por tenant: quién la tiene, quién no y desde cuándo, con plazo de adopción y bloqueo al vencer", visto: "2026-10-27 Panel con pantalla propia en Administrar. Lo que ensena NO es el porcentaje: es la LISTA de quien no tiene segundo factor, con su correo y sus roles, porque el trabajo es hablar con ellos. El porcentaje va con el N al lado —un 78 por ciento sobre nueve personas no es lo mismo que sobre novecientas— y avisa de dos cosas mas: si el segundo factor no es obligatorio en el tenant, y si hay canales debiles activos (SMS, correo), que cuentan como factor y se interceptan sin tocar el dispositivo"}
              - {id: CRM-00.05.01.26, visto: '2026-10-26 El enlace vale UNA vez —uno que vale dos vale para siempre en el buzon de quien lo recibio—, caduca, y se guarda HASHEADO para que quien lea una copia de seguridad o un volcado de soporte no saque de ahi un enlace que abra cuentas. Y un correo que no existe contesta IGUAL que uno que si: distinguirlos convierte la pantalla en un comprobador de que correos tienen cuenta aqui, que es justo la lista que quiere quien va a intentar entrar. Mutado: quitando el consumo del enlace, cae la prueba', c: C, fase: 0, svc: identity, estado: hecho, t: "Recuperar el acceso: enlace de un solo uso, hasheado y con caducidad, que cierra todas las sesiones al usarse y no revela si el correo existe"}

          - id: CRM-00.05.02
            nombre: Autorización
            capacidades:
              - {id: CRM-00.05.02.01, visto: '2026-10-26 Comprobado que los permisos de dos roles se SUMAN y no se pisan: con lector y editor salen los tres permisos. Si se pisaran, quitarle un rol a alguien podria DARLE permisos', c: C, fase: 0, svc: identity, estado: hecho, reutiliza: "contecmind:app/services/acl.py + grc.py (matriz de permisos editable, roles custom)", t: "RBAC con roles, perfiles y conjuntos de permisos acumulables"}
              - {id: CRM-00.05.02.02, visto: '2026-10-26 Ascendente y no descendente, recorrido sobre la copia replicada del mando: el responsable ve lo de los suyos y los suyos no ven lo suyo. Simetrica no seria una jerarquia, seria un equipo plano', c: C, fase: 0, svc: identity, estado: hecho, t: "Jerarquía de roles con visibilidad ascendente sobre subordinados"}
              - {id: CRM-00.05.02.03, c: C, fase: 0, svc: identity, estado: hecho, reutiliza: "contecweb:app/services/abac.py (394) + abac_enforce.py", t: "Permisos por objeto (CRUD) y por campo (lectura/escritura/oculto)"}
              - {id: CRM-00.05.02.04, c: C, fase: 1, svc: identity, estado: hecho, reutiliza: "contecweb:app/services/share_links.py (477 líneas)", t: "Reglas de compartición: por propietario, por equipo, por criterio, manual, temporal"}
              - {id: CRM-00.05.02.05, c: A, fase: 0, svc: identity, estado: hecho, reutiliza: "contecweb:app/services/abac_policies.py (354) + contecflow-PSA:app/services/abac.py + abac_recursos.py", t: "ABAC: decisiones basadas en atributos de usuario, registro y contexto"}
              - {id: CRM-00.05.02.06, visto: '2026-10-26 GET /politicas-acceso/publicar devuelve la politica en formato neutro con la SEMANTICA dentro del documento —quien escriba el traductor a Rego o Cedar la necesita delante—. Lo decisivo es operador_desconocido: denegar, comprobado: un traductor que no lo supiera convertiria un operador que no entiende en un permitir', c: A, fase: 0, svc: identity, estado: hecho, t: "Motor de políticas externalizable (OPA/Cedar) evaluable también desde clientes headless"}
              - {id: CRM-00.05.02.17, visto: '2026-10-26 La politica sube de version al cambiarla y el historial se lee por HTTP: cuando alguien pierde acceso la pregunta es que cambio y cuando. Y la gramatica se valida ANTES de guardar: un operador inventado se evalua como denegar, asi que guardarlo convertiria una errata en un corte de acceso silencioso', c: C, fase: 1, svc: identity, estado: hecho, reutiliza: "contecweb:app/services/abac_policies.py (354, políticas persistidas y versionadas)", t: "Políticas ABAC persistidas, versionadas y editables desde administración, replicadas a todos los servicios"}
              - {id: CRM-00.05.02.18, visto: '2026-10-26 Punto unico de decision recorrido por HTTP, y comprobado que el ABAC se aplica TAMBIEN a quien administra: la comparticion no —quien administra tiene que ver el maestro entero— pero una politica de dato dejaria de servir para nada si el administrador fuera la excepcion, porque es justo a el a quien se le pone', c: C, fase: 1, svc: core, estado: hecho, reutiliza: "contecweb:app/services/abac_enforce.py (punto único de decisión)", t: "Punto único de decisión: toda lectura y escritura de un registro pasa por la evaluación de políticas, con gate que lo impone"}
              - {id: CRM-00.05.02.19, visto: '2026-10-26 LA propiedad del subsistema: el listado y la ficha dicen lo mismo por dos caminos distintos —la ficha evalua en Python sobre el registro, el listado traduce la misma condicion a SQL—. Recorrido con una politica puesta: la cuenta tapada desaparece de la lista Y la ficha contesta 403 con la politica que decide dentro. Mutado: haciendo que el listado deje de filtrar, caen las dos pruebas', c: C, fase: 1, svc: core, estado: hecho, t: "Filtrado de listados por política traducida a SQL, coherente con la decisión de la ficha"}
              - {id: CRM-00.05.02.20, c: A, fase: 1, svc: identity, estado: hecho, t: "Políticas por campo: una política puede ocultar o bloquear un campo concreto, no solo el registro"}
              - {id: CRM-00.05.02.21, visto: '2026-10-26 El simulador acepta una politica que TODAVIA NO existe y no la guarda: es la unica forma de saber que haria antes de activarla, porque una politica mal escrita no da un error, da un corte de acceso silencioso a gente que estaba trabajando y se descubre por los tickets. Comprobado que reparte el resultado entre rbac y abac', c: A, fase: 1, svc: identity, estado: hecho, reutiliza: "contecmind:app/api/admin_access_simulator.py", t: "Simulador de acceso: ver qué vería un usuario dado antes de activar una política"}
              - {id: CRM-00.05.02.07, c: A, fase: 2, svc: identity, estado: hecho, t: "Territorios y jerarquías de territorio que condicionan la visibilidad"}
              - {id: CRM-00.05.02.08, c: A, fase: 0, svc: identity, estado: hecho, reutiliza: "contecflow-PSA:app/services/organizations_service.py", t: "Restricción por unidad de negocio, marca, país o canal"}
              - {id: CRM-00.05.02.09, c: A, fase: 1, svc: identity, estado: hecho, t: "Registros ocultos vs. registros bloqueados (visibles sin detalle)"}
              - {id: CRM-00.05.02.10, visto: '2026-10-26 Suplantar exige motivo escrito de diez caracteres minimo: sin motivo, dentro de seis meses nadie sabra por que soporte entro en la cuenta de un cliente. Comprobado que «ok» da 422', c: A, fase: 0, svc: identity, estado: hecho, reutiliza: "contecweb:app/services/sesion_cedida.py (suplantación auditada)", t: "Acceso delegado temporal (suplantación) con consentimiento, caducidad y auditoría"}
              - {id: CRM-00.05.02.12, visto: '2026-10-26 La jerarquia se lee de la COPIA replicada y no de la membresia —que vive en identity y ningun servicio lee el esquema de otro—. Comprobado ademas el caso del nulo: quien asciende o se va deja de contarse como subordinado ese mismo dia; ignorarlo dejaria a su antiguo jefe viendo su cartera para siempre, y eso no falla nunca', c: C, fase: 2, svc: identity, estado: hecho, t: "Replicar la jerarquía de mando a cada servicio para que la compartición por jerarquía aplique en los listados"}
              - {id: CRM-00.05.02.11, visto: '2026-10-26 El explicador reparte el no entre las dos mitades: dice que permiso falta (rbac.permiso) y la explicacion del ABAC aparte, porque «no tienes permiso» y «una politica te lo tapa» se arreglan de forma distinta. Es el ticket mas frecuente de cualquier CRM y el mas caro de cerrar', c: D, fase: 0, svc: identity, estado: hecho, reutiliza: "contecmind:app/services/access_explainer.py + access_simulator.py", t: "Explicador de permisos: por qué este usuario ve este registro"}

          - id: CRM-00.05.03
            nombre: Protección del dato
            capacidades:
              - {id: CRM-00.05.03.01, c: C, fase: 0, svc: infra, estado: hecho, reutiliza: "contecmind:deploy/nginx + docs/PENTEST_HARDENING.md", t: "Cifrado en tránsito (TLS 1.3) y en reposo"}
              - {id: CRM-00.05.03.02, c: A, fase: 0, svc: core, estado: hecho, reutiliza: "contecmind:app/db/encrypted_text.py + app/core/crypto.py", t: "Cifrado a nivel de campo para datos sensibles, con búsqueda determinista opcional"}
              - {id: CRM-00.05.03.03, c: A, fase: 0, svc: core, estado: hecho, reutiliza: "contecmind:app/services/pii.py + sensitive_policy.py", t: "Enmascaramiento y ofuscación por rol en respuestas de API y en exportaciones"}
              - {id: CRM-00.05.03.04, c: A, fase: 2, svc: core, estado: hecho, t: "Tokenización de datos de pago o identificadores fiscales"}
              - {id: CRM-00.05.03.05, c: A, fase: 0, svc: core, estado: hecho, reutiliza: "contecmind:app/services/pii.py", t: "Anonimización y pseudonimización para entornos no productivos"}
              - {id: CRM-00.05.03.06, c: A, fase: 0, svc: core, estado: hecho, reutiliza: "contecweb:app/services/security_signals.py", t: "DLP: control de exportaciones masivas, alertas y bloqueo por política"}
              - {id: CRM-00.05.03.07, c: D, fase: 1, svc: core, estado: hecho, reutiliza: "contecflow-PSA:app/services/_pdf_marca.py (marca de agua)", t: "Marca de agua e identificación de origen en exportaciones"}
              - {id: CRM-00.05.03.08, c: A, fase: 0, svc: core, estado: hecho, reutiliza: "contecweb:app/services/security_signals.py + contecflow-PSA:app/services/security_observability.py", t: "Detección de comportamiento anómalo (descargas masivas, accesos fuera de patrón)"}

          - id: CRM-00.05.04
            nombre: Auditoría y trazabilidad
            capacidades:
              - {id: CRM-00.05.04.01, c: C, fase: 0, svc: core, estado: hecho, reutiliza: "contecmind:app/services/audit.py (668, hash-chain) + deploy/sql/audit_immutable.sql; contecweb:app/services/audit_chain.py", t: "Audit trail inmutable de accesos, cambios, exportaciones y acciones administrativas"}
