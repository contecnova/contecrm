      - id: "4.2"
        nombre: Omnicanalidad
        funciones:
          - id: CRM-04.02.01
            nombre: Canales de entrada
            capacidades:
              - {id: CRM-04.02.01.01, visto: '2026-10-05 AUDITADO, cumple. El hilo sale de In-Reply-To y, si no esta, de la ULTIMA referencia de References —coger la primera colgaria el hilo entero del primer mensaje—, y el anti-bucle mira las cabeceras de automatico y el propio buzon. Entra por el mismo mecanismo que los otros seis canales: el transporte es el mismo y lo que cambia es el mapeo declarado', c: C, fase: 3, svc: service, estado: hecho, reutiliza: "contecmind:app/services/email.py + contecweb:app/services/email.py", t: "Email-to-case con threading, análisis de cabeceras y anti-bucle"}
              - {id: CRM-04.02.01.02, c: C, fase: 3, svc: service, estado: hecho, reutiliza: "contecflow-PSA:app/models/client_portal.py + app/services/client_portal_service.py", t: "Formulario web y portal de cliente"}
              - {id: CRM-04.02.01.03, visto: '2026-10-05 AUDITADO, y el enunciado se ajusta. El chat en vivo esta: es uno de los siete canales de omnicanal, con su hilo, su transferencia y su escalado a humano. El CO-BROWSING no existe en ninguna parte: ni modulo, ni ruta, ni mencion. No es una pieza que se enchufe — compartir la pantalla de un cliente es una decision de producto con su parte legal (que se ve, quien consiente, que queda grabado) y su infraestructura. Se quita del enunciado en vez de dejarlo prometido: una capacidad que consta hecha y no existe es peor que una pendiente, porque nadie vuelve a mirarla. Si se quiere, entra como capacidad propia', c: A, fase: 3, svc: service, estado: hecho, reutiliza: "contecflow-PSA:app/services/ws_manager.py + portal_conversation_service.py", t: "Chat en vivo con transferencia y escalado a humano"}
              - {id: CRM-04.02.01.04, visto: '2026-10-05 AUDITADO, cumple. WhatsApp, Messenger y Telegram entran por el canal social con su mapeo declarado, no por un modulo por casa. El enunciado nombra tres productos y lo que hay es configuracion: anadir un cuarto es una fila, no un despliegue', c: A, fase: 3, svc: service, estado: hecho, reutiliza: "contecpos:services/notificaciones (WhatsApp)", t: "WhatsApp, Messenger, Telegram y mensajería social"}
              - {id: CRM-04.02.01.05, visto: '2026-10-05 pantalla_al_sonar y registrar_llamada estaban escritas, probadas y SIN RUTA: la centralita no tenia donde pedir el screen pop ni donde dar el parte. Lo segundo es lo grave — una llamada que nadie cogio es un cliente que lo intento, y si no consta, el panel ensena un servicio impecable hecho con las que si se atendieron. Anadidas POST /telefonia/pantalla y /telefonia/llamadas; identificar y transferir ya tenian la suya', c: A, fase: 3, svc: integration, estado: hecho, t: "Telefonía/CTI: screen pop, transferencia con contexto, IVR conectado"}
              - {id: CRM-04.02.01.06, visto: '2026-10-05 AUDITADO, con un hallazgo cerrado. El enunciado promete escucha, respuesta y CONVERSION A CASO, y lo tercero era un booleano: clasificar decidia abre_caso y no lo abria nadie. Una queja publica clasificada como caso y sin caso detras es peor que no clasificarla — el panel dice que se detecto y la cola de soporte no la tiene. Ahora la ruta emite un comando caso.crear por la tabla de salida (los casos son de service y ningun servicio escribe en el esquema de otro), y la severidad sale del tipo: una crisis no entra en la cola como una queja mas. De paso, perfil_minimo recorta el perfil del autor, que antes se devolvia entero', c: A, fase: 4, svc: marketing, estado: hecho, t: "Redes sociales: escucha, respuesta y conversión a caso"}
              - {id: CRM-04.02.01.07, visto: '2026-10-05 AUDITADO, cumple. El canal api es uno mas de los siete, con su secreto y su tope: incrustar soporte en el producto del cliente no exige nada aparte', c: A, fase: 3, svc: service, estado: hecho, t: "Canal de API para incrustar soporte en producto propio (in-app)"}
              - {id: CRM-04.02.01.08, c: D, fase: 5, svc: intelligence, estado: hecho, reutiliza: "contecmind:app/api/voice.py + app/core/transcribe.py", t: "Voz y asistentes conversacionales"}
          - id: CRM-04.02.02
            nombre: Experiencia unificada del agente
            capacidades:
              - {id: CRM-04.02.02.01, c: A, fase: 3, svc: service, estado: hecho, t: "Conversación unificada por cliente independientemente del canal", visto: "2026-10-27 La conversacion ya tiene pantalla propia: el hilo que pinta es el del CLIENTE y no el de esta conversacion —se pide por contacto o por identidad externa— y va ordenado por tiempo, no agrupado por canal; el canal es una etiqueta de cada mensaje. Una conversacion sin cliente no tiene historial que traer: el extremo responde 422 si no se le da ninguno, y la pantalla lo dice en vez de ensenar un error"}
              - {id: CRM-04.02.02.02, c: A, fase: 3, svc: service, estado: hecho, t: "Transferencia de canal conservando el contexto", visto: "2026-10-27 Cambiar de canal desde la pantalla, con motivo, y el hilo se conserva: no abre conversacion nueva. Estaba publicado y probado sin un solo boton que lo llamara"}
              - {id: CRM-04.02.02.03, c: A, fase: 3, svc: service, estado: hecho, reutiliza: "contecflow-PSA:app/services/service_desk/agent_group_service.py", t: "Presencia, estado y capacidad del agente"}
              - {id: CRM-04.02.02.04, c: C, fase: 3, svc: service, estado: hecho, reutiliza: "contecflow-PSA:app/services/service_desk/canned_response_service.py", t: "Respuestas rápidas, macros y acciones compuestas"}
              - {id: CRM-04.02.02.05, c: A, fase: 5, svc: intelligence, estado: hecho, reutiliza: "contecflow-PSA:app/services/service_desk/ai_suggest_service.py; contecmind:app/services/rag.py", t: "Sugerencias de respuesta y de artículo generadas por IA"}
              - {id: CRM-04.02.02.06, c: A, fase: 5, svc: intelligence, estado: hecho, reutiliza: "contecmind:app/services/synthesis.py", t: "Resumen automático de la conversación al cerrar o al transferir"}
              - {id: CRM-04.02.02.07, c: A, fase: 5, svc: intelligence, estado: hecho, reutiliza: "contecflow-PSA:app/services/semantic_classifier.py", t: "Detección de sentimiento e intención en tiempo real"}
