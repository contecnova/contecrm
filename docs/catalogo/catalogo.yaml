            nombre: Continuidad y resiliencia
            capacidades:
              - {id: CRM-00.06.02.01, c: C, fase: 0, svc: ops, estado: hecho, reutiliza: "contecmind:scripts/backup.sh + restore.sh + deploy/systemd/*backup*", t: "Backups automáticos con RPO y RTO comprometidos por tier", sin_pantalla_porque: "Los backups automaticos y sus compromisos por tier los ejecuta y vigila quien opera la plataforma; el tenant no los lanza ni los elige"}
              - {id: CRM-00.06.02.02, c: A, fase: 0, svc: ops, estado: hecho, t: "Point-in-time recovery a nivel de tenant, no solo de clúster"}
              - {id: CRM-00.06.02.03, c: A, fase: 0, svc: ops, estado: hecho, reutiliza: "contecmind:app/api/admin_backup.py (restauración selectiva)", t: "Restauración selectiva de registros o de objetos concretos"}
