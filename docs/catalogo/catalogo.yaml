              - {id: CRM-00.06.02.05, c: A, fase: 0, svc: infra, estado: hecho, t: "Alta disponibilidad multi-AZ y plan de recuperación multi-región", sin_pantalla_porque: "La alta disponibilidad multi-AZ y el plan multi-region son del despliegue: no hay nada que un usuario del CRM vea ni decida"}
              - {id: CRM-00.06.02.06, c: A, fase: 0, svc: ops, estado: hecho, reutiliza: "contecmind:scripts/test_restore_integrity.sh", t: "Pruebas de DR periódicas documentadas", sin_pantalla_porque: "Las pruebas de recuperacion ante desastre son un procedimiento con su acta; su entregable es el documento, no una pantalla"}
              - {id: CRM-00.06.02.07, c: A, fase: 0, svc: core, estado: hecho, reutiliza: "contecmind:app/core/degradation.py (270 líneas)", t: "Modo degradado: lectura disponible aunque la escritura esté afectada"}
              - {id: CRM-00.06.02.08, c: A, fase: 0, svc: infra, estado: hecho, t: "Despliegues sin downtime: blue/green, canary, rollback automático", sin_pantalla_porque: "El despliegue sin corte —blue/green, canary, vuelta atras— ocurre fuera del producto; lo que el usuario nota es que no se entera"}

