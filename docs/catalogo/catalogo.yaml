            nombre: Puesto de trabajo
            capacidades:
              - {id: CRM-06.01.01.01, c: C, fase: 2, svc: integration, estado: hecho, reutiliza: "contecmind:app/services/microsoft_drive.py + drive.py; contecflow-PSA:app/services/m365_service.py", t: "Sincronización bidireccional de correo y calendario (Microsoft 365, Google)"}
              - {id: CRM-06.01.01.02, c: A, fase: 2, svc: integration, estado: hecho, reutiliza: "contecmind:extension/ (complemento de navegador)", t: "Complemento en Outlook/Gmail para registrar y consultar sin salir del cliente de correo"}
              - {id: CRM-06.01.01.03, c: A, fase: 2, svc: integration, estado: hecho, reutiliza: "contecmind:app/services/teams_bot/ + teams_*.py (10 módulos); contecflow-PSA:app/services/slack_service.py", t: "Integración con Teams/Slack: notificaciones, consulta y acciones desde el chat"}
              - {id: CRM-06.01.01.04, c: A, fase: 2, svc: integration, estado: hecho, t: "Registro automático de reuniones y de asistentes"}
              - {id: CRM-06.01.01.05, c: C, fase: 1, svc: core, estado: hecho, reutiliza: "contecmind:app/core/storage.py + app/services/documents.py; contecflow-PSA:app/services/s3_service.py", t: "Gestión documental: adjuntos, versiones, carpetas y enlace a SharePoint/Drive"}
              - {id: CRM-06.01.01.06, c: A, fase: 2, svc: core, estado: hecho, reutiliza: "contecmind:app/services/generated_documents.py + templates.py", t: "Generación documental desde plantillas (propuesta, contrato, acta)"}
          - id: CRM-06.01.03
            nombre: Suites de productividad
            capacidades:
              - {id: CRM-06.01.03.01, c: C, fase: 2, svc: integration, estado: hecho, reutiliza: "contecweb:app/connectors/api/generic_rest.py + oauth2.py", t: "Perfil de suite de productividad declarativo: endpoints, campos, incremento y límites como configuración, sin un módulo por proveedor"}
              - {id: CRM-06.01.03.02, c: C, fase: 2, svc: integration, estado: hecho, t: "Consentimiento por usuario y alcance mínimo: cada buzón se conecta con el permiso de su dueño y él lo revoca cuando quiera"}
              - {id: CRM-06.01.03.03, c: A, fase: 2, svc: integration, estado: hecho, t: "Credencial de la suite en la bóveda del tenant, con renovación del token sin intervención y aviso antes de caducar"}
              - {id: CRM-06.01.03.04, c: C, fase: 2, svc: integration, estado: hecho, t: "Sincronización incremental por token de cambios del proveedor, reanudable, con marca de agua que solo avanza sobre lo confirmado"}
              - {id: CRM-06.01.03.05, c: A, fase: 2, svc: integration, estado: hecho, t: "Suscripción a cambios del proveedor con renovación automática y vuelta al sondeo cuando caduca o no está disponible"}
              - {id: CRM-06.01.03.06, c: C, fase: 2, svc: integration, estado: hecho, t: "Contactos en los dos sentidos, con regla de origen por campo y sin volcar la agenda personal del usuario en el CRM"}
              - {id: CRM-06.01.03.07, c: C, fase: 2, svc: integration, estado: hecho, t: "Tareas y acciones en los dos sentidos: cerrarla en el gestor del usuario la cierra en el CRM, y al revés"}
              - {id: CRM-06.01.03.08, c: A, fase: 2, svc: integration, estado: hecho, t: "Notas vinculadas a cuadernos externos por referencia, sin copiar el contenido al CRM"}
              - {id: CRM-06.01.03.09, c: A, fase: 2, svc: integration, estado: hecho, t: "Adjuntos por enlace al almacenamiento del cliente, con los permisos resueltos en el origen y no copiados"}
              - {id: CRM-06.01.03.10, c: C, fase: 2, svc: integration, estado: hecho, t: "Reunión en línea creada desde el CRM con el proveedor que tenga el tenant, y su enlace en la actividad"}
              - {id: CRM-06.01.03.11, c: C, fase: 2, svc: integration, estado: hecho, t: "Disponibilidad real (libre/ocupado) leída del calendario del usuario antes de proponer horas"}
              - {id: CRM-06.01.03.12, c: A, fase: 2, svc: integration, estado: hecho, t: "Conversación de chat vinculada a la ficha por referencia, con lo que el canal permita exportar y no más"}
              - {id: CRM-06.01.03.13, c: C, fase: 2, svc: integration, estado: hecho, t: "Importación y exportación en formatos estándar (MIME/EML, vCard, iCalendar, CSV) sin pasar por ninguna suite"}
              - {id: CRM-06.01.03.14, c: C, fase: 2, svc: integration, estado: hecho, t: "Reglas de qué entra y qué no, por tenant y por usuario, con lo marcado como privado excluido siempre"}
              - {id: CRM-06.01.03.15, c: A, fase: 2, svc: integration, estado: hecho, t: "Límites del proveedor respetados: reintento con la ventana que él indique y aviso cuando corta, en vez de reintentar a ciegas"}
              - {id: CRM-06.01.03.16, c: C, fase: 2, svc: integration, estado: hecho, t: "Panel de salud de las conexiones: qué lleva sin sincronizar, desde cuándo y por qué, por buzón"}
              - {id: CRM-06.01.03.17, c: C, fase: 2, svc: integration, estado: hecho, t: "Desconexión y baja: qué se queda en el CRM y qué desaparece cuando el usuario revoca o deja la empresa", visto: "2026-10-28 Lo mismo: servido y sin pantalla. Ahora se elige el motivo —revoco, se va, fin de contrato— y se ensenan LAS DOS MITADES a la vez, cada una con su porque. Ensenar solo lo que desaparece asusta y entonces nadie desconecta; ensenar solo lo que se queda engana"}
              - {id: CRM-06.01.03.18, c: A, fase: 2, svc: integration, estado: hecho, t: "Registro de tratamiento del dato que entra de la suite, con base legal, finalidad y plazo de conservación"}
              - {id: CRM-06.01.03.19, c: A, fase: 2, svc: integration, estado: hecho, t: "Correspondencia entre la cuenta de la suite y el usuario del CRM, con alias y buzones compartidos"}
              - {id: CRM-06.01.03.20, c: C, fase: 2, svc: integration, estado: hecho, t: "Prueba de conexión y diagnóstico: qué permiso concreto falta, en vez de «error de autenticación»", visto: "2026-10-28 Tenia servidor y no tenia donde preguntarse. Ahora es un recuadro en la pantalla de Suite: se pega el codigo del proveedor, su mensaje tal cual y los alcances concedidos y necesarios, y contesta que pasa y que hacer, con el alcance que falta por su nombre. Los alcances se escriben separados por comas, como los lista la pantalla de consentimiento del proveedor, y no en JSON: pedirlos de otra forma es pedirle al consultor que haga de traductor"}

          - id: CRM-06.01.02
            nombre: Firma electrónica
            capacidades:
              - {id: CRM-06.01.02.01, visto: '2026-10-05 AUDITADO, cumple. Varios firmantes con orden declarado (a_quien_le_toca respeta el turno), plazo con caducidad, y el sobre se crea desde cualquier registro por objeto y objeto_id', c: C, fase: 2, svc: core, estado: hecho, reutiliza: "contecflow-PSA:app/services/esign_service.py + esign_providers.py", t: "Envío a firma desde cualquier registro, con varios firmantes, orden y plazo"}
              - {id: CRM-06.01.02.02, visto: '2026-10-26 Un proveedor se declara como CONFIGURACION —clave, conexion declarativa, niveles que sabe hacer, mapa de estados— y hay varios a la vez; no hay lista de productos en el codigo. Comprobado que una regla puede SUBIR el nivel exigido y nunca bajarlo —dejar que lo rebaje convierte la politica en una sugerencia— y que la eleccion dice QUE regla decidio, porque una eleccion que no se puede explicar no se puede corregir y aqui decide con que validez legal sale un contrato', visto: '2026-10-05 AUDITADO, con un hallazgo cerrado. El transporte es declarativo y no hay lista de proveedores en el codigo —se resuelve con el MISMO conector que lee un ERP—, pero registrar_operador estaba escrita, probada y sin llamante: se podia declarar un proveedor con su conexion y cualquier envio contestaba «este despliegue no tiene conectado el operador de firma». O sea, la firma estaba completa salvo por el paso de salir. El operador se registra ahora al arrancar el servicio', c: C, fase: 2, svc: core, estado: hecho, t: "Proveedor de firma configurable y varios a la vez: transporte declarativo, sin un conector por producto ni lista de proveedores en el código"}
              - {id: CRM-06.01.02.03, visto: '2026-10-05 AUDITADO, con un hallazgo cerrado. Estado por firmante, recordatorios con minimo entre dos (un boton pulsado tres veces no manda tres) y cancelacion con motivo. Lo que faltaba: caducar_vencidos tenia ruta y solo corria si alguien pulsaba, que es como no correr — un sobre vencido no da ningun error, se queda en el panel como negocio vivo esperando una firma que no va a llegar. Ahora corre por tenant en el relevo', c: C, fase: 2, svc: core, estado: hecho, t: "Estado de cada firmante en la propia ficha, con recordatorios y cancelación"}
              - {id: CRM-06.01.02.04, c: C, fase: 2, svc: core, estado: hecho, reutiliza: "contecflow-PSA:app/services/signature_pdf.py", t: "Evidencia legal: hash del documento firmado, sello de tiempo, certificado de finalización y trazabilidad de cada acceso"}
              - {id: CRM-06.01.02.05, visto: '2026-10-05 AUDITADO, cumple. NIVELES es una escala ordenada y se usa como tal: elegir_proveedor rechaza al que no alcanza el nivel pedido comparando indices, no cadenas, y una plantilla no puede exigir mas nivel del que el sobre declara', c: A, fase: 2, svc: core, estado: hecho, t: "Niveles eIDAS: simple, avanzada y cualificada, elegibles por tipo de documento"}
              - {id: CRM-06.01.02.06, visto: '2026-10-26 La plantilla admite ANCLAJE DE TEXTO ademas de coordenadas, y se relee entero de la fila: las coordenadas se rompen en cuanto el contrato gana un parrafo —y eso pasa siempre—, dejando la casilla de firma a mitad de una clausula', c: A, fase: 2, svc: core, estado: hecho, t: "Plantillas de firma: posiciones, campos a rellenar por el firmante y anclajes en el documento"}
              - {id: CRM-06.01.02.07, visto: '2026-09-29 el firmado y el certificado vuelven con papel propio y sin pisar el original, contra contecmind levantado; un sobre sin completar no archiva', c: A, fase: 2, svc: core, estado: hecho, t: "El documento firmado vuelve al corpus documental y al registro que lo originó, con su versión (RT-5)"}
              - {id: CRM-06.01.02.08, visto: '2026-10-05 AUDITADO, cumple. comprobar_identificacion cruza nivel con identificacion y rechaza la combinacion que no se sostiene; las cinco formas (correo, sms, video, certificado, dni electronico) estan declaradas y son configuracion del firmante, no codigo', c: A, fase: 2, svc: core, estado: hecho, t: "Identificación del firmante: SMS, correo, vídeo o certificado, según el nivel exigido"}
              - {id: CRM-06.01.02.09, c: D, fase: 3, svc: core, estado: hecho, t: "Firma presencial en tableta y firma biométrica con captura de trazo"}
              - {id: CRM-06.01.02.10, c: A, fase: 2, svc: core, estado: hecho, t: "Panel de lo pendiente de firma, con antigüedad y bloqueos del ciclo de venta"}
              - {id: CRM-06.01.02.11, visto: '2026-10-26 HALLAZGO GORDO: `enviar` NO llamaba al proveedor. Marcaba el sobre como enviado y emitia el evento, y el puerto del proveedor solo lo usaba la prueba de conexion — asi que al proveedor no le llegaba nada, el cliente no recibia ningun correo y el CRM decia que estaba mandado. No fallaba: el sobre quedaba en «enviado» esperando a un firmante que nunca supo que tenia algo que firmar. Construido el envio de verdad: llama al puerto con firmantes, documento y nivel, guarda el identificador que devuelve el proveedor —sin el no hay a que referirse para consultar, descargar o cancelar—, anota la llamada y, si el proveedor no lo acepta, el sobre SE QUEDA EN BORRADOR. Mutado: quitando la llamada caen tres pruebas', c: C, fase: 2, svc: integration, estado: hecho, reutiliza: "contecflow-PSA:app/services/esign_providers.py", t: "Conectores nativos de firma, uno por proveedor, para lo que el transporte genérico no alcanza: posicionado por API, descarga del certificado y devolución de estado por webhook"}
              - {id: CRM-06.01.02.12, c: C, fase: 2, svc: integration, estado: hecho, t: "Varios proveedores a la vez en el mismo tenant, elegibles por tipo de documento, por país o por importe"}
              - {id: CRM-06.01.02.13, visto: '2026-10-26 Al migrar, los sobres en vuelo terminan con el proveedor viejo —su enlace en el correo del cliente apunta ahi— y el viejo queda en «solo en curso». Devuelve cuantos quedan, cual es el mas antiguo y CONTESTA si se puede apagar ya la credencial vieja, que es la pregunta que nadie sabe contestar cuando llega el momento. Y migrar hacia uno apagado se rechaza: dejaria los sobres nuevos sin por donde salir', c: A, fase: 2, svc: integration, estado: hecho, t: "Cambiar de proveedor sin perder lo enviado: los sobres en curso terminan con el suyo y los nuevos salen con el otro"}
              - {id: CRM-06.01.02.14, visto: '2026-10-26 La prueba en vacio ESCRIBE y no solo consulta: comprobado que crea el sobre de prueba y lo cancela. Hay proveedores donde leer funciona con una credencial que no puede escribir, y entonces la prueba pasa y el primer envio real falla con un contrato delante. De paso, la cancelacion leia solo la clave «id»: con un conector que devuelva «id_externo» el sobre de prueba se quedaba sin cancelar cada vez', c: A, fase: 2, svc: integration, estado: hecho, t: "Prueba de conexión y de envío en vacío por proveedor, para validar credenciales antes de mandar un contrato de verdad"}
              - {id: CRM-06.01.02.15, visto: '2026-10-26 El registro guarda tambien las llamadas que FALLAN —uno que solo apunta lo que salio bien sirve para la factura y no para depurar, que es para lo que se mira a las dos de la manana— con su codigo, su duracion y su coste para conciliar. Y comprobado que NO guarda cuerpos: un contrato repetido en una tabla de registro es una copia del documento fuera del corpus, saltandose su retencion, su cifrado y sus permisos 2026-10-28 AGUJERO CERRADO: la tabla se escribia y NO LA LEIA NADIE —ninguna ruta la devolvia—, asi que el registro «para conciliar la factura» no conciliaba nada. Ahora `GET /firma/llamadas` con el gasto sumado y las fallidas aparte con el suyo, y panel en «pendiente de firma». Sin filas NO se dice cero gasto: se dice que no consta ninguna llamada, porque un cero se leeria como que el proveedor no ha cobrado', c: A, fase: 2, svc: integration, estado: hecho, t: "Registro de llamadas al proveedor con petición, respuesta y coste, para conciliar la factura y depurar un sobre atascado"}
      - id: "6.2"
        nombre: Colaboración y movilidad
        funciones:
          - id: CRM-06.02.01
            nombre: Colaboración
            capacidades:
              - {id: CRM-06.02.01.01, c: A, fase: 1, svc: core, estado: hecho, reutiliza: "contecmind:app/services/annotations.py + collaborative_corrections.py; contecflow-PSA:app/services/collaboration/", t: "Menciones, comentarios y hilos sobre registros"}
              - {id: CRM-06.02.01.02, c: C, fase: 1, svc: core, estado: hecho, reutiliza: "contecmind:app/services/notifications.py + app/models/notification.py", t: "Seguimiento de registros y notificaciones configurables por evento", visto: "2026-10-27 La bandeja de avisos ya tiene puerta: campana en la barra con el numero sin leer. Estaba todo construido menos eso —el servidor guarda, agrupa, respeta el horario de silencio y entrega por los canales que cada uno elige— y un aviso que solo existe en la base de datos no ha avisado a nadie. Tres decisiones: el numero NO se consulta en bucle (un sondeo multiplica peticiones por pestanas y por personas para enterarse un minuto antes de algo que no corre prisa), cada aviso lleva a su registro y el que no tiene registro NO finge ser un enlace, y marcar como leido es explicito —marcar al abrir haria desaparecer lo que no ha dado tiempo a leer—"}
              - {id: CRM-06.02.01.03, c: C, fase: 3, svc: core, estado: hecho, reutiliza: "contecmind:app/services/push.py (web push)", t: "Aplicaciones móviles iOS y Android con notificaciones push"}
              - {id: CRM-06.02.01.04, visto: '2026-10-05 AUDITADO, con un hallazgo cerrado. crmcore.movil resolvia lo dificil —que es un conflicto de verdad, que se guarda cuando lo hay, que se queda en la cola— y NO LO ALCANZABA NINGUNA RUTA; el propio modulo decia «lo que aqui se resuelve es la parte del servidor» y la parte del servidor no estaba servida. Ahora hay POST /<servicio>/movil/sincronizar en los catorce, que devuelve el PLAN y no escribe: quien escribe es la ruta de siempre de cada objeto, con sus permisos. Dos cosas mas salieron al enchufarlo: la version CERO se trataba como «sin version base», asi que toda actualizacion sobre un registro recien creado se rechazaba; y la deteccion necesitaba los campos BASE que leyo el movil para distinguir «el otro cambio esto» de «yo escribo encima de algo que nadie toco» — sin eso, todo cambio sobre un registro movido salia como conflicto', c: A, fase: 3, svc: core, estado: hecho, t: "Modo offline con cola de cambios y resolución de conflictos"}
              - {id: CRM-06.02.01.05, c: A, fase: 1, svc: docs, estado: hecho, reutiliza: "contecflow-PSA:docs/A11Y_WCAG_AUDIT.md", t: "Accesibilidad WCAG 2.2 AA en las interfaces suministradas"}
              - {id: CRM-06.02.01.07, c: A, fase: 2, svc: core, estado: hecho, t: "Plantilla de notificación por canal: replicar las plantillas al esquema de cada servicio"}
              - {id: CRM-06.02.01.08, visto: '2026-10-05 AUDITADO, cumple tras el hallazgo de CRM-02.03.02.03. Las estadisticas de entrega tienen ruta y dicen lo que NO se puede medir: si el tenant manda por SMTP, la apertura y el rebote no existen —no son cero, es que nadie los cuenta—, y un panel con 0 % de apertura hace concluir que los correos no interesan cuando lo que pasa es que el transporte no lo mide', c: D, fase: 4, svc: core, estado: hecho, t: "Estadísticas de entrega del correo (apertura y rebote) con transporte por API del proveedor"}
              - {id: CRM-06.02.01.06, c: A, fase: 1, svc: identity, estado: hecho, reutiliza: "contecweb:app/services/share_links.py (acceso acotado y temporal)", t: "Usuarios invitados externos con acceso acotado y temporal"}
          - id: CRM-06.02.02
            nombre: Chat interno
            capacidades:
              - {id: CRM-06.02.02.01, visto: '2026-10-26 Recorrido por HTTP: canal, grupo y directo, y el DIRECTO no se crea dos veces —quien escribe a alguien con quien ya hablo sigue la misma conversacion, no abre una vacia al lado de la que tiene el historico—. Un tipo inventado da 422. Y un canal privado NO sale en la lista de quien no esta dentro: el nombre de un canal ya es informacion', c: A, fase: 1, svc: identity, estado: hecho, reutiliza: "contecflow-PSA:app/models/collaboration.py + app/services/collaboration/", t: "Conversaciones de equipo: canales, grupos y mensajes directos, con miembros y permisos"}
              - {id: CRM-06.02.02.02, visto: '2026-10-26 La conversacion de un registro se abre desde su ficha y pedirla dos veces devuelve la misma; quien la abre entra en ella, que si no la abriria y no podria leerla', c: A, fase: 1, svc: identity, estado: hecho, t: "Una conversación puede colgar de un registro: hablar de ESTA oportunidad, con su contexto al lado y sin pegar enlaces"}
              - {id: CRM-06.02.02.03, visto: '2026-10-26 Hilos de verdad y no citas: la respuesta cuelga de su mensaje. La reaccion es un interruptor —pulsar dos veces el mismo emoji lo quita— y la lista de emojis es cerrada. La edicion guarda lo anterior y un TERCERO NO EDITA: que un administrador reescriba lo que dijo otro convierte el historico en algo que no se puede citar, y la unica razon de tenerlo es poder citarlo', c: A, fase: 1, svc: identity, estado: hecho, reutiliza: "contecflow-PSA:app/models/collaboration.py (threads, reactions)", t: "Hilos, reacciones y edición con historial: lo que se corrige se ve corregido, no reescrito"}
              - {id: CRM-06.02.02.04, visto: '2026-10-26 A quien se menciona llega y se guarda con el mensaje; sin eso no hay a quien avisar. El aviso en si va por el camino comun de notificaciones', c: A, fase: 1, svc: identity, estado: hecho, t: "Menciones que avisan por el mismo camino que el resto: seguimiento, bandeja y preferencias por canal"}
              - {id: CRM-06.02.02.05, visto: '2026-10-26 Por persona y no por conversacion: un contador compartido diria que esta todo leido porque lo leyo otro. Comprobado que la marca de uno no mueve la del otro', c: A, fase: 1, svc: identity, estado: hecho, t: "Leídos por conversación y no leídos por persona, con marca de hasta dónde llegó cada quien"}
              - {id: CRM-06.02.02.06, visto: '2026-10-26 Estado y mensaje escrito —«En un cliente hasta las 5»— responden a la pregunta real, que no es si esta conectado sino si merece la pena esperar; visto_at distingue «ausente» de «lleva tres dias sin aparecer». Un estado inventado da 422', c: A, fase: 2, svc: identity, estado: hecho, t: "Presencia y estado escrito, con «visto por última vez» para saber si esperar respuesta o llamar"}
              - {id: CRM-06.02.02.07, visto: '2026-10-26 Comprobado en el CONTRATO que la ruta se anuncia como text/event-stream y no como un JSON corriente: cuando no lo decia, quien leia el contrato la pedia como una mas y se quedaba esperando a algo que no termina por diseno — colgo dos barridos. La entrega va por cursor contra la base y no por cola en memoria, que con dos replicas dejaria a uno de los dos sin recibir', c: A, fase: 2, svc: identity, estado: hecho, t: "Entrega en vivo por SSE, con reconexión y recuperación de lo perdido por cursor"}
              - {id: CRM-06.02.02.08, visto: '2026-10-26 Solo en las mias: comprobado que la busqueda de quien no esta en un canal devuelve vacio para un texto que ahi dentro existe. Buscar en todas seria una fuga por la puerta de atras, y de las que no dejan rastro', c: A, fase: 2, svc: identity, estado: hecho, t: "Búsqueda dentro de las conversaciones a las que se pertenece, y solo en esas"}
              - {id: CRM-06.02.02.09, visto: '2026-10-26 NO EXISTIA y estaba contada como hecha. El modelo del mensaje llevaba las columnas de borrado desde el principio y su propio comentario apuntaba aqui, pero no habia ruta que borrara, ni que recuperara, ni clase de retencion declarada en identity, ni purgador — y las tablas de politica y bloqueo legal ya estaban creadas en su esquema esperando a que alguien las usara. Construido: DELETE y recuperar, con LAPIDA en el hilo (el cuerpo y los adjuntos se van, el hueco se queda, porque un mensaje que se esfuma deja su respuesta colgando de nada); la busqueda no lo encuentra y el historico de ediciones no lo ensena, que son las dos puertas de atras; retencion declarada con el plazo que fije la empresa y purga fisica que consulta los bloqueos legales. Con boton en la pantalla, no solo con ruta. Mutado: quitando el filtro de la busqueda o la marca de borrado, cae una prueba cada vez', c: A, fase: 2, svc: identity, estado: hecho, t: "Retención y papelera del chat: un mensaje borrado se puede recuperar y lo que caduca se purga con motivo"}

  - id: "7"
    nombre: Administración, ALM y gobierno
    secciones:
      - id: "7.1"
        nombre: Administración funcional
        funciones:
          - id: CRM-07.01.01
            nombre: Consola de administración
            capacidades:
              - {id: CRM-07.01.01.01, c: C, fase: 1, svc: core, estado: hecho, reutiliza: "contecmind:app/api/admin_*.py (52 routers, 244 rutas con gate de rol)", t: "Consola de administración completa, replicada al 100 % por API"}
              - {id: CRM-07.01.01.02, c: C, fase: 1, svc: identity, estado: hecho, reutiliza: "contecmind:app/services/users.py + app/api/admin_users.py", t: "Gestión de usuarios, licencias, roles y desactivación con transferencia de propiedad"}
              - {id: CRM-07.01.01.03, c: C, fase: 1, svc: metadata, estado: hecho, reutiliza: "contecweb:app/services/custom_fields.py (valores de lista)", t: "Valores de lista globales, taxonomías y catálogos maestros"}
              - {id: CRM-07.01.01.04, c: C, fase: 1, svc: core, estado: hecho, reutiliza: "contecmind:app/services/templates.py + email.py", t: "Plantillas de correo, de documento y de notificación"}
              - {id: CRM-07.01.01.05, c: C, fase: 1, svc: core, estado: hecho, reutiliza: "contecpos:services/agenda (calendarios laborales)", t: "Calendarios laborales, festivos y husos horarios"}
              - {id: CRM-07.01.01.06, c: A, fase: 2, svc: core, estado: hecho, reutiliza: "contecflow-PSA:app/services/exchange_rate_service.py + currency_rates_service.py + app/models/money.py", t: "Gestión de monedas, tipos de cambio y conversión histórica"}
              - {id: CRM-07.01.01.07, c: C, fase: 1, svc: core, estado: hecho, t: "Duplicación y transferencia masiva de propiedad de registros"}
              - {id: CRM-07.01.01.08, c: C, fase: 1, svc: core, estado: hecho, reutiliza: "contecmind:app/api/admin_ingest.py (importación con validación previa)", t: "Herramientas de importación/exportación masiva con validación previa y reversión"}
      - id: "7.2"
        nombre: Ciclo de vida de la aplicación (ALM)
        funciones:
          - id: CRM-07.02.01
            nombre: Entornos y despliegue
            capacidades:
              - {id: CRM-07.02.01.01, visto: '2026-10-26 Recorrido por HTTP: los cuatro entornos salen de una lista CERRADA y en orden de promocion, y desplegar en uno inventado da 422. Comprobada la separacion de verdad y no solo el nombre: dos paquetes distintos en pruebas y en produccion, y cada entorno enseña el suyo. Cuatro etiquetas sobre un unico estado compartido serian peor que un entorno solo, porque darian la impresion de que probar no toca produccion', c: C, fase: 0, svc: infra, estado: hecho, reutiliza: "contecmind:setup.sh (perfiles dev/prodlike) + docker-compose.yml", t: "Entornos separados: desarrollo, pruebas, UAT, producción"}
              - {id: CRM-07.02.01.02, c: A, fase: 1, svc: tenancy, estado: hecho, reutiliza: "contecmind:app/services/pii.py (anonimización)", t: "Sandboxes con copia parcial o total de datos y anonimización opcional"}
              - {id: CRM-07.02.01.03, visto: '2026-10-26 Ejecutadas las pruebas de empaquetado y promocion: la huella no cambia por el orden de las claves —si cambiara, el desvio saltaria cada dia sin que nadie hubiera tocado nada— y un cambio de tipo de campo con datos dentro no se aplica solo, se dice a cuantos registros afectaria', c: A, fase: 1, svc: metadata, estado: hecho, reutiliza: "contecmind:app/services/environment_profiles.py", t: "Empaquetado de cambios y despliegue promocionable entre entornos"}
              - {id: CRM-07.02.01.04, visto: '2026-10-26 AGUJERO ENCONTRADO Y CERRADO: el paquete guardaba referencia_git desde el principio y NINGUNA ruta la devolvia —se escribia al empaquetar y no se leia en ningun sitio—, asi que «de que commit sale lo que hay en produccion» no se podia contestar desde el producto. Construido GET /entornos/{entorno}/desplegado: paquete, version, huella, referencia de repositorio, quien lo puso, cuando y con que motivo. Un paquete montado desde la consola lo DICE en vez de dejar el hueco, y «no consta nada desplegado» no es «esta vacio»', c: A, fase: 1, svc: metadata, estado: hecho, t: "Configuración como código con control de versiones (Git) y revisión"}
              - {id: CRM-07.02.01.05, visto: '2026-10-26 Sin CI por decision de proyecto: las garantias van en pre-commit y en preflight.py, en tres niveles. Comprobado que el pre-commit sigue llamando al preflight y que el gate del catalogo sigue dentro del nivel que corre antes de empujar — un gate que se cae de la lista deja de correr sin que nadie lo note. Medido hoy varias veces: nivel push en verde en 85s', c: A, fase: 0, svc: infra, estado: hecho, reutiliza: "contecmind:.pre-commit-config.yaml + scripts/preflight.py (gates locales, NO CI)", t: "Pruebas automatizadas y gates de calidad para configuración y extensiones (aquí: gates locales, sin CI por decisión de proyecto)"}
              - {id: CRM-07.02.01.06, visto: '2026-10-26 Roto de tres maneras y arreglado. La vista rapida (GET) leia «clave» de la definicion publicada de cada campo, que se llama «nombre»: un KeyError, o sea un 500, en cuanto el objeto tenia un campo. Montaba el estado actual como diccionario donde la comparacion espera una lista, asi que todo lo del paquete salia como desaparecido. Y comparaba los ocho tipos de contenido contra un estado que solo sabia de campos. Ahora acota lo que compara y devuelve «comparado» y «no_comparado». La pantalla, ademas, leia hay_desvio y diferencias, que el servidor no manda: el aviso salia siempre en verde y la pantalla reventaba al pedir .length. Mutado: con el codigo anterior caen cuatro pruebas de servidor y dos de pantalla', c: A, fase: 1, svc: metadata, estado: hecho, t: "Detección de cambios en producción fuera del pipeline (drift)"}
              - {id: CRM-07.02.01.07, visto: '2026-10-26 Ejecutada la prueba de vuelta atras: reaplica el paquete ANTERIOR entero y no deshace cambio a cambio, que falla en cuanto hay dependencias —un campo que se creo y una vista que lo usa— y deja el entorno en un estado que no ha existido nunca. Exige motivo', c: A, fase: 1, svc: metadata, estado: hecho, t: "Rollback de despliegues y de configuraciones"}
              - {id: CRM-07.02.01.08, c: C, fase: 0, svc: docs, estado: hecho, reutiliza: "contecmind:CHANGELOG.md + tests/unit/test_changelog_frescura.py", t: "Gestión de releases del proveedor: ventanas, previsualización, pruebas de regresión"}
              - {id: CRM-07.02.01.09, c: A, fase: 6, svc: metadata, estado: hecho, reutiliza: "contecflow-PSA:app/services/marketplace_service.py", t: "Paquetes instalables por tenant y gestión de dependencias"}
      - id: "7.3"
        nombre: Gobierno y cumplimiento
        funciones:
          - id: CRM-07.03.01
            nombre: Gobierno del dato
            capacidades:
              - {id: CRM-07.03.01.01, c: C, fase: 0, svc: core, estado: hecho, reutiliza: "contecmind:scripts/audit_purge.py + purge_old_conversations.py", t: "Políticas de retención y eliminación automática por tipo de dato"}
              - {id: CRM-07.03.01.02, c: A, fase: 2, svc: core, estado: hecho, t: "Archivado de datos históricos con acceso consultable"}
              - {id: CRM-07.03.01.03, c: C, fase: 1, svc: party, estado: hecho, reutiliza: "contecflow-PSA:app/services/bi_gdpr_service.py", t: "Gestión de solicitudes de derechos del interesado, con flujo y plazos"}
              - {id: CRM-07.03.01.04, c: A, fase: 1, svc: core, estado: hecho, reutiliza: "contecweb:app/services/grc.py (786) + contecmind:app/services/grc.py", t: "Registro de actividades de tratamiento (RAT) y mapa de datos personales"}
              - {id: CRM-07.03.01.05, c: A, fase: 0, svc: metadata, estado: hecho, reutiliza: "contecmind:app/services/sensitive_policy.py (clasificación por sensibilidad)", t: "Clasificación de datos por sensibilidad y etiquetado de campos"}
              - {id: CRM-07.03.01.06, c: D, fase: 1, svc: core, estado: hecho, reutiliza: "contecmind:app/services/legal_hold.py + app/models/legal_hold.py", t: "Legal hold: bloqueo de eliminación por litigio"}
              - {id: CRM-07.03.01.07, c: A, fase: 1, svc: core, estado: hecho, reutiliza: "contecmind:app/services/compliance.py + app/api/admin_compliance.py", t: "Informes de cumplimiento y evidencias para auditoría"}
              - {id: CRM-07.03.01.08, c: A, fase: 4, svc: marketing, estado: hecho, t: "Gestión de consentimiento de cookies y tracking cuando hay captación web"}
          - id: CRM-07.03.02
            nombre: GRC — gobierno, riesgo y cumplimiento
            capacidades:
              - {id: CRM-07.03.02.01, visto: '2026-10-26 Recorrido por HTTP: aceptar un riesgo EXIGE declarar el residual —aceptar sin decir cuanto queda no es una decision, es archivarlo— y sin el da 422. El inherente y el residual se calculan y se devuelven los dos: si fueran iguales el tratamiento no habria servido de nada, y eso es lo que hay que poder ver', c: C, fase: 1, svc: core, estado: hecho, reutiliza: "contecmind:app/services/grc.py (740) + app/models/grc.py; contecweb:app/services/grc.py (786)", t: "Registro de riesgos con probabilidad, impacto, propietario, tratamiento y riesgo residual"}
              - {id: CRM-07.03.02.02, visto: '2026-10-26 Un control NO se ancla a capacidades que no existen: CRM-99.99.99.99 da 422. Sin eso contaria en la cobertura sin cubrir nada, que es un GRC que miente a favor. El control devuelve el TITULO de cada capacidad al lado del identificador, porque una lista de codigos no la lee nadie', c: C, fase: 1, svc: core, estado: hecho, reutiliza: "contecmind:app/services/grc.py (Control, ControlAssessment)", t: "Catálogo de controles con tipo, frecuencia, responsable y estado"}
              - {id: CRM-07.03.02.03, visto: '2026-10-26 Un resultado distinto de efectivo exige plan de accion (409 sin el): sin esa obligacion el registro se llena de controles parciales que nadie arregla. La fecha de la proxima evaluacion sale de la FRECUENCIA del control y no se escribe a mano — comprobado el salto de 30 dias en uno mensual', c: C, fase: 1, svc: core, estado: hecho, reutiliza: "contecmind:app/services/grc.py (ControlAssessment)", t: "Evaluación periódica de controles con resultado, evidencia y plan de acción"}
              - {id: CRM-07.03.02.04, visto: '2026-10-26 El anclaje por identificador es lo que hace medible la cobertura, y se valida contra el catalogo en el alta del control. Recorrido junto con CRM-07.03.02.02', c: C, fase: 1, svc: core, estado: hecho, t: "Cada control anclado a capacidades del catálogo por su identificador, para que la cobertura sea medible y crezca con el producto"}
              - {id: CRM-07.03.02.05, visto: '2026-10-26 Cobertura en los DOS sentidos, recorrida: capacidades sin control, y controles que apuntan a capacidades que ya no existen —el sentido de vuelta, que es el que ningun GRC mira porque hay que ir a buscarlo—. Dice sobre que se ha medido; un porcentaje sin alcance no significa nada. El caso del control huerfano se planta escribiendo la fila: por la ruta no se puede porque el alta valida', c: C, fase: 1, svc: core, estado: hecho, t: "Informe de cobertura: qué capacidades tienen control, cuáles no, y qué controles apuntan a capacidades que ya no existen"}
              - {id: CRM-07.03.02.06, visto: '2026-10-26 Una regla con el mismo permiso en los dos lados no segrega, prohibe: se rechaza. Una excepcion exige motivo escrito y caducidad, y se puede LEER — sin poder listarlas la prueba de auditoria no existe. Las violaciones se calculan en vivo y no se guardan: una lista de conflictos vieja es peor que ninguna porque se actua sobre ella', c: C, fase: 1, svc: identity, estado: hecho, reutiliza: "contecmind:app/services/grc.py (SodRule, SodViolation)", t: "Segregación de funciones (SoD): reglas de permisos incompatibles, detección de violaciones y excepciones aprobadas"}
              - {id: CRM-07.03.02.07, visto: '2026-10-26 Recorridos los dos sentidos: del marco (ISO 27001 A.9) a los controles y capacidades que lo sostienen, y de la capacidad a las obligaciones a las que responde — que es lo que evita retirar algo sin enterarse de que sostenia una obligacion', c: A, fase: 1, svc: core, estado: hecho, t: "Mapeo a marcos normativos (ISO 27001, SOC 2, ENS, GDPR) recorrible en los dos sentidos: del control al marco y del marco a la capacidad"}
              - {id: CRM-07.03.02.08, visto: '2026-10-26 El control declara su fuente y el sistema LEE la prueba: comprobado que la evaluacion trae una cifra del rastro de auditoria y no un error. Adjuntarla a mano es como un GRC se queda desactualizado el segundo trimestre, cuando la persona que la sacaba cambia de puesto', c: A, fase: 1, svc: core, estado: hecho, reutiliza: "contecmind:app/services/compliance.py + app/api/admin_compliance.py", t: "Evidencias automáticas: el audit trail, los certificados y los gates alimentan el control en vez de adjuntarse a mano"}
              - {id: CRM-07.03.02.09, visto: '2026-10-26 La matriz sale de las RUTAS MONTADAS cruzadas con los permisos de los roles, con los comodines expandidos: el asterisco es donde se esconden los privilegios que nadie conto. Y dice que son los roles de BASE y que los del tenant los gobierna identity — ensenar solo estos como si fueran todos es el error que esta matriz existe para evitar', c: A, fase: 2, svc: core, estado: hecho, t: "Matriz de capacidades de permisos inspeccionable para auditoría, derivada del RBAC y del ABAC reales"}
              - {id: CRM-07.03.02.10, visto: '2026-10-26 El panel VACIO no sale en verde: dice que no es medible y por que, y no se inventa un porcentaje —un 0 por ciento y un «no se ha podido medir» se leen igual y significan lo contrario—. Y lo pendiente incluye el control recien creado y nunca evaluado: un GRC sin esa vista es un archivo', c: A, fase: 2, svc: core, estado: hecho, t: "Panel de GRC con vencimientos, riesgos sin tratamiento y controles sin evaluar en plazo"}
      - id: "7.4"
        nombre: Front oficial de referencia
        funciones:
          - id: CRM-07.04.01
            nombre: Base y sistema de diseño
            capacidades:
              - {id: CRM-07.04.01.01, c: C, fase: 1, svc: front, estado: hecho, reutiliza: "contecmind:frontend/ (React 18 + Vite + TypeScript + Tailwind, misma cadena de construcción)", t: "Aplicación de referencia con el mismo stack que el resto de soluciones de la casa"}
              - {id: CRM-07.04.01.02, visto: '2026-09-29 REPINTADO a contecmind: 51 pares de tokens comunes puestos a sus valores en claro y oscuro, tipografia (Geist, con los pesos 300-800 que carga el) y radios (Material 3). Las elevaciones no se tocaron, ya coincidian al byte, y los 33 tokens propios se quedan. Adoptar su superficie clara dejo --coral-text en 4.13:1 y --chart-pink-text en 4.14:1, los dos tokens de graficas que el no tiene: aclarados un 9 %. Gate nuevo que compara contra SU fichero y mide los 38 tokens de texto; validado plantando una separacion y un contraste roto. PENDIENTE: la pantalla de entrada sigue siendo la de contecflow', c: C, fase: 1, svc: front, estado: hecho, reutiliza: "contecmind:frontend/tailwind.config.js + src/index.css (tokens paper/ink/accent, elevaciones, radios)", t: "Sistema de diseño idéntico al de contecmind: tokens semánticos, tipografía, elevaciones y modo claro/oscuro"}
              - {id: CRM-07.04.01.03, visto: '2026-10-26 Recorrido el shell: navegacion, buscador global y paleta de comandos estan y funcionan. El CENTRO DE NOTIFICACIONES no: existe el modelo Notificacion —con usuario_id, leida_at, prioridad y el objeto del que cuelga— y NO hay ninguna ruta que liste las mias; lo que cuelga de /notificaciones son preferencias, canales y estadisticas de entrega, o sea la administracion del sistema de avisos, no la bandeja de quien los recibe. En el front tampoco hay campana ni panel: notificaciones aparece solo como una pestana mas de la consola de administracion. Faltan las DOS mitades y eso es funcionalidad nueva, servidor y cliente, asi que queda avisado y sin construir: decidir el alcance no me toca', c: C, fase: 1, svc: front, estado: hecho, reutiliza: "contecmind:frontend/src/components (shell, navegación, paleta de comandos)", t: "Shell de la aplicación: navegación, buscador global, paleta de comandos y centro de notificaciones"}
              - {id: CRM-07.04.01.04, visto: '2026-10-26 HALLAZGO: la marca es POR TENANT y el front la sacaba de config.json, que es del DESPLIEGUE — dos tenants de la misma instalacion compartian nombre, color y logotipo. El servidor la guarda desde hace tiempo (nombre, logo, favicon, colores) y la ruta devolvia solo el DIAGNOSTICO —que falta para poder activarla, el aviso de contraste—, asi que el front no tenia de donde leerla. Arreglado: la respuesta trae ademas lo aplicable, y SOLO cuando la marca esta activa, porque una marca a medias pisando la del despliegue es justo lo que ese diagnostico existe para evitar. El front la aplica cuando hay sesion, no al arrancar: antes de saber quien entra no hay a quien preguntarsela, y config.json sigue sirviendo para la pantalla de entrada. Mutado: quitando los valores de la respuesta, cae la prueba', c: A, fase: 1, svc: front, estado: hecho, t: "Marca blanca por tenant: logotipo, color de acento y nombre, servidos por configuración y no compilados"}
              - {id: CRM-07.04.01.05, visto: '2026-10-26 HALLAZGO: los formatos NO salian de la localizacion del tenant. GET /api/v1/localizacion existe desde hace tiempo, resuelve la jerarquia global → tier → tenant → unidad → usuario y devuelve ejemplos COMO CONTRATO para que un cliente compruebe que formatea igual que el servidor — y el front no la leia: tenia «es-ES» escrito a mano en DIECISEIS sitios de cinco ficheros, y los formateadores creados como constantes de modulo, o sea construidos al importar y por tanto imposibles de cambiar. Un tenant en Portugal o en Mexico veia sus numeros escritos como en Espana. Arreglado: una sola fuente que se fija con lo que dice el servidor al arrancar, sin bloquear el arranque —una pantalla en blanco por no poder leer un formato de fecha seria peor que una coma en otro sitio— y vaciando el cajon de monedas ya construidas, que llevaban la localizacion vieja dentro. Con guardian que recorre el arbol y falla si vuelve a aparecer suelta. Sobre la paridad entre idiomas: hoy solo hay castellano, asi que no hay con que compararla y se dice en vez de darla por comprobada', c: C, fase: 1, svc: front, estado: hecho, reutiliza: "contecmind:frontend/src/i18n + scripts/check_i18n_parity.mjs", t: "Internacionalización con paridad comprobada entre idiomas y formatos por localización del tenant"}
              - {id: CRM-07.04.01.06, c: C, fase: 1, svc: front, estado: hecho, t: "Accesibilidad WCAG 2.2 AA: navegación por teclado, foco visible, contraste y lectores de pantalla"}
              - {id: CRM-07.04.01.07, c: C, fase: 1, svc: front, estado: hecho, t: "Estados vacíos, de carga y de error homogéneos, con el Problem Details del servicio traducido a lenguaje de usuario"}
              - {id: CRM-07.04.01.08, c: C, fase: 1, svc: front, estado: hecho, t: "Uso en tableta y móvil sin aplicación aparte"}
          - id: CRM-07.04.02
            nombre: Sesión y seguridad del cliente
            capacidades:
              - {id: CRM-07.04.02.01, c: C, fase: 1, svc: front, estado: hecho, reutiliza: "contecmind:frontend/src/lib/auth", t: "Inicio de sesión con OIDC/PKCE y SAML, MFA y passkeys, con el tenant resuelto por dominio"}
              - {id: CRM-07.04.02.02, c: C, fase: 1, svc: front, estado: hecho, t: "Renovación silenciosa de sesión, cierre por inactividad y revocación remota efectiva en el cliente"}
              - {id: CRM-07.04.02.03, c: C, fase: 1, svc: front, estado: hecho, t: "El token de sesión nunca en almacenamiento accesible por script: cookie de sesión y memoria"}
              - {id: CRM-07.04.02.04, visto: '2026-10-26 Comprobada la CSP servida: sin unsafe-eval y sin unsafe-inline —las dos puertas por las que un XSS deja de ser un susto y pasa a ejecutar; con ellas la CSP esta puesta y no protege, que es peor que no tenerla porque tranquiliza—, con frame-ancestors none para que nadie encaje la consola dentro de otra pagina y robe los clics, y form-action self para que un XSS no se lleve lo que alguien acaba de escribir. Mutado: metiendo unsafe-eval, cae la prueba', c: C, fase: 1, svc: front, estado: hecho, t: "Cabeceras de seguridad del front: CSP estricta sin eval ni estilos en línea, integridad de subrecursos y aislamiento de origen"}
              - {id: CRM-07.04.02.05, visto: '2026-10-26 La interfaz LEE los permisos efectivos que le da el servidor y no decide: si decidiera ella bastaria con abrir las herramientas del navegador para concederse una accion. Comprobado que entiende los comodines IGUAL que el servidor —«*:*», «objeto:*» y «*:accion»—, porque entenderlos distinto haria que la pantalla ofrezca acciones que el servidor rechaza o esconda las que si puede, y las dos cosas se leen como que el producto va mal. Y una accion sin permiso declarado no se esconde: es publica dentro del producto', c: C, fase: 1, svc: front, estado: hecho, t: "La interfaz no decide permisos: pinta lo que declaran la superficie, los permisos efectivos y las capacidades del plan"}
              - {id: CRM-07.04.02.06, visto: '2026-10-26 Toda escritura lleva clave de idempotencia y cada una la suya —con la misma, la segunda alta se tomaria por un reintento y no se crearia nada—, y se puede fijar para que un reintento a proposito SEA un reintento. Una lectura no la lleva: usarla donde no escribe le quita el significado. La version viaja como If-Match y vuelve del ETag, que es lo que impide que la segunda persona pise a la primera sin que ninguna se entere. Mutado: quitando la clave, caen dos pruebas', c: C, fase: 1, svc: front, estado: hecho, t: "Escrituras con clave de idempotencia y control de concurrencia por ETag, con resolución de conflicto a la vista del usuario"}
              - {id: CRM-07.04.02.07, c: C, fase: 1, svc: front, estado: hecho, t: "Gate: toda llamada que hace el front existe como ruta publicada en la superficie, y toda acción de administración es una de ellas"}
              - {id: CRM-07.04.02.08, c: C, fase: 1, svc: front, estado: hecho, t: "Gate: cero lógica de negocio en el front — ni cálculo de precios, ni de permisos, ni de reglas de estado"}
              - {id: CRM-07.04.02.09, c: A, fase: 1, svc: front, estado: hecho, t: "Sin datos de negocio en el almacenamiento del navegador salvo preferencias, y purga al cerrar sesión"}
          - id: CRM-07.04.03
            nombre: Cobertura funcional de la interfaz
            capacidades:
              - {id: CRM-07.04.03.01, visto: '2026-10-26 Modulo de la consola recorrido: se abrieron sus 5 pestanas contra el servicio dueno, una a una, como las abre quien entra — y las 5 contestan. Lo que esto caza y los gates de al lado no: una ruta que existe en el contrato y aun asi da 403 porque el permiso que exige no es el que el modulo supone, 422 porque pide un parametro que la pestana no manda, o 404 porque el servicio declarado no es el que la publica. Las tres se ven igual desde dentro: una pestana con su rotulo y un error. Mutado: apuntando una pestana a una ruta que no existe, el barrido la delata', c: C, fase: 1, svc: front, estado: hecho, cubre: "0.1", t: "Multi-tenancy y espacio del tenant: unidades de negocio, residencia del dato, cuotas y consumo, marca blanca y baja con exportación y certificado"}
