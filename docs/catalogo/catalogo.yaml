              - {id: CRM-01.01.02.02, c: A, fase: 1, svc: party, estado: hecho, t: "Relación N:M contacto–cuenta con rol, vigencia y contacto principal"}
              - {id: CRM-01.01.02.03, c: A, fase: 2, svc: party, estado: hecho, t: "Mapa de relaciones e influencia entre contactos (reporting line, aliado, detractor)"}
              - {id: CRM-01.01.02.04, c: A, fase: 2, svc: sales, estado: hecho, t: "Rol en el proceso de compra: decisor, prescriptor, usuario, económico, guardián"}
              - {id: CRM-01.01.02.05, c: C, fase: 1, svc: party, estado: hecho, t: "Preferencias de contacto: canal, frecuencia, idioma, horario", visto: "2026-10-27 Las CUATRO preferencias de contacto —canal, frecuencia maxima, idioma y horario— ya se ven. Salian dos: se podia respetar el canal y el idioma del contacto, y no cuantas veces ni a que horas, que es justo lo que convierte respetar la preferencia en media promesa"}
