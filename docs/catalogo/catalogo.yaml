            nombre: Email marketing
            capacidades:
              - {id: CRM-02.03.01.01, c: C, fase: 4, svc: marketing, estado: hecho, reutiliza: "contecmind:app/services/email.py + plantillas; contecweb:app/services/email.py", t: "Editor de plantillas con bloques reutilizables y contenido dinámico"}
              - {id: CRM-02.03.01.02, c: A, fase: 4, svc: marketing, estado: hecho, t: "Personalización con tokens, contenido condicional y recomendaciones"}
              - {id: CRM-02.03.01.03, visto: '2026-10-05 AUDITADO, con un hallazgo cerrado. SPF, DKIM, DMARC y BIMI se comprueban y se dice que le falta a cada dominio —un dominio sin ellos NO rebota: llega a basura, y eso no sale en el informe de rebotes—. Lo que faltaba: el tope diario de una IP en calentamiento se calculaba, salia en la pantalla con su aviso («hoy como mucho N envios») y NO LO APLICABA NADIE. Una IP nueva que manda cien mil el primer dia se quema, y quemarla cuesta semanas en las que no llega nada por ese dominio — ni las campanas ni las facturas, que comparten reputacion. Ahora es la sexta comprobacion de comprobar_envio. Un dominio que no calienta no frena nada, y sin decir el dominio no se inventa un tope', c: A, fase: 4, svc: marketing, estado: hecho, t: "Gestión de entregabilidad: SPF, DKIM, DMARC, BIMI, IP dedicada, warm-up"}
              - {id: CRM-02.03.01.04, visto: '2026-10-05 AUDITADO, cumple. Los rebotes BLANDOS se guardan tambien, y ese es el punto: uno aislado es normal —el buzon estaba lleno— y cinco seguidos son una direccion muerta; sin el historico o se suprime al primer fallo, perdiendo contactos buenos, o no se suprime nunca y la reputacion se hunde. anotar_rebote tiene ruta', c: C, fase: 4, svc: marketing, estado: hecho, t: "Gestión de rebotes duros y blandos, quejas y bucles de retroalimentación"}
              - {id: CRM-02.03.01.05, c: C, fase: 4, svc: marketing, estado: hecho, t: "Preferencias de suscripción granulares y centro de preferencias alojable"}
              - {id: CRM-02.03.01.06, c: A, fase: 4, svc: marketing, estado: hecho, t: "Previsualización multi-cliente de correo y test de spam score"}
              - {id: CRM-02.03.01.07, c: A, fase: 4, svc: marketing, estado: hecho, t: "Envío transaccional separado del promocional, con dominios distintos"}
          - id: CRM-02.03.02
            nombre: Otros canales
            capacidades:
              - {id: CRM-02.03.02.01, visto: '2026-10-05 AUDITADO, cumple. SMS y RCS estan en CANALES con su forma de baja declarada (palabra clave de respuesta en los dos), PALABRAS_BAJA compara sin acentos ni mayusculas y coge la PRIMERA palabra, procesar_entrante aplica la baja y abre la ventana a la vez, y las tres funciones tienen ruta. El consentimiento es por canal y por destino, no global', c: A, fase: 4, svc: marketing, estado: hecho, reutiliza: "contecpos:services/notificaciones (SMS/WhatsApp)", t: "SMS y RCS con gestión de consentimiento y palabras clave de baja"}
              - {id: CRM-02.03.02.02, visto: '2026-10-05 AUDITADO, cumple. Ventana de 24h desde el ultimo entrante, fuera de ella solo plantilla en estado aprobada, y el estado lo pone el proveedor y no nosotros. Mandar una no aprobada no falla: el proveedor la descarta, asi que se corta antes de salir', c: A, fase: 4, svc: marketing, estado: hecho, reutiliza: "contecpos:services/notificaciones + simuladores/sim-whatsapp", t: "WhatsApp Business: plantillas aprobadas, ventana de 24h, sesión y opt-in"}
              - {id: CRM-02.03.02.03, visto: '2026-10-05 AUDITADO, con un hallazgo cerrado. El canal push estaba declarado con su consentimiento y su baja, y movil.preparar_push —que decide que un push NO lleva el dato dentro— estaba escrita, probada y sin llamante. O sea: los avisos salian por push con el cuerpo entero y con sus datos, el nombre del cliente y el importe, en una pantalla de bloqueo que ve cualquiera que coja el telefono y pasando por servidores de un tercero. Ahora reparto._mensaje compone el push con preparar_push: titulo corto, referencia al objeto y nada mas. La entrega sigue siendo el canal HTTP declarativo, sin codigo de ningun proveedor', c: A, fase: 4, svc: marketing, estado: hecho, reutiliza: "contecmind:app/services/push.py + app/models/push_subscription.py", t: "Notificaciones push web y móvil"}
              - {id: CRM-02.03.02.04, c: A, fase: 4, svc: marketing, estado: hecho, t: "Publicidad digital: sincronización de audiencias y retargeting"}
              - {id: CRM-02.03.02.05, c: D, fase: 4, svc: marketing, estado: hecho, t: "Correo postal y telemarketing como pasos orquestados del recorrido"}
              - {id: CRM-02.03.02.06, c: A, fase: 4, svc: marketing, estado: hecho, reutiliza: "contecflow-PSA:app/services/public_forms_service.py", t: "Landing pages y formularios alojados o embebidos, con pre-relleno para conocidos"}
