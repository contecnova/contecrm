# ── ANEXO A — Catálogo mínimo de recursos de API ───────────────────────────
# Base para verificar que el sistema es realmente headless. Cada recurso debe
# ofrecer CRUD, búsqueda, operaciones masivas, historial y eventos. El gate
# `tests/unit/test_headless_contract.py` comprueba, para cada recurso ya
# declarado `hecho`, que esas cinco superficies existen en el OpenAPI generado.
anexo_a_recursos:
  nucleo: [accounts, contacts, leads, activities, notes, attachments, addresses, consents, relationships]
  ventas: [opportunities, opportunity-lines, pipelines, stages, forecasts, quotes, orders, contracts, subscriptions, price-books, products, territories, quotas, partners, deal-registrations]
  servicio: [cases, case-comments, entitlements, slas, queues, knowledge-articles, conversations, messages, assets, work-orders, surveys]
  marketing: [campaigns, campaign-members, segments, journeys, templates, sends, subscriptions-preferences, attributions]
  plataforma: [tenants, users, roles, permission-sets, sharing-rules, "metadata/objects", "metadata/fields", layouts, workflows, workflow-instances, webhooks, events, jobs, imports, audit-logs, reports, dashboards, feature-flags, quotas-usage]

# ── ANEXO B — Eventos de dominio mínimos ───────────────────────────────────
# Todo evento lleva SIEMPRE: id, type, version, tenant_id, occurred_at, actor,
# subject (tipo + id), data, trace_id, dedup_key. El sobre está definido en
# `packages/crmcore/crmcore/events/envelope.py` y verificado por
# `tests/unit/test_event_envelope_contract.py`.
anexo_b_eventos:
  - {type: lead.created, fase: 1, svc: sales}
  - {type: lead.qualified, fase: 1, svc: sales}
  - {type: lead.converted, fase: 1, svc: sales}
  - {type: lead.assigned, fase: 1, svc: sales}
  - {type: account.created, fase: 1, svc: party}
  - {type: account.merged, fase: 1, svc: party}
  - {type: contact.consent.changed, fase: 1, svc: party}
  - {type: opportunity.created, fase: 1, svc: sales}
  - {type: opportunity.stage.changed, fase: 1, svc: sales}
  - {type: opportunity.won, fase: 1, svc: sales}
  - {type: opportunity.lost, fase: 1, svc: sales}
  - {type: record.commented, fase: 1, svc: core}
  - {type: quote.sent, fase: 2, svc: sales}
  - {type: quote.accepted, fase: 2, svc: sales}
  - {type: order.submitted, fase: 2, svc: sales}
  - {type: contract.signed, fase: 2, svc: sales}
  - {type: contract.renewal.due, fase: 2, svc: sales}
  - {type: subscription.changed, fase: 2, svc: sales}
  - {type: case.created, fase: 3, svc: service}
  - {type: case.assigned, fase: 3, svc: service}
  - {type: case.sla.at_risk, fase: 3, svc: service}
  - {type: case.sla.breached, fase: 3, svc: service}
  - {type: case.resolved, fase: 3, svc: service}
  - {type: campaign.member.status.changed, fase: 4, svc: marketing}
  - {type: journey.entered, fase: 4, svc: marketing}
  - {type: journey.exited, fase: 4, svc: marketing}
  - {type: record.merged, fase: 1, svc: party}
  - {type: record.deleted, fase: 0, svc: core}
  - {type: user.provisioned, fase: 0, svc: identity}
  - {type: tenant.provisioned, fase: 0, svc: tenancy}
  - {type: tenant.suspended, fase: 0, svc: tenancy}
  - {type: quota.threshold.reached, fase: 0, svc: tenancy}

# ── ANEXO C — Preguntas de verificación ────────────────────────────────────
# Sirven para distinguir un CRM genuinamente headless y multi-tenant de uno que
# solo lo declara. Aquí no son preguntas a un proveedor: son preguntas que este
# repositorio se hace a sí mismo, y cada una apunta a dónde está la respuesta
# MEDIDA (no prometida). `docs/manual-5-arquitectura.md` las responde una a una.
anexo_c_verificacion:
  - {q: "¿Existe alguna función de la UI que no pueda ejecutarse por API?", responde: tests/unit/test_headless_contract.py}
  - {q: "¿La UI oficial consume las mismas APIs públicas o usa endpoints internos privilegiados?", responde: tests/unit/test_headless_contract.py}
  - {q: "¿Cómo se propaga y se fuerza el tenant_id? ¿Hay RLS en el motor o solo filtrado en aplicación?", responde: "deploy/sql/rls.sql + tests/integration/test_rls_aislamiento.py"}
  - {q: "¿Qué ocurre si un tenant ejecuta una importación de 10 millones de registros? ¿Cómo se protege al resto?", responde: "crmcore/http/limites.py + tests/unit/test_cuotas.py"}
  - {q: "¿Las automatizaciones y workflows son reanudables tras una caída, o se pierden en vuelo?", responde: "services/orchestrator + tests/integration/test_orquestador_reanuda.py"}
  - {q: "¿Cómo se compensa un proceso multi-servicio que falla a mitad?", responde: "services/orchestrator (sagas con compensación) + tests/integration/test_saga_compensa.py"}
  - {q: "¿La lógica de validación está disponible para un frontend propio antes de enviar los datos?", responde: "services/metadata (dry-run de validaciones)"}
  - {q: "¿Los webhooks garantizan orden, deduplicación y replay?", responde: "services/eventing + tests/integration/test_webhooks_entrega.py"}
  - {q: "¿Se pueden desplegar cambios de configuración desde Git con revisión y rollback?", responde: "services/metadata (configuración como código)"}
  - {q: "¿La exportación de salida incluye metadatos, configuración, adjuntos e histórico, o solo tablas?", responde: "services/tenancy (offboarding verificable)"}
  - {q: "¿Los modelos de IA se entrenan con datos del tenant? ¿Se puede desactivar contractualmente?", responde: "docs/COMPLIANCE.md + CRM-05.02.02.09"}
  - {q: "¿El coste escala por usuario, por API call, por registro o por evento?", responde: "services/tenancy (metering) + docs/manual-4-configuracion.md"}
