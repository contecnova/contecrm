      - id: "5.2"
        nombre: Inteligencia artificial
        funciones:
          - id: CRM-05.02.01
            nombre: Modelos predictivos
            capacidades:
              - {id: CRM-05.02.01.01, c: A, fase: 5, svc: intelligence, estado: hecho, reutiliza: "contecflow-PSA:app/services/ml_trainer.py + risk_scoring.py", t: "Scoring de leads y de oportunidades con explicabilidad"}
              - {id: CRM-05.02.01.02, c: A, fase: 5, svc: intelligence, estado: hecho, reutiliza: "contecflow-PSA:app/services/bi_forecasting_service.py", t: "Predicción de cierre, de importe y de fecha real"}
              - {id: CRM-05.02.01.03, c: A, fase: 5, svc: intelligence, estado: hecho, reutiliza: "contecmind:app/services/recommendations.py", t: "Propensión a compra, cross-sell y next best offer"}
              - {id: CRM-05.02.01.04, c: A, fase: 5, svc: intelligence, estado: hecho, reutiliza: "contecflow-PSA:app/services/customer_health_service.py", t: "Predicción de churn y de riesgo de cuenta", visto: "2026-10-27 Las cuentas que el modelo marca en riesgo tienen listado propio, que es la lista sobre la que se trabaja; la salud de una cuenta suelta ya se veia en su pantalla"}
              - {id: CRM-05.02.01.05, c: A, fase: 5, svc: intelligence, estado: hecho, reutiliza: "contecflow-PSA:app/services/bi_anomaly_service.py; contecmind:app/services/drift.py", t: "Detección de anomalías en pipeline, actividad y servicio", visto: "2026-10-27 Las anomalias se listan por desviacion y ahora ADEMAS se pueden abrir: existia la accion de decir si el aviso valia y no existia forma de abrir el aviso. Se publica su ficha con el valor, lo esperado, la desviacion y la explicacion, que es lo que hace falta para contestar si era real sin contestar a ojo"}
              - {id: CRM-05.02.01.06, c: A, fase: 5, svc: intelligence, estado: hecho, reutiliza: "contecflow-PSA:app/services/predictive_retraining_service.py", t: "Reentrenamiento por tenant con datos propios y aislamiento del modelo"}
              - {id: CRM-05.02.01.07, c: A, fase: 5, svc: intelligence, estado: hecho, reutiliza: "contecflow-PSA:app/models/ml_model.py + ai_governance.py; contecmind:app/services/evals.py + drift.py", t: "Gobierno de modelos: versión, métricas, drift, fecha de entrenamiento", visto: "2026-10-27 Gobierno de modelos con pantalla: version, estado, metricas, fecha de entrenamiento, ventana de datos y vigencia, con activacion de version y calculo de deriva", visto: "2026-10-28 AGUJERO CERRADO: las mediciones de deriva se anotaban y NO LAS LEIA NADIE —habia POST y ningun GET—, asi que se medi­a y no se miraba. Ahora `GET /ia/modelos/deriva` y pestana propia, con la referencia y la caida al lado de cada valor y con las muestras, porque una caida sobre treinta casos no es la misma noticia que una sobre treinta mil. Sin mediciones NO se dice que el modelo acierte: se dice que nadie lo ha comprobado"}
          - id: CRM-05.02.02
            nombre: IA generativa
            capacidades:
              - {id: CRM-05.02.02.01, c: A, fase: 5, svc: intelligence, estado: hecho, reutiliza: "contecmind:app/services/transformations.py + prompts.py", t: "Redacción y reescritura de correos, propuestas y respuestas"}
              - {id: CRM-05.02.02.02, c: A, fase: 5, svc: intelligence, estado: hecho, reutiliza: "contecmind:app/services/synthesis.py + briefings.py", t: "Resumen de cuenta, de oportunidad, de caso y de hilo de conversación"}
              - {id: CRM-05.02.02.03, c: A, fase: 5, svc: intelligence, estado: hecho, reutiliza: "contecmind:app/services/rag.py + retrieval/ (RAG con citación de fuente)", t: "Respuesta sobre datos propios con RAG y citación de la fuente"}
              - {id: CRM-05.02.02.04, c: A, fase: 5, svc: intelligence, estado: hecho, reutiliza: "contecflow-PSA:app/services/ask_the_data.py; contecmind:app/services/intent.py", t: "Consulta en lenguaje natural sobre los datos del CRM"}
              - {id: CRM-05.02.02.05, c: A, fase: 5, svc: intelligence, estado: hecho, reutiliza: "contecmind:app/core/llm_json.py + app/services/metadata_enrichment.py", t: "Extracción estructurada desde correos, PDFs y transcripciones a campos del CRM"}
              - {id: CRM-05.02.02.06, c: A, fase: 5, svc: intelligence, estado: hecho, reutiliza: "contecmind:app/services/languages.py", t: "Traducción automática de contenidos e interacciones"}
              - {id: CRM-05.02.02.07, c: C, fase: 5, svc: intelligence, estado: hecho, reutiliza: "contecmind:app/core/inference_gate.py + app/services/sensitive_policy.py", t: "Guardrails: filtros de contenido, verificación de permisos antes de recuperar contexto", visto: "2026-10-27 Lo que las guardias NO dejaron pasar tiene listado propio. Una guardia sin registro es una promesa: nadie puede decir si ha actuado alguna vez"}
              - {id: CRM-05.02.02.08, c: A, fase: 5, svc: intelligence, estado: hecho, reutiliza: "contecmind:app/services/metering.py (coste por tenant y modelo)", t: "Trazabilidad de uso de IA: prompt, modelo, coste, usuario, registro afectado"}
              - {id: CRM-05.02.02.09, c: C, fase: 5, svc: intelligence, estado: hecho, reutiliza: "contecmind:docs/COMPLIANCE.md (opt-out contractual)", t: "Opt-out de entrenamiento y garantía de no uso de datos del tenant", visto: "2026-10-27 El opt-out de entrenamiento se ve por proveedor en Gobierno de la IA. Un opt-out que consta en un contrato y no en la pantalla no lo comprueba nadie"}
              - {id: CRM-05.02.02.10, c: D, fase: 5, svc: intelligence, estado: hecho, reutiliza: "contecmind:app/core/model_router.py + providers/", t: "Selección de modelo y región por tenant, incluido modelo propio del cliente", visto: "2026-10-28 AUDITADO Y ARREGLADO. La pantalla de proveedores de IA ensena region, modelos admitidos y si el proveedor es propio del cliente. Pero `ProveedorIA.formato` se guardaba, se ensenaba y NO LO LEIA NADIE: `puerto._llamar` construia siempre el cuerpo de la familia OpenAI, asi que un tenant que declarara un proveedor Anthropic o Gemini tenia la fila bien guardada y la llamada rechazada con un 400 ilegible. Ahora la traduccion vive en `services/intelligence/dialectos.py` —tres familias: openai_chat, anthropic_messages y gemini_generate, con sus herramientas, su opt-out y su lectura de respuesta— y el formato se valida al declarar el proveedor, como la region. Probado con las tres familias sin red: el cuerpo que sale y la respuesta que se lee"}
          - id: CRM-05.02.03
            nombre: Agentes autónomos
            capacidades:
              - {id: CRM-05.02.03.01, c: A, fase: 5, svc: intelligence, estado: hecho, reutiliza: "contecmind:app/services/agent/ + orchestrator/", t: "Agentes que ejecutan procesos con herramientas definidas y permisos acotados", visto: "2026-10-27 AUDITADO Y ARREGLADO. Los agentes tienen pantalla en Gobierno de la IA, pero NO podian actuar: `puerto._invocar_herramienta` lanzaba `agente.invocador_no_configurado` en todos los despliegues, asi que el agente planificaba y ahi se acababa. No lo cazaba el gate de lo escrito y sin enchufar porque la funcion SI tenia llamante: lo que faltaba era que hiciera algo. Ahora llama a la API del CRM con la identidad del agente, firmada; el servicio de destino sale de la ruta con la misma tabla que usa el gateway, que se ha subido al nucleo (`crmcore.rutas_de_api`) para no duplicarla. Medido contra la pila viva: accounts, activities y opportunities contestan 200 con los permisos del agente. Y `revertir` compensaba con `principal_id=None` y sin permisos, o sea que deshacer habria fallado justo el dia que hiciera falta. 2026-10-28: y planificaba de UNA VEZ, lo que deja fuera cualquier objetivo cuya segunda mitad dependa de la primera —«que cuentas estan en riesgo y, de cada una, mira su facturacion» se escribiria sobre cuentas que todavia no se sabe cuales son—. Ahora el agente declara su `modo`: `plan_cerrado` (el de siempre, que es el que una persona aprueba de una vez) o `iterativo`, que pide UN paso, lo ejecuta y vuelve a decidir con el resultado delante, por tool use nativo del proveedor. Lo que NO cambia: cada paso se guarda antes de ejecutarse, pasa por la aprobacion por riesgo y cuenta para el tope; y el presupuesto se mira en CADA vuelta, no solo al lanzar, porque en un bucle donde se gasta es en cada vuelta"}
              - {id: CRM-05.02.03.02, c: A, fase: 5, svc: intelligence, estado: hecho, t: "Definición de herramientas a partir de las propias APIs del CRM"}
              - {id: CRM-05.02.03.03, c: A, fase: 5, svc: intelligence, estado: hecho, reutiliza: "contecmind:app/services/approval_engine/ (human-in-the-loop)", t: "Puntos de control humano (human-in-the-loop) por criticidad o importe", visto: "2026-10-27 El punto de control humano se ve en la ficha del agente: desde que importe pide aprobacion y para que nivel de riesgo. Estaba en el modelo y no habia donde mirarlo"}
              - {id: CRM-05.02.03.04, c: C, fase: 5, svc: intelligence, estado: hecho, reutiliza: "contecmind:app/services/entitlements.py (presupuesto de tokens) + inference_gate.py", t: "Límites de acción, presupuesto de tokens y kill switch por tenant", visto: "2026-10-27 Limites, presupuesto de tokens al dia y apagado por agente, visibles y editables en Gobierno de la IA; el apagado deja su motivo escrito"}
              - {id: CRM-05.02.03.05, c: A, fase: 5, svc: intelligence, estado: hecho, reutiliza: "contecflow-PSA:app/services/service_desk/autonomous_agent_service.py + ai_governance.py", t: "Auditoría completa de la actuación del agente y reversión de sus cambios", visto: "2026-10-28 AUDITADO Y ARREGLADO. La actuacion y la reversion estaban enteras en el servicio y no las ensenaba NINGUNA pantalla: el agente solo se veia como una fila en el listado de administracion, con un boton de apagar. Ahora `frontend/src/paginas/Preguntar.tsx` ensena el plan y lo ejecutado juntos, lo que no tiene vuelta atras ANTES de ofrecer el boton de deshacer, y deshace. Ademas `actuacion` no devolvia el identificador del paso, asi que una pantalla que ensenara los pasos esperando no habria podido aprobarlos"}
              - {id: CRM-05.02.03.06, c: A, fase: 5, svc: intelligence, estado: hecho, t: "Agente de calificación de leads, de respuesta de soporte y de actualización de datos"}

  - id: "6"
