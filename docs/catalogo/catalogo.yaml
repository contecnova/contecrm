              - {id: CRM-01.01.01.02, c: C, fase: 1, svc: party, estado: hecho, reutiliza: "contecflow-PSA:app/models/enterprise.py (jerarquía de organizaciones)", t: "Jerarquías de cuenta multinivel (grupo, matriz, filial, delegación, centro)"}
              - {id: CRM-01.01.01.03, c: A, fase: 1, svc: party, estado: hecho, t: "Jerarquías múltiples y simultáneas: legal, comercial, de facturación, de entrega"}
              - {id: CRM-01.01.01.04, c: A, fase: 1, svc: party, estado: hecho, t: "Relaciones entre cuentas no jerárquicas (partner, competidor, proveedor, prescriptor)"}
              - {id: CRM-01.01.01.05, visto: '2026-10-05 AUDITADO, cumple. La geocodificacion la hace el verificador declarado por el tenant, sin codigo de ningun proveedor, y tiene su ruta. Las coordenadas solo se escriben si el veredicto es concluyente Y trae las dos: una latitud sin longitud deja un punto en el meridiano de Greenwich, que es un sitio muy concreto y casi nunca el correcto', c: C, fase: 1, svc: party, estado: hecho, t: "Múltiples direcciones tipificadas con validación y geocodificación"}
              - {id: CRM-01.01.01.06, c: A, fase: 1, svc: party, estado: hecho, reutiliza: "contecweb:app/services/prueba_de_identidad.py (validación contra registros)", t: "Múltiples identificadores fiscales y validación contra registros oficiales (VIES)"}
              - {id: CRM-01.01.01.07, c: C, fase: 1, svc: party, estado: hecho, t: "Segmentación: sector (CNAE/SIC/NAICS), tamaño, facturación, tier, ABC, ciclo de vida", visto: "2026-10-27 La segmentacion que se vende son seis cosas —sector con su esquema CNAE/SIC/NAICS, tamano, facturacion, tier, ABC y ciclo de vida— y a la pantalla llegaban CUATRO: la clasificacion ABC estaba en la tabla y en el esquema de alta, y no salia en el de lectura, asi que nadie podia verla ni filtrar por ella. Arreglado el contrato y declarado"}
              - {id: CRM-01.01.01.08, c: A, fase: 4, svc: party, estado: hecho, t: "Datos firmográficos enriquecidos desde proveedores externos"}
              - {id: CRM-01.01.01.09, c: A, fase: 1, svc: party, estado: hecho, reutiliza: "contecpos:services/clientas (modelo B2C)", t: "Cuentas personales (B2C) coexistiendo con el modelo B2B", visto: "2026-10-27 `es_personal` existia en la tabla y no salia por la API: una cuenta B2C no se distinguia de una B2B en ninguna pantalla. Expuesto y declarado"}
              - {id: CRM-01.01.01.10, c: C, fase: 1, svc: party, estado: hecho, reutiliza: "contecflow-PSA:app/services/raci_service.py (roles sobre entidad)", t: "Equipo de cuenta con roles (owner, KAM, técnico, soporte, financiero)"}
              - {id: CRM-01.01.01.13, c: A, fase: 2, svc: party, estado: hecho, t: "Reverificación periódica automática de identificadores fiscales y direcciones, con cola y cuota"}
              - {id: CRM-01.01.01.11, c: A, fase: 2, svc: party, estado: hecho, t: "Plan de cuenta: objetivos, whitespace, mapa de poder, riesgos"}
