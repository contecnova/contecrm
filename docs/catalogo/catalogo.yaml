              - {id: CRM-01.01.02.07, c: D, fase: 4, svc: party, estado: hecho, t: "Detección de cambio de empresa y seguimiento del contacto a su nuevo puesto"}
              - {id: CRM-01.01.02.08, c: C, fase: 1, svc: party, estado: hecho, reutiliza: "contecmind:app/services/timeline.py", t: "Historial completo de interacciones unificado"}
