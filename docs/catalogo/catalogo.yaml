              - {id: CRM-00.01.01.02, c: A, fase: 0, svc: core, estado: pendiente, reutiliza: "contecpos:deploy/crear-bases.sh (un esquema y un rol por servicio)", t: "Aislamiento por esquema — un esquema por tenant sobre instancia compartida"}
              - {id: CRM-00.01.01.03, c: A, fase: 0, svc: tenancy, estado: pendiente, t: "Aislamiento físico — base de datos o clúster dedicado por tenant"}
              - {id: CRM-00.01.01.04, c: A, fase: 0, svc: tenancy, estado: pendiente, t: "Modelo híbrido por tiers (silo para enterprise, pool para SMB) con promoción entre tiers"}
              - {id: CRM-00.01.01.05, c: D, fase: 0, svc: tenancy, estado: pendiente, t: "Política de bring your own database / despliegue en la infraestructura del cliente"}
              - {id: CRM-00.01.01.06, c: A, fase: 0, svc: core, estado: pendiente, t: "Aislamiento a nivel de cómputo: pools de workers dedicados por tenant o por tier"}
              - {id: CRM-00.01.01.07, c: C, fase: 0, svc: core, estado: hecho, reutiliza: "contecmind:app/core/cache_registry.py", t: "Aislamiento de caché: namespacing obligatorio de claves por tenant y purga selectiva"}
              - {id: CRM-00.01.01.08, c: C, fase: 0, svc: core, estado: hecho, reutiliza: "contecmind:app/core/storage.py (S3/MinIO, URLs firmadas)", t: "Aislamiento de almacenamiento de ficheros: bucket/prefijo por tenant, URLs firmadas de vida corta"}
              - {id: CRM-00.01.01.09, c: C, fase: 0, svc: core, estado: hecho, reutiliza: "contecmind:app/core/search (filtro forzado por tenant)", t: "Aislamiento de índices de búsqueda (índice por tenant o filtro forzado a nivel de motor)"}
              - {id: CRM-00.01.01.10, c: A, fase: 0, svc: core, estado: hecho, reutiliza: "contecpos:packages/common/src/bus.ts (subjects por tenant)", t: "Aislamiento de colas y streams: partición o topic por tenant para evitar bloqueo cruzado"}

