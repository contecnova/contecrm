              - {id: CRM-00.05.04.04, c: A, fase: 0, svc: core, estado: hecho, reutiliza: "contecmind:scripts/audit_purge.py", t: "Retención configurable del log y exportación a SIEM"}
              - {id: CRM-00.05.04.05, c: A, fase: 0, svc: core, estado: hecho, reutiliza: "contecmind:app/api/admin_audit.py", t: "Consulta y alertado sobre el audit trail desde la propia plataforma"}
              - {id: CRM-00.05.04.06, c: D, fase: 2, svc: core, estado: hecho, t: "Event sourcing opcional en agregados críticos para reconstrucción de estado"}

      - id: "0.6"
        nombre: Observabilidad y operación
        funciones:

          - id: CRM-00.06.01
            nombre: Telemetría
            capacidades:
              - {id: CRM-00.06.01.01, c: C, fase: 0, svc: core, estado: hecho, reutiliza: "contecmind:app/core/logging.py (structlog + redacción PII)", t: "Logs estructurados con tenant_id, trace_id, user_id y correlación extremo a extremo", sin_pantalla_porque: "Los logs estructurados los consume la herramienta de observabilidad de quien opera la plataforma; replicar un visor de logs dentro del CRM seria una peor version de la que ya usan"}
              - {id: CRM-00.06.01.02, c: C, fase: 0, svc: core, estado: hecho, reutiliza: "contecmind:app/core/metrics.py (577 líneas, Prometheus)", t: "Métricas por tenant: latencia, throughput, tasa de error, saturación"}
              - {id: CRM-00.06.01.03, c: A, fase: 0, svc: core, estado: hecho, reutiliza: "contecmind:app/core/tracing.py (OpenTelemetry) + contecpos:packages/common/src/otel.ts", t: "Trazas distribuidas (OpenTelemetry) a través de servicios y orquestaciones", sin_pantalla_porque: "Las trazas distribuidas se miran en el visor de trazas, que es donde estan las de los demas sistemas; una traza suelta sin sus vecinas no sirve para encontrar nada"}
              - {id: CRM-00.06.01.04, c: A, fase: 0, svc: ops, estado: hecho, reutiliza: "contecmind:ops/prometheus/governance_alerts.yml", t: "SLO y error budget definidos por servicio y por tier de cliente"}
              - {id: CRM-00.06.01.05, c: C, fase: 0, svc: ops, estado: hecho, reutiliza: "contecmind:ops/alertmanager + app/services/alert_dispatch.py", t: "Alertado accionable con runbooks enlazados"}
              - {id: CRM-00.06.01.06, c: A, fase: 0, svc: tenancy, estado: hecho, reutiliza: "contecmind:app/services/health_monitor.py + app/api/admin_health.py", t: "Panel de salud visible por el propio tenant (status page privada)"}
              - {id: CRM-00.06.01.07, c: A, fase: 0, svc: core, estado: hecho, reutiliza: "contecmind:tests/unit/test_query_count_ratchet.py + contecflow-PSA:docs/INDEX_TUNING.md", t: "Auditoría de rendimiento por consulta y detección de queries degradadas por tenant"}

