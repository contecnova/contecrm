              - {id: CRM-05.01.02.05, c: A, fase: 2, svc: analytics, estado: hecho, reutiliza: "contecintelligence (RT-4: delegado, no se reimplementa)", t: "Suscripción, alertas por umbral y notificación de anomalías"}
              - {id: CRM-05.01.02.06, visto: '2026-10-05 CERRADO, los dos matices del 04-10. (1) El actua_como YA ACOTA: datos_del_embebido ejecuta el informe con los roles de la persona a la que el enlace representa, que identity resuelve por una ruta interna firmada (alcance_de_usuario); antes se guardaba, se devolvia y no lo aplicaba nadie. (2) Ya no hace falta sesion del CRM: el servidor de la aplicacion anfitriona cambia el secreto por un ticket corto en POST /cuadros-mando/embebidos/abrir y el navegador solo lleva el ticket, que no lleva permisos y no vale para ninguna otra ruta. El SSO del anfitrion se federa por el campo sujeto, que se resuelve contra las membresias de verdad: lo que el anfitrion afirma es QUIEN mira, no que puede ver. Con modo_alcance=quien_mira el cuadro se calcula con el alcance de esa persona y sin sujeto no se sirve. El filtro de dominio sigue igual de bien hecho (exacto o subdominio, nunca contiene)', c: A, fase: 2, svc: analytics, estado: hecho, reutiliza: "contecintelligence (RT-4: delegado, no se reimplementa)", t: "Embebido de dashboards en aplicaciones externas con SSO"}
          - id: CRM-05.01.04
            nombre: Explotación delegada en contecintelligence
            capacidades:
              - {id: CRM-05.01.04.01, c: C, fase: 2, svc: analytics, estado: hecho, reutiliza: "contecintelligence:sdk (canje de credencial por token de usuario final)", t: "Canje en el servidor de la credencial de aplicación por un token de usuario final con tenant, sujeto, rol y alcances"}
              - {id: CRM-05.01.04.02, visto: '2026-09-30 FALTABA EL CABLE y se ha puesto: la tabla y la ruta manual existian y no las rellenaba nadie, asi que todo tenant nuevo nacia sin organizacion. analytics consume tenant.provisioned y la crea con el SLUG, no con el nombre comercial: el slug es inmutable por diseno y contecintelligence solo acepta nombres que ya conoce. Por eso el renombrado no se propaga, no hay nada que propagar. Idempotente: una reentrega no devuelve a pendiente una organizacion verificada. Mutado quitando la creacion (caen 4) y rompiendo la idempotencia (cae 1)', c: C, fase: 2, svc: analytics, estado: hecho, reutiliza: "contecintelligence:/api/admin/apps (mapeo de organizaciones)", t: "Correspondencia entre cada tenant de contecrm y su organización en contecintelligence, creada al provisionar"}
              - {id: CRM-05.01.04.03, c: C, fase: 2, svc: analytics, estado: hecho, t: "Pantalla de explotación dentro de contecrm: se pregunta y se ven tablas y gráficos sin salir del CRM"}
              - {id: CRM-05.01.04.04, c: C, fase: 2, svc: analytics, estado: hecho, t: "Registro del CRM como fuente consultable, descrita en lenguaje natural y mantenida al día con el modelo"}
              - {id: CRM-05.01.04.05, c: C, fase: 2, svc: analytics, estado: hecho, t: "Propagacion de permisos y comparticion: la consulta analitica nunca devuelve mas de lo que el usuario ve en el CRM"}
              - {id: CRM-05.01.04.06, c: A, fase: 2, svc: analytics, estado: hecho, t: "Preguntas guardadas y publicadas como informe del tenant, con su programación y distribución desde el CRM"}
              - {id: CRM-05.01.04.07, c: A, fase: 2, svc: analytics, estado: hecho, t: "Auditoría de las consultas analíticas: quién preguntó qué, sobre qué datos y qué se le devolvió"}
              - {id: CRM-05.01.04.08, visto: '2026-09-29 con contecintelligence caído: el CRM arranca igual, el diagnóstico dice «no responde» y qué sí funciona, y CI_OBLIGATORIO_PARA_ARRANCAR sí lo para', c: A, fase: 2, svc: analytics, estado: hecho, t: "Degradación explicada cuando contecintelligence no responde: el CRM sigue operativo y la explotación avisa"}
              - {id: CRM-05.01.04.10, visto: '2026-09-29 contecintelligence respondiendo en 8100: comprobar() lo alcanza y el arranque no se para, pero avisa de la degradacion y distingue caido de sin configurar', c: C, fase: 2, svc: analytics, estado: hecho, t: "contecintelligence como dependencia de despliegue: la pila lo levanta, o se configura la dirección de uno ya en marcha"}
