              - {id: CRM-07.04.03.17, visto: '2026-10-26 Pantalla pintada con el contrato real del servidor: los tres cubos reparten por plazo y el reloj del SLA sale de «vence_resolucion_at». Leia «numero», «vence_at», «cola» y «escalado», que la API no manda: todos los casos caian en «con margen», el reloj decia siempre «sin plazo» y el numero salia en blanco', c: C, fase: 3, svc: front, estado: hecho, cubre: "4.1", t: "Casos: bandeja, ficha, SLA con reloj, escalado, jerarquía de casos y resolución"}
              - {id: CRM-07.04.03.18, visto: '2026-10-26 Pintada: los canales van mezclados en UNA sola cola y el canal es una etiqueta, no una pestana — con una bandeja por canal el correo se mira dos veces al dia y el chat todo el rato, y quien escribe por correo espera el doble sin que nadie lo haya decidido. Lo vencido se ve como vencido, y con la cola vacia la pantalla dice algo en vez de quedarse en blanco, que se leeria como «todavia esta cargando»', c: A, fase: 3, svc: front, estado: hecho, cubre: "4.2", t: "Omnicanalidad: consola de agente con conversaciones de varios canales en una sola cola"}
              - {id: CRM-07.04.03.19, visto: '2026-10-26 Pintada: lo publicado y lo que esta sin aprobar NO se pintan igual — un borrador que parece publicado se cita en un caso como si estuviera revisado, y lo que llega al cliente es un texto que nadie aprobo. Y «no se sabe si fue util» no se pinta como cero: se leerian igual y significan lo contrario, y con el cero el articulo se reescribe sin motivo', c: A, fase: 3, svc: front, estado: hecho, cubre: "4.3", t: "Conocimiento y autoservicio: artículos, aprobación, búsqueda y portal del cliente"}
              - {id: CRM-07.04.03.20, visto: '2026-10-05 AUDITADO, con un hallazgo cerrado. Planificacion, ruta, partes y activos estan completos y con ruta —y sin coordenadas se dice que el orden NO esta optimizado en vez de fingirlo—. Lo que faltaba: generar_preventivas tenia ruta y ningun reloj detras. Un plan mensual existe para que nadie tenga que acordarse; si la orden solo sale cuando alguien pulsa, el plan es una anotacion y la maquina se revisa cuando se rompe. Y no hay error: el panel ensena los planes, las fechas salen bien calculadas y no hay ordenes. Ahora corre por tenant en el relevo de `service`', c: D, fase: 6, svc: front, estado: hecho, cubre: "4.4", t: "Servicio de campo: planificación, mapa de técnicos, partes de trabajo y activos instalados"}
              - {id: CRM-07.04.03.21, visto: '2026-10-26 Modulo de la consola recorrido: se abrieron sus 5 pestanas contra el servicio dueno, una a una, como las abre quien entra — y las 5 contestan. Lo que esto caza y los gates de al lado no: una ruta que existe en el contrato y aun asi da 403 porque el permiso que exige no es el que el modulo supone, 422 porque pide un parametro que la pestana no manda, o 404 porque el servicio declarado no es el que la publica. Las tres se ven igual desde dentro: una pestana con su rotulo y un error. Mutado: apuntando una pestana a una ruta que no existe, el barrido la delata', c: D, fase: 6, svc: front, estado: hecho, cubre: "4.5", t: "Postventa: devoluciones, garantías y logística inversa"}
              - {id: CRM-07.04.03.22, visto: '2026-10-26 Modulo de la consola recorrido: se abrieron sus 7 pestanas contra el servicio dueno, una a una, como las abre quien entra — y las 7 contestan. Lo que esto caza y los gates de al lado no: una ruta que existe en el contrato y aun asi da 403 porque el permiso que exige no es el que el modulo supone, 422 porque pide un parametro que la pestana no manda, o 404 porque el servicio declarado no es el que la publica. Las tres se ven igual desde dentro: una pestana con su rotulo y un error. Mutado: apuntando una pestana a una ruta que no existe, el barrido la delata', c: C, fase: 2, svc: front, estado: hecho, cubre: "5.1", t: "Explotación embebida de contecintelligence: informes, cuadros de mando y exportaciones, con la identidad del usuario (RT-4)"}
              - {id: CRM-07.04.03.23, visto: '2026-10-26 Pintada: la puntuacion sale con su PORQUE y con de donde sale —una puntuacion que no se puede discutir acaba ignorandose, y esto es una copia: el detalle vive en quien la calcula—. «No medido» no se pinta como «va mal», que es lo que hace que alguien llame a un cliente que esta bien, y una medida vieja lo dice en vez de pasar por actual', c: A, fase: 5, svc: front, estado: hecho, cubre: "5.2", t: "Inteligencia artificial: asistente, resúmenes, sugerencias y puntuaciones, siempre con el porqué y con la fuente a la vista"}
              - {id: CRM-07.04.03.24, visto: '2026-10-26 Pintada: lo que NO se ha medido no sale en verde —una conexion sin ultima sincronizacion no es sana, es una de la que no se sabe nada— y sin ninguna conexion lo dice en vez de tranquilizar. HALLAZGO: decia CUANTAS estaban sin medir y no CUALES, cuando las paradas si salen con su nombre; quien leia «1 conexion sin medir» no sabia cual, que es lo primero que hace falta para arreglarlo. Arreglado', c: A, fase: 1, svc: front, estado: hecho, cubre: "6.1", t: "Puesto de trabajo: correo y calendario sincronizados, y complemento para el cliente de correo"}
              - {id: CRM-07.04.03.25, c: C, fase: 1, svc: front, estado: hecho, cubre: "6.2", t: "Colaboración: comentarios, menciones, notificaciones, adjuntos, carpetas del expediente y corpus documental de contecmind (RT-5)"}
              - {id: CRM-07.04.03.26, c: C, fase: 1, svc: front, estado: hecho, cubre: "7.1", t: "Consola de administración dirigida por la superficie: menú, formularios y tablas generados del contrato, sin una sola acción que no sea una llamada publicada"}
              - {id: CRM-07.04.03.27, visto: '2026-10-26 Pintada con lo que el servidor manda de verdad. Leia hay_desvio —undefined, asi que el aviso salia SIEMPRE en verde— y diferencias, a la que pedia .length, lo que tumbaba la pantalla entera. Ahora lee limpio, tocado_a_mano y desaparecido, dice por que cuando no se puede medir y ensena que quedo sin comparar', c: A, fase: 2, svc: front, estado: hecho, cubre: "7.2", t: "ALM: entornos, paquetes de cambios, promoción entre entornos, detección de desvío y vuelta atrás"}
              - {id: CRM-07.04.03.28, visto: '2026-10-26 Modulo de la consola recorrido: se abrieron sus 6 pestanas contra el servicio dueno, una a una, como las abre quien entra — y las 6 contestan. Lo que esto caza y los gates de al lado no: una ruta que existe en el contrato y aun asi da 403 porque el permiso que exige no es el que el modulo supone, 422 porque pide un parametro que la pestana no manda, o 404 porque el servicio declarado no es el que la publica. Las tres se ven igual desde dentro: una pestana con su rotulo y un error. Mutado: apuntando una pestana a una ruta que no existe, el barrido la delata', c: A, fase: 1, svc: front, estado: hecho, cubre: "7.3", t: "Gobierno y cumplimiento: retención, bloqueos legales, derechos del interesado, GRC con riesgos, controles, cobertura del catálogo y SoD"}
              - {id: CRM-07.04.03.29, visto: '2026-10-26 Pintada: cuanto hay, cuanto cabe y que se esta aplazando, que es la pregunta que llega de verdad a soporte. HALLAZGO: decia «el sistema esta bajo presion» y no decia DE QUIEN —el servidor manda el peor servicio y su explicacion— ni quien no habia contestado, cuando el comentario del codigo prometia justo eso: un servicio que no contesta no cuenta como tranquilo. Arreglado', c: A, fase: 2, svc: front, estado: hecho, cubre: "8.1", t: "Rendimiento a la vista: volumetría, límites del plan y por qué una lista tarda lo que tarda"}
              - {id: CRM-07.04.03.30, visto: '2026-10-26 Pintada: lo prometido y lo medido al lado, y lo que no se puede medir lo dice —un cero se leeria como «se cumple»—. Comprobado ademas que si los compromisos fallan, el estado de los componentes sigue ahi: es lo urgente cuando algo va mal, y perderlo por no poder leer un numero de contrato seria el peor momento', c: A, fase: 2, svc: front, estado: hecho, cubre: "8.2", t: "Compromisos de servicio: RPO, RTO, disponibilidad y ventanas de mantenimiento, con lo medido al lado de lo prometido"}
              - {id: CRM-07.04.03.31, visto: '2026-10-26 Modulo de la consola recorrido: se abrieron sus 2 pestanas contra el servicio dueno, una a una, como las abre quien entra — y las 2 contestan. Lo que esto caza y los gates de al lado no: una ruta que existe en el contrato y aun asi da 403 porque el permiso que exige no es el que el modulo supone, 422 porque pide un parametro que la pestana no manda, o 404 porque el servicio declarado no es el que la publica. Las tres se ven igual desde dentro: una pestana con su rotulo y un error. Mutado: apuntando una pestana a una ruta que no existe, el barrido la delata', c: A, fase: 2, svc: front, estado: hecho, cubre: "9.1", t: "Proveedores: homologación, documentos con vigencia, riesgo de dependencia y evaluación con hechos medidos"}
              - {id: CRM-07.04.03.32, visto: '2026-10-26 Pintada: lo que queda de verdad con un proveedor y el aviso de que si se ganan todas las ofertas abiertas no cabe. Esa conversacion es mejor tenerla antes de mandar la cuarta oferta que en la semana de la entrega', c: A, fase: 2, svc: front, estado: hecho, cubre: "9.2", t: "Coste y capacidad: tarifa del proveedor, margen de la oferta, comparación entre proveedores y qué se puede comprometer"}

              - {id: CRM-07.04.03.33, visto: '2026-10-26 Pintada: abre por el capitulo de la pantalla en la que estas y no por el indice —mandar al indice es mandar a buscar, y quien esta atascado no busca: se rinde y escribe a soporte—, y desde una pantalla sin capitulo propio sigue llevando al manual en vez de dejar un hueco', c: A, fase: 1, svc: front, estado: hecho, cubre: "7.5", t: "Ayuda en producto: el manual de usuario accesible desde la pantalla en la que estás, no en otro sitio"}

          - id: CRM-07.04.04
            nombre: Calidad del front
            capacidades:
              - {id: CRM-07.04.04.01, visto: '2026-10-04 Playwright instalado (1.62.1, el chromium 1234 ya estaba en cache: sin descarga) y barrido de las 22 pantallas fijas: montan, no dejan la aplicacion en blanco y no se desbordan a 1280 px. NO comprueba que cada una ensene lo que dice: eso pide un doble con la forma correcta de cada llamada, pantalla a pantalla, y no esta hecho. Montandolo aparecio que NO HABIA NINGUNA FRONTERA DE ERROR en todo el front: un TypeError al pintar dejaba el body vacio, sin mensaje ni menu ni forma de volver. Arreglado y validado quitandola', c: C, fase: 1, svc: front, estado: hecho, reutiliza: "contecmind:frontend/vitest.config.ts + playwright.config.ts", t: "Pruebas de componente y de extremo a extremo sobre la pila real, sin API simulada"}
              - {id: CRM-07.04.04.02, c: C, fase: 1, svc: front, estado: hecho, t: "Comprobación automática de accesibilidad en las pantallas principales"}
              - {id: CRM-07.04.04.03, c: A, fase: 1, svc: front, estado: hecho, t: "Presupuesto de rendimiento: tamaño del paquete y tiempo hasta interactivo, comprobados en el preflight local"}
              - {id: CRM-07.04.04.04, c: A, fase: 1, svc: front, estado: hecho, reutiliza: "contecmind:frontend/scripts/check-dead-exports.mjs", t: "Tipado estricto, cero exportaciones muertas y tipos de la API generados del OpenAPI"}
              - {id: CRM-07.04.04.05, c: C, fase: 1, svc: front, estado: hecho, t: "Repartir la tabla de recursos fuera del módulo de entrada: medido el 27-10-2026, son 168,5 kB en crudo y 42,3 kB comprimidos de los 109 que el navegador descarga antes de pintar nada —el 39 %— y sólo la necesitan la pantalla de módulo, la ficha, la paleta, las acciones y las referencias. Está ahí porque la barra lateral filtra los módulos por el permiso de sus recursos; la barra ya filtra de forma asíncrona, así que puede esperar a que llegue", visto: "2026-10-27 HECHO, y con una correccion de la medida que lo motivo. La tabla de pestanas sale de `modulos.ts` a `recursos.ts` y el marco se queda con un RESUMEN derivado —de cada pestana, su ruta, su permiso y si es solo de plataforma—, generado por un script y comprobado por un gate: dos listas a mano acaban diciendo cosas distintas y entonces no se sabe cual manda. La medida que justificó esto estaba MAL y queda dicho: 42,3 kB era un tramo del chunk —todo lo que había entre la primera y la última ruta de API— y no la tabla. La tabla son 4,7 kB comprimidos. Lo que SÍ baja, medido sobre el paquete construido: la apertura pasa de 130,4 a 115,3 kB comprimidos, un 11,6 % menos, porque al sacarla se pudieron diferir además la pantalla de módulo, la ficha y la de cliente, que son las que la arrastraban"}
          - id: CRM-07.04.05
            nombre: Cobertura y demostración
            capacidades:
              - {id: CRM-07.04.05.01, c: C, fase: 1, svc: front, estado: hecho, t: "Cobertura medida contra el catálogo: cada sección funcional tiene pantalla declarada, y un gate falla si se añade una sección sin ella"}
              - {id: CRM-07.04.05.02, visto: '2026-10-26 AUDITADO Y AMPLIADO. El informe que habia mide OPERACIONES publicadas: cuantas rutas de la API tienen pantalla. Util, y no contesta la pregunta del catalogo, que es que sabe hacer el CRM que ninguna pantalla ensena. Se ha construido la medida que faltaba, sobre capacidades, con tope que solo baja y gate propio en preflight. Primera medida del 26-10-2026: 684 de 753 capacidades hechas no las nombraba ninguna pantalla, y 53 de las 69 que si eran las propias capacidades de front — o sea que de todo lo demas que sabe hacer el producto, 16 estaban declaradas. Mismo mecanismo que las pruebas que citan por identificador y por el mismo motivo: declarar obliga a mirar la pantalla. Las pruebas del front NO cuentan, y hay una prueba que lo comprueba plantando el caso', c: C, fase: 1, svc: front, estado: hecho, t: "Informe de cobertura al revés: capacidades hechas que ninguna pantalla enseña, para que la potencia del sistema no quede escondida en la API"}
              - {id: CRM-07.04.05.03, c: C, fase: 1, svc: front, estado: hecho, t: "Modo demostración: un tenant de muestra con datos coherentes que permite enseñar el sistema entero sin tocar datos reales"}
              - {id: CRM-07.04.05.04, c: A, fase: 1, svc: front, estado: hecho, t: "Recorrido guiado por la solución, construido desde el catálogo, que enseña cada módulo con lo que de verdad hace hoy"}
              - {id: CRM-07.04.05.05, visto: '2026-10-26 AUDITADO CON HALLAZGO, y cerrado. Cada pantalla declaraba UNA capacidad —la de front que es esa pantalla— y ninguna de producto, asi que el informe de cobertura concluia que el CRM esconde casi todo lo que sabe hacer. Se ha separado en dos campos: `capacidad` dice que capacidad de front es la pantalla y `capacidades` dice que se ve en ella. Declarados los 24 modulos genericos y siete pantallas a medida: 144 capacidades en una pasada, sin construir ninguna pantalla nueva, porque estaban todas construidas y no lo decia nadie. La lista SE PINTA en la cabecera de la pantalla, plegada, que es lo unico que hace caro declarar algo que no se ensena: una declaracion falsa la ve el primero que entra. Probado ademas que no se repite un identificador, que no se cuela la capacidad de front entre las de producto y que una capacidad no se declara en dos modulos a la vez', c: A, fase: 2, svc: front, estado: hecho, t: "Cada pantalla declara qué capacidades del catálogo implementa, consultable desde la propia interfaz"}
              - {id: CRM-07.04.05.06, visto: '2026-10-27 HECHO, y con un hallazgo por el camino. Primero se escribio un sembrador nuevo; al ir a documentarlo aparecio que `scripts/sembrar_empresa.py` YA ERA el mecanismo de volumen, documentado en dos manuales. Dos sembradores paralelos son el defecto, no la solucion, asi que se ha consolidado en uno: `scripts/datos_demo.py` aporta solo lo que no habia —el eje de diez anios, el catalogo de productos, las campanas y el parque instalado— y `sembrar_empresa.py` lo consume. Lo que no existia y ahora si: fechas repartidas en el periodo (antes TODO se creaba hoy: actividades entre -90 y +45 dias, casos en los ultimos 120, oportunidades en +-210), historial de etapas, presupuestos con lineas, aprobaciones por descuento, pedidos, programas y campanas con su consumo, tecnicos, parque instalado y ordenes de trabajo. Seis fallos cazados MIDIENDO y ninguno visible en pantalla: un contacto nacido antes que su cuenta por el ajuste de agosto, actividades apuntadas en el futuro, el 76 % de SLA incumplido por sortear horas sueltas en vez de medir contra el plazo de cada tier, dos etapas del embudo vacias por fijar la profundidad a tres, las ofertas atadas por nombre —310 oportunidades con dos ofertas y 235 ganadas sin pedido—, y los cortes de idempotencia sin filtrar por tenant, que dejaban la SEGUNDA empresa sin sembrar diciendo «ya hay». Hay `--comprobar`: 21 comprobaciones que dicen cuantas filas recorrieron, validadas plantando tres casos malos', c: C, fase: 1, svc: front, estado: hecho, t: "Sistema de demostración poblado: diez años de actividad coherente y relacionada en TODAS las opciones —clientes con su historia, oportunidades ganadas y perdidas, casos con su SLA, campañas con sus resultados, encargos a proveedor, aprobaciones, auditoría— generada por un mecanismo repetible que levanta un sistema de demostración entero, como en contecintelligence. Lo que hay hoy (CRM-07.04.05.03) siembra un tenant de muestra: basta para probar que una pantalla pinta, y no para enseñar el producto, porque casi toda pantalla sale vacía o con tres filas"}


