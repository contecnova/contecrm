            nombre: Ciclo de vida del caso
            capacidades:
              - {id: CRM-04.01.01.01, visto: '2026-10-28 AUDITADO CON HALLAZGO, y cerrado. La severidad es la misma pregunta en tres sitios y estaba escrita tres veces. La del caso era lista cerrada de cuatro; la del problema era TEXTO LIBRE —«Alta», «ALTA» y «muy alta» se guardaban las tres, contaban como tres severidades al agrupar y salian asi al bus en `problem.opened`—; y `integration.telemetria` mantenia su propia copia de la lista para mandarla en el comando que abre un caso. La copia coincidia, pero el dia que dejara de coincidir el aparato avisa, el comando sale, el que lo recibe lo rechaza por severidad no valida y EL CASO NO SE ABRE: las dos mitades en verde y la atencion sin enterarse. `crmcore.contratos` no lo caza, porque comprueba que el sobre lleve el campo y no que los dos lados entiendan lo mismo por su valor. La lista vive ahora en `crmcore/vocabularios.py`, que es donde van las cerradas que cruzan de un servicio a otro; la prioridad NO cruza y se queda en service. Dos pruebas, las dos validadas plantando el caso malo', c: C, fase: 3, svc: service, estado: hecho, reutiliza: "contecflow-PSA:app/models/service_desk/tickets.py + app/services/service_desk/", t: "Caso con tipo, categoría, subcategoría, prioridad, severidad, origen y estado"}
