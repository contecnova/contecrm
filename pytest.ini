[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts =
    -ra
    --strict-markers
    --tb=short
    -p no:cacheprovider
markers =
    # Se aplica AUTOMÁTICAMENTE en `pytest_collection_modifyitems` (ver
    # `tests/conftest.py`): no hay que acordarse de ponerlo, así que no se
    # puede quedar desactualizado.
    #
    #     pytest -m "not db"   → ciclo de segundos, sin infraestructura
    #     pytest -m db         → solo lo que necesita Postgres levantado
    #
    # Existe porque el gate de pre-push corre la suite entera, y en una máquina
    # sin Postgres eso lo haría inpasable: el hook corre todo lo que PUEDE y
    # dice explícitamente qué no ha cubierto.
    db: Necesita un Postgres accesible. Se marca solo; no lo pongas a mano.
    bus: Necesita un bus real (NATS o Redis). Se marca solo.
    slow: Tarda más de 3 s.
    # LO QUE NO SE PUEDE ARREGLAR DESPUÉS DE SUBIRLO, y por eso no sale del
    # push aunque el resto de la suite sí. Se pone A MANO en el fichero
    # (`pytestmark = pytest.mark.despliegue`), no por una lista central: una
    # lista se queda atrás en cuanto alguien añade una prueba, y quien la añade
    # es justo quien sabe si lo que comprueba puede esperar al lunes.
    #
    #     pytest -m "db and despliegue"       → lo que corre el push
    #     pytest -m "db and not despliegue"   → lo que corre el bloque
    #
    # Aquí dentro: que ningún tenant vea lo de otro, que ninguna ruta publicada
    # deje de responder, y que el aislamiento sobreviva a una baja.
    despliegue: Su fallo llega a producción y no se arregla después.
    integration: Levanta la aplicación completa.
