server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Cabeceras de seguridad del cliente (CRM-07.04.02.04). La CSP no admite
  # `eval` ni estilos en línea: una aplicación que los necesita es una que puede
  # ejecutar lo que le inyecten. `connect-src` se deja abierto a `self` porque
  # la API va detrás del mismo proxy; si el gateway está en otro origen, se
  # añade ahí y en ningún otro sitio.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "same-origin" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

  # `config.json` NO se cachea: es lo que cambia por instalación, y servirlo de
  # caché haría que un cambio de configuración tardara en verse lo que tarde en
  # caducar el fichero.
  location = /config.json {
    add_header Cache-Control "no-store" always;
  }

  location /assets/ {
    # Los assets llevan hash en el nombre: son inmutables por construcción.
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # Enrutado del lado del cliente: cualquier camino desconocido devuelve el
  # index. Sin esto, recargar en `/administracion` da un 404 de nginx.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
