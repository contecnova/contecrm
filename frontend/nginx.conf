server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Cabeceras de seguridad del cliente (CRM-07.04.02.04). La CSP no admite
  # `eval` ni estilos en línea: una aplicación que los necesita es una que puede
  # ejecutar lo que le inyecten. `connect-src` se deja abierto a `self` porque
  # la API va detrás del mismo proxy; si el gateway está en otro origen, se
  # añade ahí y en ningún otro sitio.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "same-origin" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

  # `config.json` NO se cachea: es lo que cambia por instalación, y servirlo de
  # caché haría que un cambio de configuración tardara en verse lo que tarde en
  # caducar el fichero.
  location = /config.json {
    add_header Cache-Control "no-store" always;
  }

  # El service worker (CRM-06.02.01.04) tampoco: el navegador lo revisa en cada
  # carga, y con caché larga una versión nueva tardaría días en llegar.
  location = /sw.js {
    add_header Cache-Control "no-cache" always;
  }

  # El componente incrustable (CRM-00.02.03.05), en una ruta ESTABLE: es lo que
  # pega el cliente en su web y no se puede cambiar en cada versión. Por eso
  # no lleva hash ni caché inmutable: una hora, y después el navegador revisa
  # con el `ETag` y sólo baja lo que ha cambiado.
  #
  # Lo pide otra web, así que `*` y **sin credenciales**: nada de la sesión de
  # la consola tiene que ver con él, y un `script type="module"` de otro origen
  # no llega a ejecutarse sin la cabecera de CORS. Las cabeceras de seguridad
  # de arriba no se heredan cuando una `location` pone las suyas: se repite la
  # que importa para un script.
  location = /embebido.js {
    add_header Cache-Control "public, max-age=3600" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location /assets/ {
    # Los assets llevan hash en el nombre: son inmutables por construcción.
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # La API, por el MISMO origen. Esto faltaba, y la consola no podía entrar:
  # `apiBase` vacío significa «mismo origen», así que el `POST /api/v1/sesion/
  # entrar` caía en el `location /` de aquí abajo, que sirve ficheros — y a un
  # fichero no se le hace POST. nginx contestaba **405 Not Allowed** en la
  # pantalla de entrada. El `GET` era peor: devolvía el `index.html` con un 200,
  # así que parecía que la API respondía.
  #
  # Va antes que el `location /` a propósito: nginx casa por prefijo más largo,
  # pero dejarlo detrás haría creer que el orden no importa.
  #
  # Por el mismo origen y no llamando al gateway desde el navegador: así la
  # cookie de sesión es de primera parte, la CSP puede seguir con
  # `connect-src 'self'` y no hace falta CORS. Un front que habla con otro
  # origen obliga a abrir las tres cosas.
  location /api/ {
    proxy_pass http://gateway:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Las respuestas en flujo (descargas, exportaciones) no se acumulan en memoria.
    proxy_buffering off;
    # Un informe grande tarda; el plazo por defecto de 60 s lo cortaría a mitad.
    proxy_read_timeout 300s;
  }

  # Enrutado del lado del cliente: cualquier camino desconocido devuelve el
  # index. Sin esto, recargar en `/administracion` da un 404 de nginx.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
