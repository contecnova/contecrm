# Configuración de herramientas. Existe desde el primer commit a propósito: en
# las otras soluciones de la casa se añadió tarde y hubo que congelar como
# baseline un centenar de violaciones ya commiteadas.

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", "var", "data"]

[tool.ruff.lint]
# Default de ruff (E4, E7, E9, F) más `B` (bugbear: cazan bugs reales, no
# estilo) e `I` (orden de imports, que evita diffs de ruido).
extend-select = ["B", "I"]
ignore = [
    # `Depends(...)` / `Query(...)` como valor por defecto es EL patrón de
    # FastAPI, no un bug. Falso positivo conocido de B008.
    "B008",
    # El repositorio lanza a propósito sin `from` en los manejadores de dominio:
    # el error de dominio ya lleva su propio contexto y encadenar la excepción
    # interna solo filtra detalles de implementación al cliente.
    "B904",
]

[tool.ruff.lint.per-file-ignores]
# Los `__init__.py` reexportan; un import "sin usar" ahí es la interfaz.
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
# Se empieza laxo y se aprieta por módulos a medida que se estabilizan. Poner
# `strict = true` el primer día en un repositorio que aún se está escribiendo
# produce ruido, no señal.
ignore_missing_imports = true
